swift_trail_leggings.name: Swift Trail Leggings
ember_of_the_ancestors.name: Ember of the Ancestors
obsidian_warblade.name: Obsidian Warblade
stormcallers_boots.name: Stormcaller's Boots
crown_of_the_tireless.name: Crown of the Tireless
