# The item catalogue names. One `<key>.name` entry per item in `config/game/v1/items.yaml`
# — the key in lowercase, as `ItemTranslator` looks it up. A coverage test refuses an
# incomplete catalogue, otherwise the translator's fallback would send the raw key to the
# player, silently.

