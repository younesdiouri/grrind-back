# English titles. See `titles.fr.yaml` for the conventions — one `<id>.name` and one
# `<id>.hint` per entry of `config/game/v1/titles.yaml`, thresholds passed as `%threshold%`
# and `%hours%` rather than spelled out.
#
# This is also the fallback catalogue (`framework.translator.fallbacks`): a key missing here
# ships the raw identifier to players, whichever language they asked for.

