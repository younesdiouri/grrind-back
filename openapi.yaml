            default: 20
            maximum: 50
            minimum: 1
      responses:
        '200':
          description: "Une page d'historique, du plus récent au plus ancien."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
