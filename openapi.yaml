openapi: 3.0.0
info:
  title: GRRIND
  description: "L'API de GRRIND — le sport en RPG : XP, niveaux, titres, arbres de compétences, loot, séries.\n\n**Le serveur arbitre l'horloge.** L'import accepte les bornes du **fournisseur santé** — une\nséance a eu lieu avant que Grrind en entende parler, aucune horloge serveur n'existe pour un\nfait passé. Ce qu'il n'accepte pas, c'est une **durée** : elle se recalcule des deux bornes.\nLe reste de l'arbitrage — fenêtre d'antériorité, chevauchements, plancher et plafond — refuse\nce qui ne tient pas debout.\n\n**Les écritures de jeu sont idempotentes.** Les routes qui accordent quelque chose exigent un\nen-tête `Idempotency-Key` : un client mobile rejoue ses requêtes, et le rejeu rend la réponse\nd'origine sans rien réexécuter.\n\n**Les erreurs sont en `application/problem+json`** (RFC 9457). Le membre `type` est un\nidentifiant stable sur lequel un client peut brancher un comportement ; le `detail` est du\ntexte, il peut changer.\n"
  version: 1.0.0
paths:
  /api/guilds:
    post:
      tags:
        - Guildes
      operationId: post_community_guild_found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuildName'
      responses:
        '201':
          description: "La guilde est fondée et l'appelant en est le fondateur : les deux dans le même geste."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guild'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: "Le joueur appartient déjà à une guilde (`player-already-in-a-guild`). Il doit la quitter avant d'en fonder une autre."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  '/api/guilds/{id}':
    get:
      tags:
        - Guildes
      operationId: get_community_guild_show
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "La même charge utile que `/api/guilds/mine`, sans l'enveloppe : ici la guilde existe forcément, puisqu'un non-membre reçoit 404."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Guildes
      operationId: delete_community_guild_dissolve
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: "La guilde et toutes ses adhésions sont parties dans la même transaction. Ses membres sont libres d'en fonder ou d'en rejoindre une autre."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Guildes
      operationId: patch_community_guild_rename
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuildName'
      responses:
        '200':
          description: 'La guilde renommée.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guild'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  '/api/guilds/{id}/invite-code':
    post:
      tags:
        - Guildes
      operationId: post_community_invite_code_issue
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: "Le nouveau code. **Il révoque le précédent** : une guilde n'a jamais deux codes vivants, et régénérer est le geste par lequel on coupe un code qui a trop circulé."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildInviteCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Guildes
      operationId: delete_community_invite_code_revoke
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: "Plus aucun code ne mène à cette guilde. Révoquer alors qu'il n'y avait rien à révoquer rend le même 204 : l'état visé est atteint."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/guilds/join:
    post:
      tags:
        - Guildes
      summary: "Le limiteur est **configuré, pas écrit** : la politique et les seuils vivent dans\n`config/packages/rate_limiter.yaml`, et l'attribut ne fait que désigner la clé."
      description: "Cette clé est le joueur et non l'IP — une IP mobile change en cours de trajet et se\npartage entre colocataires, alors que seul un compte authentifié peut consommer un\ncode. `args[\"user\"]` est l'argument du contrôleur, disponible parce que l'attribut\nest traité sur `kernel.controller_arguments`, après résolution."
      operationId: post_community_guild_join
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuildJoin'
      responses:
        '200':
          description: "Le joueur est entré. La guilde est rendue en entier, pour que l'écran s'affiche sans second appel."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guild'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 'Le code ne mène à rien : **inconnu, expiré ou révoqué, indistinctement** (`invite-code-not-usable`). Les distinguer dirait quels codes existent.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'Le joueur appartient déjà à une guilde (`player-already-in-a-guild`), ou celle-ci est complète (`guild-is-full`, qui porte sa `capacity`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/guilds/mine:
    get:
      tags:
        - Guildes
      operationId: get_community_guild_mine
      responses:
        '200':
          description: "La guilde du joueur et ses membres, ou `{\"guild\": null}` s'il n'en a pas. **Pas d'erreur dans ce second cas** : ouvrir l'onglet quand on n'a pas de guilde est une situation normale, pas une panne, et c'est l'écran qui invite à en fonder une."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyGuild'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/guilds/mine/leave:
    post:
      tags:
        - Guildes
      operationId: post_community_guild_leave
      responses:
        '204':
          description: "Le joueur est sorti. Trois issues invisibles pour lui, et toutes dans la même transaction :\nil s'en va simplement ; il était fondateur et la guilde passe **au membre le plus ancien** ;\nil était le dernier et la guilde est dissoute, code d'invitation compris."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "Le joueur n'a pas de guilde à quitter (`guild-not-found`)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/guilds/{id}/members/{playerId}':
    delete:
      tags:
        - Guildes
      operationId: delete_community_guild_exclude
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: playerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: "Le membre est sorti. **Il peut revenir avec un code valide** : il n'y a pas de liste\nnoire en v1, et le recours du fondateur est de révoquer le code — ce qui referme la\nguilde pour tout le monde."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: "La guilde est invisible à l'appelant (`guild-not-found`), ou le joueur visé n'en est pas membre (`player-is-not-a-member`)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: "Le fondateur a tenté de s'exclure lui-même (`founder-cannot-exclude-himself`). Il doit passer par `POST /api/guilds/mine/leave`, qui sait gérer la succession."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/players/{id}':
    get:
      tags:
        - Guildes
      operationId: get_community_player_show
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Le profil public. **Exactement le bloc servi dans la liste des membres** : mêmes ports, même ressource, donc un seul type à décoder côté client.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "Le joueur n'existe pas, **ou n'est ni soi-même ni un co-équipier** (`player-not-found`).\nLes deux cas rendent la même réponse, et **jamais 403** : un 403 confirmerait qu'un\ncompte porte cet UUID, et les UUID v7 encodent leur instant de création — l'API\ndeviendrait un moyen d'énumérer les comptes ouverts un jour donné."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/auth/login:
    post:
      tags:
        - Authentification
      operationId: post_identity_login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              type: object
      responses:
        '200':
          description: 'Identifiants acceptés.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: "Identifiants refusés (`invalid-credentials`). La réponse ne distingue pas une adresse inconnue d'un mot de passe faux, et le temps de réponse non plus (#39) — c'est aussi ce que reçoit un compte né d'un social sign-in, qui n'a pas de mot de passe."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security: []
  /api/auth/logout:
    post:
      tags:
        - Authentification
      summary: "Le jeton d'accès n'est pas requis : la preuve de possession du refresh token\nsuffit, et c'est justement quand le JWT vient d'expirer qu'on veut pouvoir\nse déconnecter proprement."
      operationId: post_identity_logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: "La famille entière est révoquée — c'est l'appareil qui se déconnecte, pas seulement ce jeton. Rien à rendre."
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security: []
  /api/me:
    get:
      tags:
        - Profil
      operationId: get_identity_me
      responses:
        '200':
          description: "Le profil, titre porté et titre visé compris : l'état du joueur en une requête à l'ouverture de l'app."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
        - Profil
      operationId: patch_identity_me_update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 'Le profil mis à jour. Les champs absents ne sont pas touchés.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/auth/refresh:
    post:
      tags:
        - Authentification
      operationId: post_identity_refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 'Une paire neuve. **Le jeton présenté est consommé** : il est à usage unique et rotatif.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: 'Jeton inconnu, expiré, **ou déjà consommé** (`invalid-refresh-token`). Un rejeu révoque toute la famille : on ne peut pas distinguer le voleur du vrai client qui a été doublé, donc on coupe.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security: []
  /api/auth/register:
    post:
      tags:
        - Authentification
      operationId: post_identity_register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: "Le compte est ouvert **et la session aussi** : forcer un login juste après ajouterait un aller-retour sur l'étape la plus fragile du tunnel."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '409':
          description: 'Adresse déjà prise (`email-already-used`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security: []
  '/api/auth/social/{provider}':
    post:
      tags:
        - Authentification
      operationId: post_identity_social_sign_in
      parameters:
        -
          name: provider
          in: path
          required: true
          schema:
            type: string
            pattern: google|apple
            enum:
              - google
              - apple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialSignInRequest'
      responses:
        '200':
          description: "Compte rattaché ou créé. Un compte né ici n'a pas de mot de passe et ne peut pas passer par `/api/auth/login`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: 'Le fournisseur a refusé le code (`social-sign-in-rejected`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: "L'adresse appartient à un compte existant que le fournisseur ne certifie pas (`email-belongs-to-another-account`) — sans certification, rattacher serait une prise de contrôle en une requête. Ou profil incomplet (`social-profile-incomplete`)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security: []
  /api/progression:
    get:
      tags:
        - Progression
      operationId: get_progression_state
      responses:
        '200':
          description: "L'état du joueur, servi du seul snapshot — aucune relecture du ledger."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progression'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/progression/history:
    get:
      tags:
        - Progression
      summary: "L'argument `#[MapQueryString]` n'est ni nullable ni pourvu d'un défaut, et c'est\nvoulu : le résolveur ne construit le DTO sur une query string vide que dans ce\ncas-là. Nullable, il faudrait un `?? new XpHistoryQuery()` à la main."
      operationId: get_progression_history
      parameters:
        -
          name: cursor
          in: query
          required: false
          schema:
            type: string
            nullable: true
            default: null
        -
          name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 50
            minimum: 1
      responses:
        '200':
          description: "Une page du ledger, la plus récente d'abord. C'est la vérité dont le niveau est une projection."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XpHistoryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/titles:
    get:
      tags:
        - Progression
      operationId: get_progression_titles
      responses:
        '200':
          description: 'Le catalogue entier, situé pour ce joueur.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TitleBoard'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/titles/active:
    put:
      tags:
        - Progression
      operationId: put_progression_titles_select
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectTitleRequest'
      responses:
        '200':
          description: "Le mur des titres, avec le nouveau titre porté. `titleId` à `null` n'en affiche aucun."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TitleBoard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 'Titre inconnu du catalogue (`title-unknown`) ou non débloqué par ce joueur (`title-not-unlocked`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/workouts/import:
    post:
      tags:
        - Entraînement
      operationId: post_training_workout_import
      parameters:
        -
          $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutImportRequest'
      responses:
        '200':
          description: 'La synchronisation, prête à être jouée. Un import où tout est écarté reste un succès.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/workouts:
    get:
      tags:
        - Entraînement
      operationId: get_training_workout_list
      parameters:
        -
          name: discipline
          in: query
          required: false
          schema:
            nullable: true
            oneOf:
              -
                $ref: '#/components/schemas/Discipline'
            default: null
        -
          name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
            nullable: true
            default: null
        -
          name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
            nullable: true
            default: null
        -
          name: cursor
          in: query
          required: false
          schema:
            type: string
            nullable: true
            default: null
        -
          name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 50
            minimum: 1
      responses:
        '200':
          description: "Une page d'historique, du plus récent au plus ancien."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/workouts/sync-state:
    get:
      tags:
        - Entraînement
      operationId: get_training_workout_sync_state
      responses:
        '200':
          description: 'De quoi demander la bonne fenêtre au fournisseur santé.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncState'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    ProblemDetails:
      description: "Une erreur, RFC 9457. `type` est l'identifiant stable de la panne ; `title` et\n`detail` sont du texte. Certaines erreurs ajoutent leurs propres membres — une\nviolation de validation donne `violations` — pour que le client se recale au lieu\nd'afficher un refus sec.\n"
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          description: "**L'énumération est exhaustive** : tout ce que le back sait émettre est ici,\npannes de transport comprises. C'est ce qui permet au client d'en faire un\n`switch` exhaustif et de laisser son compilateur réclamer un cas quand une\npanne s'ajoute — brancher un message sur le statut HTTP à la place ne\nmarcherait pas, un même statut couvrant des pannes qui n'appellent pas la\nmême phrase.\n\n`OpenApiContractTest` compare cette liste à ce que le code produit, dans les\ndeux sens : elle ne peut ni oublier une panne ni en garder une disparue.\n"
          type: string
          format: uri
          enum:
            - 'https://grrind.app/problems/bad-request'
            - 'https://grrind.app/problems/not-found'
            - 'https://grrind.app/problems/forbidden'
            - 'https://grrind.app/problems/method-not-allowed'
            - 'https://grrind.app/problems/too-many-requests'
            - 'https://grrind.app/problems/unsupported-media-type'
            - 'https://grrind.app/problems/validation-failed'
            - 'https://grrind.app/problems/internal-error'
            - 'https://grrind.app/problems/idempotency-key-required'
            - 'https://grrind.app/problems/idempotency-key-in-flight'
            - 'https://grrind.app/problems/idempotency-key-reused'
            - 'https://grrind.app/problems/email-already-used'
            - 'https://grrind.app/problems/email-belongs-to-another-account'
            - 'https://grrind.app/problems/invalid-credentials'
            - 'https://grrind.app/problems/access-token-missing'
            - 'https://grrind.app/problems/access-token-expired'
            - 'https://grrind.app/problems/access-token-invalid'
            - 'https://grrind.app/problems/invalid-refresh-token'
            - 'https://grrind.app/problems/social-sign-in-rejected'
            - 'https://grrind.app/problems/social-profile-incomplete'
            - 'https://grrind.app/problems/title-unknown'
            - 'https://grrind.app/problems/title-not-unlocked'
            - 'https://grrind.app/problems/guild-is-full'
            - 'https://grrind.app/problems/player-already-in-a-guild'
            - 'https://grrind.app/problems/guild-not-found'
            - 'https://grrind.app/problems/invite-code-not-usable'
            - 'https://grrind.app/problems/player-is-not-a-member'
            - 'https://grrind.app/problems/founder-cannot-exclude-himself'
            - 'https://grrind.app/problems/player-not-found'
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
      type: object
      additionalProperties: true
    ValidationProblem:
      description: 'Le corps est bien formé mais son contenu est refusé. Chaque violation nomme son champ.'
      allOf:
        -
          $ref: '#/components/schemas/ProblemDetails'
        -
          properties:
            violations:
              type: array
              items:
                required:
                  - field
                  - message
                properties:
                  field: { type: string, example: email }
                  message: { type: string }
                type: object
          type: object
    PlayerTitle:
      description: "**La seule forme d'un titre dans toute l'API** — débloqué comme verrouillé, dans le\nprofil, sur le mur des titres et dans une récompense. Un seul type à décoder, un\nseul composant à dessiner.\n\n`unlockedAt` à `null` est ce qui distingue les deux états. `progress` est toujours\nrenseignée : sur un titre acquis, `current` vaut `target`.\n"
      required:
        - id
        - name
        - hint
        - unlocked
        - unlockedAt
        - progress
      properties:
        id:
          type: string
          example: first_steps
        name:
          description: 'Déjà traduit, dans la langue négociée sur `Accept-Language`.'
          type: string
          example: 'First Steps'
        hint:
          description: "Ce qu'il reste à faire, rédigé."
          type: string
          example: 'Complete your first session'
        unlocked:
          type: boolean
        unlockedAt:
          type: string
          format: date-time
          nullable: true
        progress:
          required:
            - current
            - target
            - unit
          properties:
            current:
              description: 'Écrêté à `target` — une barre ne dépasse pas.'
              type: integer
            target:
              type: integer
            unit:
              type: string
              enum:
                - LEVELS
                - XP
                - SESSIONS
                - SECONDS
          type: object
      type: object
    GuildName:
      description: "Le nom seul. **Il n'est pas unique**, et il ne le deviendra pas : on n'entre\ndans une guilde que par un code d'invitation, donc rien ne dépend de pouvoir la\ndésigner par son nom. Deux guildes homonymes sont un cas normal.\n"
      required:
        - name
      properties:
        name:
          type: string
          example: 'Les Lève-Tôt'
          maxLength: 40
          minLength: 1
      type: object
    Guild:
      description: "Une guilde, vue par l'un de ses membres. Elle **ne produit aucune valeur de\njeu** en v1 : ni XP, ni modificateur, ni loot. Elle réunit des joueurs, c'est\ntout.\n"
      required:
        - id
        - name
        - createdAt
        - memberCount
        - capacity
        - role
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 40
        createdAt:
          type: string
          format: date-time
        memberCount:
          type: integer
          example: 12
        capacity:
          description: "La capacité vient de l'équilibrage du serveur et voyage avec la\nréponse : l'écran affiche « 12 / 30 », et embarquer le dénominateur\ndans l'app obligerait à repasser par l'App Store pour le corriger.\n"
          type: integer
          example: 30
        role:
          description: "Le rôle de **l'appelant**, pas une propriété de la guilde. Il sert à\ndécider quoi dessiner — le bouton « dissoudre » n'existe que pour le\nfondateur — jamais à autoriser : le serveur reste seul juge, et\nl'action est de toute façon revérifiée.\n"
          type: string
          enum:
            - FOUNDER
            - MEMBER
      type: object
    GuildInviteCode:
      description: "Le laissez-passer d'une guilde. Il **remplace l'annuaire au lieu de le\ncompléter** : aucune recherche de joueur n'existe, et une recherche par adresse\nrendrait l'API capable de confirmer qu'une adresse a un compte. Le code se\npartage hors de l'app, et seul un joueur déjà inscrit et connecté peut le\nconsommer.\n"
      required:
        - code
        - expiresAt
      properties:
        code:
          description: "Huit caractères sur un alphabet **amputé de ce qui se confond** : ni\n`O` ni `0`, ni `I`, `L` ou `1`. Un code se lit au téléphone et se\nrecopie d'une capture d'écran.\n"
          type: string
          example: K7QM3XPB
          maxLength: 8
          minLength: 8
        expiresAt:
          description: "Une date et non une durée restante : l'écran affiche « valable jusqu'à\ndemain 18 h », et des secondes se périmeraient dans la réponse\nelle-même.\n"
          type: string
          format: date-time
      type: object
    GuildJoin:
      description: "**Aucun identifiant de guilde** : c'est le code qui la désigne, sans quoi il\nsuffirait d'un UUID pour entrer. Le serveur normalise la casse et les espaces,\ndonc un code collé depuis un message passe tel quel.\n"
      required:
        - code
      properties:
        code:
          type: string
          example: K7QM3XPB
          maxLength: 8
          minLength: 8
      type: object
    Player:
      description: "Un joueur **tel que les autres joueurs le voient** — la seule forme sous\nlaquelle l'API expose quelqu'un d'autre que soi-même. Servie telle quelle par\n`GET /api/players/{id}`, et étalée dans chaque membre d'une guilde.\n\n**Ce qui n'y figure pas est la moitié du contrat** : ni adresse, ni fuseau, ni\nrôle applicatif. Ce sont des données de compte, pas de profil public — et les\nports qui alimentent cette ressource ne les rendent tout simplement pas.\n"
      required:
        - id
        - displayName
        - registeredAt
        - level
        - xpIntoLevel
        - xpToNextLevel
        - title
      properties:
        id:
          type: string
          format: uuid
        displayName:
          description: "**Non unique, et il ne le deviendra pas ici.** Deux membres homonymes\nsont un cas normal ; c'est l'`id` qui distingue.\n"
          type: string
        registeredAt:
          type: string
          format: date-time
        level:
          type: integer
          example: 12
        xpIntoLevel:
          type: integer
          example: 340
        xpToNextLevel:
          description: "`null` au niveau maximum : il n'y a plus de suivant, et zéro voudrait dire « atteint »."
          type: integer
          nullable: true
        title:
          description: "Le titre **porté**, `null` si le joueur n'en affiche aucun. Le\n*prochain* titre visé n'y est pas : il n'a de sens que sur son propre\nprofil, et personne n'a à savoir ce qu'un co-équipier est en train de\nviser. C'est `GET /api/me` qui le sert.\n"
          nullable: true
          allOf:
            -
              $ref: '#/components/schemas/PlayerTitle'
      type: object
    GuildMember:
      description: "Un membre : le joueur public, plus ce que la guilde sait de lui. Les champs de\n`Player` sont **étalés** et non imbriqués — le client dessine une ligne, pas\ndeux objets, et `GET /api/players/{id}` sert exactement le même bloc.\n"
      allOf:
        -
          $ref: '#/components/schemas/Player'
        -
          required:
            - role
            - joinedAt
          properties:
            role:
              type: string
              enum:
                - FOUNDER
                - MEMBER
            joinedAt:
              type: string
              format: date-time
          type: object
    GuildDetail:
      description: "La guilde et ses membres d'un bloc — **c'est l'écran**. L'onglet ne s'ouvre\njamais sans les deux, et les séparer coûterait un aller-retour pour un écran\nqui n'a rien à afficher entre-temps.\n"
      allOf:
        -
          $ref: '#/components/schemas/Guild'
        -
          required:
            - members
          properties:
            members:
              description: "**Le fondateur d'abord, puis par date d'entrée croissante.** Un\nordre décidé par le serveur, jamais celui que rend la base : sans\n`ORDER BY`, PostgreSQL sert les lignes comme il veut et change\nd'avis quand la table grossit. Une liste qui se réordonne toute\nseule entre deux ouvertures d'écran est un bug qu'on ne sait pas\nreproduire.\n"
              type: array
              items:
                $ref: '#/components/schemas/GuildMember'
          type: object
    MyGuild:
      description: "L'enveloppe de `GET /api/guilds/mine`. Elle existe parce que « pas de guilde »\ndoit être une réponse et non une erreur : c'est la requête d'ouverture de\nl'onglet, et un joueur sans guilde est dans un état normal — l'écran l'invite à\nen fonder une.\n"
      required:
        - guild
      properties:
        guild:
          nullable: true
          allOf:
            -
              $ref: '#/components/schemas/GuildDetail'
      type: object
    UserProfile:
      required:
        - id
        - email
        - displayName
        - timezone
        - registeredAt
        - title
        - nextTitle
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        timezone:
          description: "Identifiant IANA. **Le streak et le plafond quotidien se calculent dedans** : c'est un attribut de profil, jamais une déduction."
          type: string
          example: Europe/Paris
        registeredAt:
          type: string
          format: date-time
        title:
          description: "Le titre porté, ou `null` si le joueur n'en a débloqué aucun ou n'en affiche aucun."
          nullable: true
          allOf:
            -
              $ref: '#/components/schemas/PlayerTitle'
        nextTitle:
          description: "Le plus proche d'aboutir parmi ceux qui restent. `null` quand il les a tous."
          nullable: true
          allOf:
            -
              $ref: '#/components/schemas/PlayerTitle'
      type: object
    TokenPair:
      description: "Deux jetons de nature différente. Le JWT porte l'identité et ne se révoque pas —\nd'où sa courte durée. Le refresh token est **à usage unique et rotatif**, groupé par\nfamille : une famille est un appareil connecté, s'en déconnecter la révoque\nentièrement. Rejouer un jeton déjà consommé révoque toute la famille.\n"
      required:
        - accessToken
        - tokenType
        - expiresIn
        - refreshToken
        - refreshTokenExpiresAt
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          description: 'Secondes de validité du JWT.'
          type: integer
          example: 900
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
      type: object
    AuthSession:
      description: "Ce que rendent l'inscription, la connexion et le rafraîchissement — le profil et la paire de jetons, en une réponse."
      required:
        - user
        - tokens
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        tokens:
          $ref: '#/components/schemas/TokenPair'
      type: object
    Workout:
      description: "**La seule forme d'un workout dans toute l'API** — l'historique la sert, le `SyncSummary`\nl'embarque telle quelle. Un client décode un seul type.\n\nUne séance **déjà faite** : elle n'a pas d'état, et `endedAt` comme `durationSeconds` ne\nsont pas nullables. Un workout arrive terminé ou n'arrive pas.\n\n`durationSeconds` est calculée par le serveur à partir des deux bornes, jamais recopiée\nd'un champ envoyé par le client. C'est la durée **réellement mesurée** : au-delà du\nplafond, l'XP est calculée sur une durée écrêtée, mais l'historique dit ce qui s'est\npassé.\n\n**Les mesures sont nullables, et c'est structurel** : aucun appareil ne fournit tout.\n`null` veut dire « non mesuré », jamais zéro — un tour de piste plat a bien un dénivelé\nde zéro.\n"
      required:
        - id
        - discipline
        - source
        - trust
        - startedAt
        - endedAt
        - durationSeconds
        - distanceMeters
        - calories
        - elevationGainMeters
        - averageHeartRate
        - externalId
      properties:
        id:
          type: string
          format: uuid
        discipline:
          type: string
          enum:
            - RUNNING
            - WALKING
            - CYCLING
            - SWIMMING
            - STRENGTH
            - HIIT
            - HIKING
            - MOBILITY
            - CLIMBING
        source:
          description: "L'agrégateur de plateforme qui a rapporté la séance, pas l'appareil qui l'a\nmesurée : une montre Garmin arrive en `APPLE_HEALTH` sur iPhone et en\n`HEALTH_CONNECT` sur Android.\n"
          type: string
          enum:
            - APPLE_HEALTH
            - HEALTH_CONNECT
        trust:
          description: "Toujours `PROVIDER_VERIFIED` aujourd'hui : les deux sources sont vérifiées. `DECLARED` reste le plancher de l'échelle, pas une valeur morte."
          type: string
          enum:
            - DECLARED
            - PROVIDER_VERIFIED
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        durationSeconds:
          type: integer
        distanceMeters:
          type: integer
          nullable: true
        calories:
          type: integer
          nullable: true
        elevationGainMeters:
          type: integer
          nullable: true
        averageHeartRate:
          type: integer
          nullable: true
        externalId:
          description: "L'identifiant chez le fournisseur, rendu parce que c'est le client qui l'a envoyé : il peut ainsi rapprocher sa liste HealthKit de ce que le serveur connaît déjà, sans deviner."
          type: string
          nullable: true
      type: object
    WorkoutPage:
      description: "Une page d'historique, **dans l'ordre de la pratique** : `startedAt` décroissant, puis\nl'identifiant pour départager deux séances commencées à la même seconde.\n\n`nextCursor` est une **chaîne opaque** — le client la renvoie telle quelle, il n'a rien à\ny lire. `null` signifie la fin ; il n'y a pas de total, un défilement infini n'en a aucun\nusage.\n"
      required:
        - workouts
        - nextCursor
      properties:
        workouts:
          type: array
          items:
            $ref: '#/components/schemas/Workout'
        nextCursor:
          type: string
          nullable: true
      type: object
    SyncState:
      description: "De quoi demander la bonne fenêtre à HealthKit ou Health Connect.\n\n**Le curseur vient du serveur.** Le client peut garder sa date de dernière\nsynchronisation en local, et il le fera pour éviter un aller-retour au démarrage — mais\nil ne doit pas en *dépendre* : réinstallation, changement d'appareil, second appareil sur\nle même compte. Le cache local est une optimisation, pas la vérité.\n\n**La fenêtre est servie et pas codée en dur** : elle doit pouvoir bouger sans publication\nsur les stores. Une app qui demanderait trente jours pendant que le serveur en accepte\nsoixante enverrait moins que ce qu'elle pourrait.\n"
      required:
        - lastImportedAt
        - importWindowDays
      properties:
        lastImportedAt:
          description: "La fin du workout le plus récent que le serveur ait en base — pas la date du dernier\nappel d'import, qui a pu ne rien apporter. Les séances archivées hors fenêtre comptent :\nce qu'on désigne ici est la frontière de ce que le serveur **connaît**, pas de ce qu'il a\npayé. `null` sur un compte qui n'a jamais synchronisé.\n"
          type: string
          format: date-time
          nullable: true
        importWindowDays:
          description: "Au-delà, une séance est conservée mais ne rapporte pas d'XP. C'est ce qui empêche trois ans d'archives d'amener un joueur au niveau 60 avant sa première course pour Grrind."
          type: integer
          example: 30
      type: object
    WorkoutImportRequest:
      description: "Ce que la montre a enregistré depuis la dernière synchronisation. **Un lot, pas un\nworkout** : revenir après dix jours d'absence avec trois séances à créditer est le cas\nnominal.\n\nLe client envoie le **type brut du fournisseur**, jamais une `discipline` : la\ntraduction est serveur, ce qui permet d'ouvrir un sport sans publier sur les stores.\nUn type inconnu n'est pas une erreur — la séance est écartée et nommée dans la\nréponse.\n\n**La durée n'est pas un champ.** Elle se dérive de `startedAt` et `endedAt`, arbitrée\npar le serveur : l'accepter en entrée donnerait au client une prise sur ce qu'il gagne.\n"
      required:
        - workouts
      properties:
        workouts:
          type: array
          items:
            $ref: '#/components/schemas/ImportedWorkout'
          maxItems: 200
          minItems: 1
      type: object
    ImportedWorkout:
      description: "Une séance candidate. Les mesures sont toutes facultatives, et c'est structurel : aucun appareil ne fournit tout. `null` veut dire « non mesuré », jamais zéro."
      required:
        - externalId
        - source
        - activityType
        - startedAt
        - endedAt
      properties:
        externalId:
          description: "`HKWorkout.uuid` côté Apple, `metadata.id` côté Health Connect. Il porte toute la protection contre le double crédit — le renvoyer à l'identique est ce qui rend une resynchronisation inoffensive."
          type: string
          maxLength: 128
        source:
          type: string
          enum:
            - APPLE_HEALTH
            - HEALTH_CONNECT
        activityType:
          description: 'Le nom de case `HKWorkoutActivityType` côté Apple, la constante `EXERCISE_TYPE_*` côté Health Connect. Envoyé tel quel, sans interprétation.'
          type: string
          example: traditionalStrengthTraining
          maxLength: 64
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        distanceMeters:
          type: integer
          nullable: true
          minimum: 0
        calories:
          type: integer
          nullable: true
          minimum: 0
        elevationGainMeters:
          type: integer
          nullable: true
          minimum: 0
        averageHeartRate:
          type: integer
          nullable: true
          maximum: 300
          minimum: 1
      type: object
    SyncSummary:
      description: "**Le contrat le plus coûteux à casser du produit**, dans sa forme multi-workouts. Ce que\nle joueur reçoit quand sa montre a fini de parler.\n\n**L'ordre des champs est l'ordre de l'animation**, à deux niveaux : d'abord entre les\nworkouts — `imported` est chronologique, celui du crédit — puis à l'intérieur de chacun.\n\n**Rien n'est tronqué.** Au-delà d'une vingtaine de workouts, tout jouer prend plusieurs\nminutes : c'est une décision de mise en scène, et elle appartient au client. Le serveur\nenvoie tout, le client décide de ce qu'il joue.\n"
      required:
        - syncedAt
        - imported
        - skipped
        - totals
        - rulesetVersion
      properties:
        syncedAt:
          description: "L'horloge du serveur, et le seul instant de ce payload qui ne vienne pas d'un fournisseur. Sert de repère de dernière synchronisation réussie."
          type: string
          format: date-time
        imported:
          description: "Un `RewardSummary` par workout crédité, dans l'ordre chronologique. **C'est\nexactement l'objet que le client sait déjà jouer**, palier de départ compris : la\nbarre part du bon endroit pour *chacun*, et l'enchaînement est continu sans un seul\nrecalcul côté client.\n"
          type: array
          items:
            $ref: '#/components/schemas/RewardSummary'
        skipped:
          description: "Les séances qui n'ont **rien rapporté**, chacune **nommée** et non comptée : le client\ndoit pouvoir dire « le curling n'est pas encore un sport chez nous » plutôt que « 1\nséance ignorée ».\n\nÉcarté ne veut pas toujours dire absent. `OUT_OF_WINDOW` écarte le *crédit*, pas la\nséance : elle est bien en base et apparaîtra dans l'historique.\n"
          type: array
          items:
            required:
              - externalId
              - activityType
              - reason
            properties:
              externalId:
                type: string
              activityType:
                type: string
              reason:
                description: "`ALREADY_IMPORTED` : déjà en base sous le même couple (source, identifiant). Banal\net attendu — c'est ce que rend un client qui a perdu son curseur.\n\n`UNSUPPORTED_ACTIVITY` : aucune discipline ne correspond. Rien n'est écrit, donc\nrien n'est définitif — le jour où le sport entre dans la table serveur, la même\nséance renvoyée est créditée.\n\n`OUT_OF_WINDOW` : trop ancienne pour rapporter de l'XP, mais **conservée**. Le\njoueur retrouve son passé sans le monnayer, et le premier import devient un moment\nde produit au lieu d'un mur.\n\n`OVERLAPS` : une autre séance couvre déjà ce créneau. Ce ne sont pas deux\nentraînements, c'est le même vu par deux applications — beaucoup de gens ont Apple\nExercice *et* Strava sans le savoir. C'est l'enregistrement le plus complet qui\ngagne, sauf si l'autre est déjà en base.\n\n`TOO_SHORT` : sous le plancher de durée. Un faux départ sur la montre n'est pas une\nséance, et rien n'est écrit.\n"
                type: string
                enum:
                  - ALREADY_IMPORTED
                  - UNSUPPORTED_ACTIVITY
                  - OUT_OF_WINDOW
                  - OVERLAPS
                  - TOO_SHORT
            type: object
        totals:
          description: "Le raccourci de l'écran de résumé — « +847 XP · niveau 10 → 15 » — et ce que voit le\njoueur qui saute l'animation.\n\n**C'est un raccourci, jamais une source** : il est entièrement dérivé d'`imported`,\nqui dit déjà tout. Deux vérités finissent toujours par diverger.\n\n`null` quand rien n'a été crédité : il n'y a pas d'état d'arrivée quand rien n'est\narrivé, et « niveau 0 → 0 » mentirait à un joueur de niveau 12.\n"
          nullable: true
          allOf:
            -
              $ref: '#/components/schemas/SyncTotals'
        rulesetVersion:
          description: "L'équilibrage sous lequel la synchronisation a été calculée. Affiché dans un rapport de bug : c'est ce qui rend une capture d'écran exploitable."
          type: string
      type: object
    SyncTotals:
      required:
        - levelBefore
        - levelAfter
        - xpBefore
        - xpAfter
        - xpAwarded
        - workoutCount
      properties:
        levelBefore:
          type: integer
          example: 10
        levelAfter:
          type: integer
          example: 15
        xpBefore:
          type: integer
        xpAfter:
          type: integer
        xpAwarded:
          description: "La somme des montants accordés, écarts non compris — un workout écarté n'a rien rapporté."
          type: integer
        workoutCount:
          description: "Le nombre de workouts **crédités**, donc la longueur d'`imported`."
          type: integer
      type: object
    XpLine:
      description: "Une contribution au total, entier signé. Un multiplicateur se résout en points\n**avant** d'arriver ici : ce qui est écrit est ce que le joueur a reçu, pas la\nformule. Les deux dernières sources sont des garde-fous, négatives au crédit.\n\n**Une ligne à zéro n'existe pas.** Une métrique non mesurée, un bonus trop petit\npour peser, un garde-fou qui n'a rien repris : rien de tout ça n'occupe une ligne\nd'animation. Le client peut donc jouer chaque ligne sans la tester.\n"
      required:
        - source
        - amount
      properties:
        source:
          description: "`BASE` est le temps — une minute vaut un point. `DISTANCE` et `ELEVATION`\nsont ce que le terrain ajoute, et n'apparaissent que sur les disciplines où\nune montre les mesure de façon fiable. Les quatre suivantes sont les\ncontributeurs de modificateurs ; les deux dernières, les garde-fous.\n"
          type: string
          enum:
            - BASE
            - DISTANCE
            - ELEVATION
            - STREAK
            - ITEM
            - SKILL
            - LEAGUE
            - DIMINISHING
            - DAILY_CAP
        amount:
          type: integer
          example: -55
      type: object
    RewardSummary:
      description: "Ce que le joueur reçoit pour **un** workout crédité. Un `SyncSummary` en contient\nautant qu'il y a eu de séances, dans l'ordre chronologique.\n\n**L'ordre des champs est l'ordre de l'animation** : le client le joue de haut en\nbas — la séance se referme, la barre d'XP se remplit ligne à ligne, le niveau\nbascule, le titre tombe, puis le loot et la série. Un champ déplacé change la mise\nen scène.\n\n**Un seul aller-retour.** Rien ici ne demande de recharger quoi que ce soit avant de\njouer l'animation — d'où le palier donné avant *et* après, et les titres déjà\ntraduits.\n\n`loot`, `streak` et `unlockableNodes` sont **présents et vides** jusqu'aux Lots 6, 5\net 7. Une clé qui apparaîtrait plus tard obligerait un client déjà déployé à la\nrendre optionnelle pour toujours.\n"
      required:
        - session
        - xp
        - level
        - titlesUnlocked
        - loot
        - streak
        - unlockableNodes
        - rulesetVersion
      properties:
        session:
          $ref: '#/components/schemas/Workout'
        xp:
          required:
            - awarded
            - breakdown
          properties:
            awarded:
              description: 'La somme du `breakdown`, jamais autre chose.'
              type: integer
              example: 145
            breakdown:
              description: "Dans l'ordre d'affichage. Le client ne le trie pas, il le joue."
              type: array
              items:
                $ref: '#/components/schemas/XpLine'
          type: object
        level:
          required:
            - before
            - xpIntoLevelBefore
            - xpToNextLevelBefore
            - after
            - reached
            - totalXp
            - xpIntoLevel
            - xpToNextLevel
            - skillPointsGranted
          properties:
            before:
              type: integer
              example: 1
            xpIntoLevelBefore:
              description: "Où en était la barre avant la séance. Le client l'y place, **puis** la remplit."
              type: integer
              example: 30
            xpToNextLevelBefore:
              description: "Avec le précédent, la largeur du palier de départ. Elle ne se redéduit pas du reste dès que plusieurs niveaux sont franchis, et sans elle la barre repart de zéro pour un joueur qui n'y était pas. `null` au niveau maximum."
              type: integer
              example: 70
              nullable: true
            after:
              type: integer
              example: 2
            reached:
              description: "Les niveaux franchis, dans l'ordre. En gagner plusieurs d'un coup est un cas normal — le client les anime tous. Vide quand rien ne bouge."
              type: array
              items:
                type: integer
            totalXp:
              type: integer
            xpIntoLevel:
              type: integer
            xpToNextLevel:
              description: "Ce qu'il **reste** à gagner. `null` signifie le niveau maximum ; zéro voudrait dire « atteint »."
              type: integer
              nullable: true
            skillPointsGranted:
              type: integer
          type: object
        titlesUnlocked:
          description: "Vide le plus souvent — un titre est un événement rare, c'est ce qui en fait un."
          type: array
          items:
            $ref: '#/components/schemas/PlayerTitle'
        loot:
          description: "Lot 6 : toujours vide aujourd'hui."
          type: array
          items:
            type: object
        streak:
          description: "Lot 5 : toujours `null` aujourd'hui."
          type: object
          nullable: true
        unlockableNodes:
          description: "Lot 7 : toujours vide aujourd'hui."
          type: array
          items:
            type: object
        rulesetVersion:
          description: "L'équilibrage sous lequel ces montants ont été accordés. Le client n'en fait rien ; un rapport de bug, si."
          type: string
      type: object
    Progression:
      description: "L'état du joueur — l'écran d'accueil de l'app en une requête, servi du seul snapshot."
      required:
        - level
        - totalXp
        - xpIntoLevel
        - xpToNextLevel
        - skillPoints
        - activeTitle
        - unlockedTitles
        - rulesetVersion
        - lastProgressionAt
      properties:
        level:
          type: integer
        totalXp:
          type: integer
        xpIntoLevel:
          type: integer
        xpToNextLevel:
          description: '`null` au niveau maximum.'
          type: integer
          nullable: true
        skillPoints:
          description: "Deux nombres, alors qu'ils valent la même chose aujourd'hui. `earned` est un\ncumul de carrière qui ne redescend pas, `available` un solde que les arbres\nferont baisser. Les fondre obligerait à renommer — donc à casser le client —\nau premier point dépensé.\n"
          required:
            - earned
            - available
          properties:
            earned:
              type: integer
            available:
              type: integer
          type: object
        activeTitle:
          nullable: true
          allOf:
            -
              $ref: '#/components/schemas/PlayerTitle'
        unlockedTitles:
          type: array
          items:
            $ref: '#/components/schemas/PlayerTitle'
        rulesetVersion:
          type: string
        lastProgressionAt:
          description: "`null` pour un joueur qui n'a encore rien fait."
          type: string
          format: date-time
          nullable: true
      type: object
    TitleBoard:
      description: "Le catalogue **entier**, traduit et situé. Pas seulement l'acquis : un mur qui ne\nmontrerait que l'atteint ne donnerait rien à viser.\n"
      required:
        - activeTitleId
        - titles
      properties:
        activeTitleId:
          description: 'Redondant avec le tableau — il évite de le parcourir pour savoir quoi cocher, et dit `null` sans ambiguïté.'
          type: string
          nullable: true
        titles:
          type: array
          items:
            $ref: '#/components/schemas/PlayerTitle'
      type: object
    XpTransaction:
      description: "Une écriture au ledger. **Le ledger est la vérité** ; le niveau et le total en sont\ndes projections. Rien ne s'efface : une séance invalidée produit une écriture\nnégative, et les deux restent.\n"
      required:
        - id
        - sourceId
        - reason
        - discipline
        - amount
        - durationSeconds
        - breakdown
        - rulesetVersion
        - occurredAt
      properties:
        id:
          type: string
          format: uuid
        sourceId:
          description: "Ce qui a produit l'écriture — l'identifiant du workout."
          type: string
          format: uuid
        reason:
          type: string
          enum:
            - SESSION_COMPLETED
            - SESSION_INVALIDATED
        discipline:
          type: string
          enum:
            - RUNNING
            - WALKING
            - CYCLING
            - SWIMMING
            - STRENGTH
            - HIIT
            - HIKING
            - MOBILITY
            - CLIMBING
        amount:
          description: 'Signé. La somme du `breakdown`, jamais autre chose.'
          type: integer
        durationSeconds:
          description: 'Signée elle aussi — négative sur une annulation.'
          type: integer
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/XpLine'
        rulesetVersion:
          description: "Celui du calcul, pas celui d'aujourd'hui. C'est ce qui permet de rééquilibrer sans corrompre l'historique."
          type: string
        occurredAt:
          description: "**L'instant du sport, pas celui de l'écriture.** Un workout de mardi importé\nvendredi est daté de mardi : c'est ce qui range l'écriture dans la bonne journée,\npour le plafond quotidien comme pour l'affichage. L'instant de l'écriture, lui,\nest encodé dans l'`id` — c'est un UUID v7.\n"
          type: string
          format: date-time
      type: object
    XpHistoryPage:
      description: "Même pagination qu'à `GET /api/workouts`, curseur opaque compris : deux paginations qui divergeraient coûteraient deux implémentations côté client. L'ordre est celui du sport — `occurredAt` décroissant, puis l'identifiant pour départager."
      required:
        - transactions
        - nextCursor
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/XpTransaction'
        nextCursor:
          type: string
          nullable: true
      type: object
    FoundGuildRequest:
      properties:
        name:
          type: string
          default: ''
          maxLength: 40
      type: object
    RenameGuildRequest:
      properties:
        name:
          type: string
          default: ''
          maxLength: 40
      type: object
    JoinGuildRequest:
      properties:
        code:
          type: string
          pattern: '[A-Z0-9]+'
          default: ''
          maxLength: 8
          minLength: 8
      type: object
    RefreshTokenRequest:
      properties:
        refreshToken:
          type: string
          default: ''
      type: object
    UpdateProfileRequest:
      properties:
        displayName:
          type: string
          nullable: true
          default: null
          maxLength: 40
        timezone:
          type: string
          nullable: true
          default: null
      type: object
    RegisterRequest:
      properties:
        email:
          type: string
          default: ''
          maxLength: 180
        password:
          type: string
          default: ''
          maxLength: 4096
          minLength: 12
        displayName:
          type: string
          default: ''
          maxLength: 40
        timezone:
          type: string
          default: UTC
      type: object
    SocialSignInRequest:
      properties:
        code:
          type: string
          default: ''
          maxLength: 2048
        redirectUri:
          type: string
          default: ''
          maxLength: 2048
        codeVerifier:
          type: string
          nullable: true
          default: null
          maxLength: 128
          minLength: 43
        timezone:
          type: string
          default: UTC
      type: object
    XpHistoryQuery:
      properties:
        cursor:
          type: string
          nullable: true
          default: null
        limit:
          type: integer
          default: 20
          maximum: 50
          minimum: 1
      type: object
    SelectTitleRequest:
      properties:
        titleId:
          type: string
          nullable: true
          default: null
          maxLength: 64
      type: object
    WorkoutSource:
      type: string
      enum:
        - APPLE_HEALTH
        - HEALTH_CONNECT
    ImportedWorkoutRequest:
      properties:
        externalId:
          type: string
          default: ''
          maxLength: 128
        source:
          nullable: true
          oneOf:
            -
              $ref: '#/components/schemas/WorkoutSource'
          default: null
        activityType:
          type: string
          default: ''
          maxLength: 64
        startedAt:
          type: string
          format: date-time
          nullable: true
          default: null
        endedAt:
          type: string
          format: date-time
          nullable: true
          default: null
        distanceMeters:
          type: integer
          nullable: true
          default: null
          minimum: 0
        calories:
          type: integer
          nullable: true
          default: null
          minimum: 0
        elevationGainMeters:
          type: integer
          nullable: true
          default: null
          minimum: 0
        averageHeartRate:
          type: integer
          nullable: true
          default: null
          maximum: 300
          minimum: 1
      type: object
    ImportWorkoutsRequest:
      properties:
        workouts:
          type: array
          items:
            $ref: '#/components/schemas/ImportedWorkoutRequest'
          default: []
          maxItems: 200
          minItems: 1
      type: object
    Discipline:
      type: string
      enum:
        - RUNNING
        - WALKING
        - CYCLING
        - SWIMMING
        - STRENGTH
        - HIIT
        - HIKING
        - MOBILITY
        - CLIMBING
    WorkoutHistoryQuery:
      properties:
        discipline:
          nullable: true
          oneOf:
            -
              $ref: '#/components/schemas/Discipline'
          default: null
        from:
          type: string
          format: date-time
          nullable: true
          default: null
        to:
          type: string
          format: date-time
          nullable: true
          default: null
        cursor:
          type: string
          nullable: true
          default: null
        limit:
          type: integer
          default: 20
          maximum: 50
          minimum: 1
      type: object
  responses:
    BadRequest:
      description: "Requête malformée — en-tête d'idempotence absent, corps illisible."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: "Le jeton d'accès n'a pas fait son travail, et le `type` dit lequel des trois cas\nc'est — `access-token-missing`, `access-token-expired` ou `access-token-invalid`.\nLa distinction est le tout : **expiré** dit de rafraîchir et de rejouer la requête,\n**invalide** et **absent** disent de renvoyer le joueur sur l'écran de connexion.\n"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: "La ressource n'existe pas, **ou n'appartient pas à ce compte**. Les deux cas\nrendent la même réponse : répondre « interdit » confirmerait l'existence, et un\nidentifiant, ça s'essaie en boucle.\n"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: "L'état actuel refuse l'opération. Le `type` dit lequel, et les membres supplémentaires disent comment se recaler."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: "L'appelant est bien identifié, la ressource existe, et il n'a pas le droit\ndemandé. **C'est ce qui distingue ce statut du 404** : un 403 ne se rend qu'à\nquelqu'un qui savait déjà que la ressource existe — un membre de la guilde qui\nn'en est pas le fondateur. À un non-membre, l'API répond 404, sans quoi elle\ndirait quels UUID désignent une guilde.\n"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: "Trop d'essais. L'en-tête `Retry-After` dit combien de secondes attendre, et le\nclient doit l'honorer plutôt que de réessayer en boucle. Aujourd'hui seul\n`POST /api/guilds/join` est limité : un code d'invitation est court par\nnécessité — il se dicte à voix haute — et c'est ce plafond qui rend le tirage au\nhasard sans issue.\n"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableEntity:
      description: 'Le corps est bien formé mais son contenu est refusé.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: "Une clé propre à cette tentative, stable au travers des rejeus du client.\nRejouer la même clé sur la même requête rend la réponse d'origine sans rien\nréexécuter, et l'en-tête `Idempotent-Replay: true` le signale. La même clé sur\nune requête différente est un abus et vaut un 409.\n"
      required: true
      schema:
        type: string
        maxLength: 255
  securitySchemes:
    bearerAuth:
      type: http
      description: "Le JWT rendu par `/api/auth/login`, `/api/auth/register` ou `/api/auth/refresh`.\nQuinze minutes de validité — il ne se révoque pas, c'est pour ça qu'il est court.\nPassé ce délai, on le renouvelle avec le refresh token.\n"
      bearerFormat: JWT
      scheme: bearer
security:
  -
    bearerAuth: []
tags:
  -
    name: Guildes
  -
    name: Authentification
  -
    name: Profil
  -
    name: Progression
  -
    name: Entraînement

