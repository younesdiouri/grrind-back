          schema:
            type: string
            nullable: true
            default: null
        -
          name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 50
            minimum: 1
      responses:
        '200':
          description: 'Le solde, et une page de mouvements du plus récent au plus ancien.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoinHistoryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/daily-activity:
