  /api/workouts/sync-state:
    get:
      tags:
        - Entraînement
      operationId: get_training_workout_sync_state
      responses:
        '200':
          description: 'De quoi demander la bonne fenêtre au fournisseur santé.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncState'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    PushRouteType:
      type: string
      enum:
        - PLAYER_PROFILE
        - GUILD_RISALAT
    PushNotificationData:
      description: "Le `data` d'une notification push, **le seul morceau qui se décode plutôt que\ns'affiche**. Il n'arrive par aucune route : le canal est APNs via Expo, pas HTTP.\nIl est décrit ici parce que c'est le même contrat — le client route dessus, il\ndoit donc générer `routeType` plutôt que d'en recopier les valeurs.\n\n**Rien à afficher tel quel.** `routeId` est une clé de ressource à relire —\npour `PLAYER_PROFILE`, l'identifiant que `GET /api/players/{id}` résout ; pour\n`GUILD_RISALAT`, celui de la guilde dont il faut ouvrir l'écran des Risālāt. Une\nnotification peut dormir des heures dans le centre de notifications ; ce que le\ntap montre ensuite doit être exact, donc relu depuis l'API. `groupingKey`, lui,\nne se lit pas : il dit seulement quelle notification une nouvelle remplace.\n"
      required:
        - groupingKey
        - routeType
        - routeId
      properties:
        groupingKey:
          type: string
        routeType:
          $ref: '#/components/schemas/PushRouteType'
        routeId:
          type: string
          format: uuid
      type: object
    ProblemDetails:
      description: "Une erreur, RFC 9457. `type` est l'identifiant stable de la panne ; `title` et\n`detail` sont du texte. Certaines erreurs ajoutent leurs propres membres — une\nviolation de validation donne `violations` — pour que le client se recale au lieu\nd'afficher un refus sec.\n"
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          description: "**L'énumération est exhaustive** : tout ce que le back sait émettre est ici,\npannes de transport comprises. C'est ce qui permet au client d'en faire un\n`switch` exhaustif et de laisser son compilateur réclamer un cas quand une\npanne s'ajoute — brancher un message sur le statut HTTP à la place ne\nmarcherait pas, un même statut couvrant des pannes qui n'appellent pas la\nmême phrase.\n\n`OpenApiContractTest` compare cette liste à ce que le code produit, dans les\ndeux sens : elle ne peut ni oublier une panne ni en garder une disparue.\n"
          type: string
          format: uri
          enum:
            - 'https://grrind.app/problems/bad-request'
            - 'https://grrind.app/problems/not-found'
            - 'https://grrind.app/problems/forbidden'
            - 'https://grrind.app/problems/method-not-allowed'
            - 'https://grrind.app/problems/too-many-requests'
            - 'https://grrind.app/problems/unsupported-media-type'
            - 'https://grrind.app/problems/validation-failed'
            - 'https://grrind.app/problems/internal-error'
            - 'https://grrind.app/problems/idempotency-key-required'
            - 'https://grrind.app/problems/idempotency-key-in-flight'
            - 'https://grrind.app/problems/idempotency-key-reused'
            - 'https://grrind.app/problems/email-already-used'
            - 'https://grrind.app/problems/email-belongs-to-another-account'
            - 'https://grrind.app/problems/invalid-credentials'
            - 'https://grrind.app/problems/access-token-missing'
            - 'https://grrind.app/problems/access-token-expired'
            - 'https://grrind.app/problems/access-token-invalid'
            - 'https://grrind.app/problems/invalid-refresh-token'
            - 'https://grrind.app/problems/social-sign-in-rejected'
            - 'https://grrind.app/problems/social-profile-incomplete'
            - 'https://grrind.app/problems/title-unknown'
            - 'https://grrind.app/problems/title-not-unlocked'
            - 'https://grrind.app/problems/guild-is-full'
            - 'https://grrind.app/problems/player-already-in-a-guild'
            - 'https://grrind.app/problems/guild-not-found'
            - 'https://grrind.app/problems/invite-code-not-usable'
            - 'https://grrind.app/problems/player-is-not-a-member'
            - 'https://grrind.app/problems/founder-cannot-exclude-himself'
            - 'https://grrind.app/problems/player-not-found'
            - 'https://grrind.app/problems/risala-turn-is-closed'
            - 'https://grrind.app/problems/discipline-does-not-credit'
            - 'https://grrind.app/problems/discipline-already-challenged'
            - 'https://grrind.app/problems/risala-turn-is-not-open'
            - 'https://grrind.app/problems/risala-turn-is-not-yours'
            - 'https://grrind.app/problems/battle-not-found'
            - 'https://grrind.app/problems/enemy-key-unknown'
            - 'https://grrind.app/problems/enemy-level-too-low'
            - 'https://grrind.app/problems/insufficient-coin-balance'
            - 'https://grrind.app/problems/item-not-owned'
            - 'https://grrind.app/problems/equipment-slot-unknown'
            - 'https://grrind.app/problems/equipment-slot-incompatible'
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
      type: object
      additionalProperties: true
    ValidationProblem:
      description: 'Le corps est bien formé mais son contenu est refusé. Chaque violation nomme son champ.'
      allOf:
        -
          $ref: '#/components/schemas/ProblemDetails'
        -
          properties:
            violations:
              type: array
              items:
                required:
                  - field
                  - message
                properties:
                  field: { type: string, example: email }
                  message: { type: string }
                type: object
          type: object
    PlayerTitle:
      description: "**La seule forme d'un titre dans toute l'API** — débloqué comme verrouillé, dans le\nprofil, sur le mur des titres et dans une récompense. Un seul type à décoder, un\nseul composant à dessiner.\n\n`unlockedAt` à `null` est ce qui distingue les deux états. `progress` est toujours\nrenseignée : sur un titre acquis, `current` vaut `target`.\n"
      required:
        - id
        - name
        - hint
        - unlocked
        - unlockedAt
        - progress
      properties:
        id:
          type: string
          example: first_steps
        name:
          description: 'Déjà traduit, dans la langue négociée sur `Accept-Language`.'
          type: string
          example: 'First Steps'
        hint:
          description: "Ce qu'il reste à faire, rédigé."
          type: string
          example: 'Complete your first session'
        unlocked:
          type: boolean
        unlockedAt:
          type: string
          format: date-time
          nullable: true
        progress:
          required:
            - current
            - target
            - unit
          properties:
            current:
              description: 'Écrêté à `target` — une barre ne dépasse pas.'
              type: integer
            target:
              type: integer
            unit:
              type: string
              enum:
                - LEVELS
                - XP
                - SESSIONS
                - SECONDS
          type: object
      type: object
    GuildName:
      description: "Le nom seul. **Il n'est pas unique**, et il ne le deviendra pas : on n'entre\ndans une guilde que par un code d'invitation, donc rien ne dépend de pouvoir la\ndésigner par son nom. Deux guildes homonymes sont un cas normal.\n"
      required:
        - name
      properties:
        name:
          type: string
          example: 'Les Lève-Tôt'
          maxLength: 40
          minLength: 1
      type: object
    Guild:
      description: "Une guilde, vue par l'un de ses membres. Elle **ne produit aucune valeur de\njeu** en v1 : ni XP, ni modificateur, ni loot. Elle réunit des joueurs, c'est\ntout.\n"
      required:
        - id
        - name
        - createdAt
        - memberCount
        - capacity
        - role
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 40
        createdAt:
          type: string
          format: date-time
        memberCount:
          type: integer
          example: 12
        capacity:
          description: "La capacité vient de l'équilibrage du serveur et voyage avec la\nréponse : l'écran affiche « 12 / 30 », et embarquer le dénominateur\ndans l'app obligerait à repasser par l'App Store pour le corriger.\n"
          type: integer
          example: 30
        role:
          description: "Le rôle de **l'appelant**, pas une propriété de la guilde. Il sert à\ndécider quoi dessiner — le bouton « dissoudre » n'existe que pour le\nfondateur — jamais à autoriser : le serveur reste seul juge, et\nl'action est de toute façon revérifiée.\n"
          type: string
          enum:
            - FOUNDER
            - MEMBER
      type: object
    GuildInviteCode:
      description: "Le laissez-passer d'une guilde. Il **remplace l'annuaire au lieu de le\ncompléter** : aucune recherche de joueur n'existe, et une recherche par adresse\nrendrait l'API capable de confirmer qu'une adresse a un compte. Le code se\npartage hors de l'app, et seul un joueur déjà inscrit et connecté peut le\nconsommer.\n"
      required:
        - code
        - expiresAt
      properties:
        code:
          description: "Huit caractères sur un alphabet **amputé de ce qui se confond** : ni\n`O` ni `0`, ni `I`, `L` ou `1`. Un code se lit au téléphone et se\nrecopie d'une capture d'écran.\n"
          type: string
          example: K7QM3XPB
          maxLength: 8
          minLength: 8
        expiresAt:
          description: "Une date et non une durée restante : l'écran affiche « valable jusqu'à\ndemain 18 h », et des secondes se périmeraient dans la réponse\nelle-même.\n"
          type: string
          format: date-time
      type: object
    GuildJoin:
      description: "**Aucun identifiant de guilde** : c'est le code qui la désigne, sans quoi il\nsuffirait d'un UUID pour entrer. Le serveur normalise la casse et les espaces,\ndonc un code collé depuis un message passe tel quel.\n"
      required:
        - code
      properties:
        code:
          type: string
          example: K7QM3XPB
          maxLength: 8
          minLength: 8
      type: object
    Player:
      description: "Un joueur **tel que les autres joueurs le voient** — la seule forme sous\nlaquelle l'API expose quelqu'un d'autre que soi-même. Servie telle quelle par\n`GET /api/players/{id}`, et étalée dans chaque membre d'une guilde.\n\n**Ce qui n'y figure pas est la moitié du contrat** : ni adresse, ni fuseau, ni\nrôle applicatif. Ce sont des données de compte, pas de profil public — et les\nports qui alimentent cette ressource ne les rendent tout simplement pas.\n\n**Les cinq caractéristiques (#176) y figurent par décision de produit** : la\nrépartition d'une pratique a été tranchée sociale, c'est une des raisons\nd'avoir des guildes. Ce que la phrase ci-dessus exclut ne bouge pas pour\nautant — un champ de compte n'entre pas ici parce qu'un champ de jeu vient d'y\nentrer.\n"
      required:
        - id
        - displayName
        - registeredAt
        - level
        - xpIntoLevel
        - xpToNextLevel
        - title
        - attributes
        - vitalityBreakdown
      properties:
        id:
          type: string
          format: uuid
        displayName:
          description: "**Non unique, et il ne le deviendra pas ici.** Deux membres homonymes\nsont un cas normal ; c'est l'`id` qui distingue.\n"
          type: string
        registeredAt:
          type: string
          format: date-time
        level:
          type: integer
          example: 12
        xpIntoLevel:
          type: integer
          example: 340
        xpToNextLevel:
          description: "`null` au niveau maximum : il n'y a plus de suivant, et zéro voudrait dire « atteint »."
          type: integer
          nullable: true
        title:
          description: "Le titre **porté**, `null` si le joueur n'en affiche aucun. Le\n*prochain* titre visé n'y est pas : il n'a de sens que sur son propre\nprofil, et personne n'a à savoir ce qu'un co-équipier est en train de\nviser. C'est `GET /api/me` qui le sert.\n"
          nullable: true
          allOf:
            -
              $ref: '#/components/schemas/PlayerTitle'
        attributes:
          description: "Les cinq caractéristiques de ce joueur, à l'instant présent — même\nvocabulaire et même forme qu'à `GET /api/progression`\n(`Progression.attributes`) : un état, jamais un passage, donc ni\n`gained` ni avant/après.\n"
          required:
            - strength
            - endurance
            - mobility
            - dexterity
            - vitality
          properties:
            strength:
              type: integer
              example: 5108
            endurance:
              type: integer
              example: 3200
            mobility:
              type: integer
              example: 900
            dexterity:
              type: integer
              example: 1500
            vitality:
              description: "Dérivée des quatre autres, puis bonifiée par l'énergie active de la fenêtre glissante (#165) — voir `vitalityBreakdown` et `Progression.attributes.vitality`."
              type: integer
              example: 310
          type: object
        vitalityBreakdown:
          description: "Ce qui explique `attributes.vitality` — même forme qu'à `GET /api/progression` (`Progression.vitalityBreakdown`)."
          required:
            - windowAverageActiveKcal
            - targetActiveKcal
            - bonusPermille
          properties:
            windowAverageActiveKcal:
              type: integer
              example: 420
            targetActiveKcal:
              type: integer
              example: 500
            bonusPermille:
              type: integer
              example: 168
          type: object
      type: object
    GuildMember:
      description: "Un membre : le joueur public, plus ce que la guilde sait de lui. Les champs de\n`Player` sont **étalés** et non imbriqués — le client dessine une ligne, pas\ndeux objets, et `GET /api/players/{id}` sert exactement le même bloc.\n"
      allOf:
        -
          $ref: '#/components/schemas/Player'
        -
          required:
            - role
            - joinedAt
          properties:
            role:
              type: string
              enum:
                - FOUNDER
                - MEMBER
            joinedAt:
              type: string
              format: date-time
          type: object
    GuildDetail:
      description: "La guilde et ses membres d'un bloc — **c'est l'écran**. L'onglet ne s'ouvre\njamais sans les deux, et les séparer coûterait un aller-retour pour un écran\nqui n'a rien à afficher entre-temps.\n"
      allOf:
        -
          $ref: '#/components/schemas/Guild'
        -
          required:
            - members
          properties:
            members:
              description: "**Le fondateur d'abord, puis par date d'entrée croissante.** Un\nordre décidé par le serveur, jamais celui que rend la base : sans\n`ORDER BY`, PostgreSQL sert les lignes comme il veut et change\nd'avis quand la table grossit. Une liste qui se réordonne toute\nseule entre deux ouvertures d'écran est un bug qu'on ne sait pas\nreproduire.\n"
              type: array
              items:
                $ref: '#/components/schemas/GuildMember'
          type: object
    MyGuild:
      description: "L'enveloppe de `GET /api/guilds/mine`. Elle existe parce que « pas de guilde »\ndoit être une réponse et non une erreur : c'est la requête d'ouverture de\nl'onglet, et un joueur sans guilde est dans un état normal — l'écran l'invite à\nen fonder une.\n"
      required:
        - guild
      properties:
        guild:
          nullable: true
          allOf:
            -
              $ref: '#/components/schemas/GuildDetail'
      type: object
    Risala:
      description: "Un défi sportif envoyé par un membre à toute sa guilde, vivant deux semaines.\nDeux cohabitent en régime établi : une nouvelle arrive chaque semaine, la plus\nancienne s'éteint à la seconde exacte où la nouvelle naît.\n"
      required:
        - id
        - discipline
        - senderId
        - senderDisplayName
        - revealedAt
        - expiresAt
        - bonusPercent
      properties:
        id:
          type: string
          format: uuid
        discipline:
          $ref: '#/components/schemas/Discipline'
        senderId:
          type: string
          format: uuid
        senderDisplayName:
          description: "`null` si l'expéditeur a quitté la guilde depuis la révélation : son défi reste, son nom n'est plus celui d'un co-équipier."
          type: string
          nullable: true
        revealedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        bonusPercent:
          description: "**Résolu pour l'appelant** : ce qu'il touche sur cette discipline, en\npourcentage du socle. 150 s'il reçoit la Risāla, 50 s'il l'a envoyée.\nLe serveur arbitre les valeurs de jeu — un client qui dériverait son\npropre bonus pourrait aussi se tromper, et l'écart avec le ledger ne\nse verrait qu'au signalement d'un joueur.\n"
          type: integer
          example: 150
      type: object
    RisalaTurn:
      description: "Le tour en cours : qui doit choisir la Risāla de la semaine, et jusqu'à quand.\nUne information pour tout le monde, une action pour un seul.\n"
      required:
        - senderId
        - senderDisplayName
        - mine
        - deadline
        - discipline
        - choosable
      properties:
        senderId:
          type: string
          format: uuid
        senderDisplayName:
          type: string
          nullable: true
        mine:
          description: "Évite au client de comparer des UUID pour savoir s'il dessine un bouton ou une phrase."
          type: boolean
        deadline:
          description: "Limite pour choisir **et** instant de la révélation : un seul point sur la\ngrille hebdomadaire, donc il n'existe jamais de fenêtre où le choix est\nencore possible alors que la Risāla est déjà partie.\n"
          type: string
          format: date-time
        discipline:
          description: "**Renseignée seulement pour son auteur**, et seulement s'il a déjà choisi.\nLe choix se fait à l'aveugle : c'est toute la mécanique, et l'annoncer\nd'avance viderait le rendez-vous du dimanche soir de sa raison d'être.\n"
          nullable: true
          allOf:
            -
              $ref: '#/components/schemas/Discipline'
        choosable:
          description: "Les disciplines qu'un tour peut encore demander : celles qui créditent de\nl'XP, moins celles déjà portées par une Risāla vivante. Rendue à tout le\nmonde — c'est une propriété de l'état de la guilde, pas un secret de son\nporteur — et calculée par le serveur, qui valide le choix avec la même\nliste.\n"
          type: array
          items:
            $ref: '#/components/schemas/Discipline'
      type: object
    Risalat:
      description: "L'écran des Risālāt d'un bloc. L'onglet ne s'ouvre jamais sans les trois, et les\nséparer coûterait un aller-retour pour un écran qui n'a rien à afficher\nentre-temps — même raison que `GuildDetail`.\n"
      required:
        - risalat
        - turn
        - nextRevealAt
      properties:
        risalat:
          description: "Les vivantes, **dans l'ordre de révélation** — qui est aussi celui de leur extinction."
          type: array
          items:
            $ref: '#/components/schemas/Risala'
        turn:
          description: "`null` quand la guilde n'a pas encore de tour : un seul membre, ou fondée depuis la dernière bascule hebdomadaire."
          nullable: true
          allOf:
            -
              $ref: '#/components/schemas/RisalaTurn'
        nextRevealAt:
          description: "Le prochain rendez-vous hebdomadaire — quand la Risāla du tour part et quand\nle tour suivant se tire. **Toujours rendu**, y compris sans Risāla ni tour :\nc'est justement là, les deux premières semaines d'une guilde neuve, que le\nclient n'a rien d'autre à dire.\n\nRendu comme un instant, jamais comme la grille qui le produit : nommer un\njour et une heure côté client reviendrait à nommer ceux du fuseau de la\nsemaine de jeu, pas celui du lecteur — faux pour qui n'est pas dans ce\nfuseau, et faux en silence le jour où l'équilibrage de la grille change,\npuisqu'une phrase codée en dur dans une app déjà publiée continuerait\nd'annoncer l'ancienne sans que rien ne le signale.\n\nCoïncide avec `turn.deadline` quand un tour est ouvert et que la bascule qui\nl'a créé s'est exécutée à l'heure — mais c'est une conséquence du calendrier,\npas une garantie du contrat : ne pas s'y fier pour déduire l'un de l'autre.\n"
          type: string
          format: date-time
      type: object
    UserProfile:
      required:
        - id
        - email
        - displayName
        - timezone
        - registeredAt
        - title
        - nextTitle
        - notificationPreferences
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        timezone:
          description: "Identifiant IANA. **Le streak et le plafond quotidien se calculent dedans** : c'est un attribut de profil, jamais une déduction."
          type: string
          example: Europe/Paris
        registeredAt:
          type: string
          format: date-time
        title:
          description: "Le titre porté, ou `null` si le joueur n'en a débloqué aucun ou n'en affiche aucun."
          nullable: true
          allOf:
            -
              $ref: '#/components/schemas/PlayerTitle'
        nextTitle:
          description: "Le plus proche d'aboutir parmi ceux qui restent. `null` quand il les a tous."
          nullable: true
          allOf:
            -
              $ref: '#/components/schemas/PlayerTitle'
        notificationPreferences:
          description: "Toutes les catégories connues, jamais seulement celles coupées (#132) — le\nclient lit l'état exact de chacune plutôt que de connaître le défaut. Clé =\nvaleur de `NotificationCategory`, valeur = activée.\n"
          type: object
          example:
            GUILD_ACTIVITY: true
          additionalProperties:
            type: boolean
      type: object
    TokenPair:
      description: "Deux jetons de nature différente. Le JWT porte l'identité et ne se révoque pas —\nd'où sa courte durée. Le refresh token est **à usage unique et rotatif**, groupé par\nfamille : une famille est un appareil connecté, s'en déconnecter la révoque\nentièrement. Rejouer un jeton déjà consommé révoque toute la famille.\n"
      required:
        - accessToken
        - tokenType
        - expiresIn
        - refreshToken
        - refreshTokenExpiresAt
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          description: 'Secondes de validité du JWT.'
          type: integer
          example: 900
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
      type: object
    AuthSession:
      description: "Ce que rendent l'inscription, la connexion et le rafraîchissement — le profil et la paire de jetons, en une réponse."
      required:
        - user
        - tokens
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        tokens:
          $ref: '#/components/schemas/TokenPair'
      type: object
    Device:
      description: "Un appareil enregistré pour la notification push. Rendu par `POST /api/devices`,\nque l'appel soit un premier enregistrement ou un réenregistrement — la route est\nun upsert par construction, et rien dans la réponse ne distingue les deux cas.\n\n**Le jeton n'y figure jamais.** Le client vient de l'envoyer ; le faire revenir\ndans une réponse HTTP en ferait une valeur qui finit dans des logs pour rien.\n"
      required:
        - id
        - platform
        - environment
        - registeredAt
        - lastSeenAt
      properties:
        id:
          type: string
          format: uuid
        platform:
          description: "Le système de l'appareil. Deux valeurs aujourd'hui, comme `source` n'en avait que deux au premier jour — l'enum est prévue pour en accueillir d'autres sans que la forme bouge."
          type: string
          enum:
            - IOS
            - ANDROID
        environment:
          description: "Le canal de build qui a émis le jeton. Un même appareil produit un jeton différent selon qu'il tourne un client de dev Expo ou un build publié — sans ce champ, une campagne de production irait aussi aux téléphones des développeurs."
          type: string
          enum:
            - DEVELOPMENT
            - PRODUCTION
        registeredAt:
          description: "Le tout premier enregistrement de ce jeton. Ne bouge pas si le même jeton change de propriétaire — c'est `lastSeenAt` qui le signale."
          type: string
          format: date-time
        lastSeenAt:
          description: "Rafraîchi à chaque appel de la route, y compris quand rien d'autre ne change."
          type: string
          format: date-time
      type: object
    Workout:
      description: "**La seule forme d'un workout dans toute l'API** — l'historique la sert, le `SyncSummary`\nl'embarque telle quelle. Un client décode un seul type.\n\nUne séance **déjà faite** : elle n'a pas d'état, et `endedAt` comme `durationSeconds` ne\nsont pas nullables. Un workout arrive terminé ou n'arrive pas.\n\n`durationSeconds` est calculée par le serveur à partir des deux bornes, jamais recopiée\nd'un champ envoyé par le client. C'est la durée **réellement mesurée** : au-delà du\nplafond, l'XP est calculée sur une durée écrêtée, mais l'historique dit ce qui s'est\npassé.\n\n**Les mesures sont nullables, et c'est structurel** : aucun appareil ne fournit tout.\n`null` veut dire « non mesuré », jamais zéro — un tour de piste plat a bien un dénivelé\nde zéro.\n"
      required:
        - id
        - discipline
        - source
        - trust
        - startedAt
        - endedAt
        - durationSeconds
        - distanceMeters
        - calories
        - elevationGainMeters
        - averageHeartRate
        - externalId
      properties:
        id:
          type: string
          format: uuid
        discipline:
          $ref: '#/components/schemas/Discipline'
        source:
          description: "L'agrégateur de plateforme qui a rapporté la séance, pas l'appareil qui l'a\nmesurée : une montre Garmin arrive en `APPLE_HEALTH` sur iPhone et en\n`HEALTH_CONNECT` sur Android.\n"
          type: string
          enum:
            - APPLE_HEALTH
            - HEALTH_CONNECT
        trust:
          description: "Toujours `PROVIDER_VERIFIED` aujourd'hui : les deux sources sont vérifiées. `DECLARED` reste le plancher de l'échelle, pas une valeur morte."
          type: string
          enum:
            - DECLARED
            - PROVIDER_VERIFIED
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        durationSeconds:
          type: integer
        distanceMeters:
          type: integer
          nullable: true
        calories:
          type: integer
          nullable: true
        elevationGainMeters:
          type: integer
          nullable: true
        averageHeartRate:
          type: integer
          nullable: true
        externalId:
          description: "L'identifiant chez le fournisseur, rendu parce que c'est le client qui l'a envoyé : il peut ainsi rapprocher sa liste HealthKit de ce que le serveur connaît déjà, sans deviner."
          type: string
          nullable: true
      type: object
    WorkoutPage:
      description: "Une page d'historique, **dans l'ordre de la pratique** : `startedAt` décroissant, puis\nl'identifiant pour départager deux séances commencées à la même seconde.\n\n`nextCursor` est une **chaîne opaque** — le client la renvoie telle quelle, il n'a rien à\ny lire. `null` signifie la fin ; il n'y a pas de total, un défilement infini n'en a aucun\nusage.\n"
      required:
        - workouts
        - nextCursor
      properties:
        workouts:
          type: array
          items:
            $ref: '#/components/schemas/Workout'
        nextCursor:
          type: string
          nullable: true
      type: object
    SyncState:
      description: "De quoi demander la bonne fenêtre à HealthKit ou Health Connect.\n\n**Le curseur vient du serveur.** Le client peut garder sa date de dernière\nsynchronisation en local, et il le fera pour éviter un aller-retour au démarrage — mais\nil ne doit pas en *dépendre* : réinstallation, changement d'appareil, second appareil sur\nle même compte. Le cache local est une optimisation, pas la vérité.\n\n**La fenêtre est servie et pas codée en dur** : elle doit pouvoir bouger sans publication\nsur les stores. Une app qui demanderait trente jours pendant que le serveur en accepte\nsoixante enverrait moins que ce qu'elle pourrait.\n"
      required:
        - lastImportedAt
        - importWindowDays
      properties:
        lastImportedAt:
          description: "La fin du workout le plus récent que le serveur ait en base — pas la date du dernier\nappel d'import, qui a pu ne rien apporter. Les séances archivées hors fenêtre comptent :\nce qu'on désigne ici est la frontière de ce que le serveur **connaît**, pas de ce qu'il a\npayé. `null` sur un compte qui n'a jamais synchronisé.\n"
          type: string
          format: date-time
          nullable: true
        importWindowDays:
          description: "Au-delà, une séance est conservée mais ne rapporte pas d'XP. C'est ce qui empêche trois ans d'archives d'amener un joueur au niveau 60 avant sa première course pour Grrind."
          type: integer
          example: 30
      type: object
    WorkoutImportRequest:
      description: "Ce que la montre a enregistré depuis la dernière synchronisation. **Un lot, pas un\nworkout** : revenir après dix jours d'absence avec trois séances à créditer est le cas\nnominal.\n\nLe client envoie le **type brut du fournisseur**, jamais une `discipline` : la\ntraduction est serveur, ce qui permet d'ouvrir un sport sans publier sur les stores.\nUn type inconnu n'est pas une erreur — la séance est écartée et nommée dans la\nréponse.\n\n**La durée n'est pas un champ.** Elle se dérive de `startedAt` et `endedAt`, arbitrée\npar le serveur : l'accepter en entrée donnerait au client une prise sur ce qu'il gagne.\n"
      required:
        - workouts
      properties:
        workouts:
          type: array
          items:
            $ref: '#/components/schemas/ImportedWorkout'
          maxItems: 200
          minItems: 1
      type: object
    ImportedWorkout:
      description: "Une séance candidate. Les mesures sont toutes facultatives, et c'est structurel : aucun appareil ne fournit tout. `null` veut dire « non mesuré », jamais zéro."
      required:
        - externalId
        - source
        - activityType
        - startedAt
        - endedAt
      properties:
        externalId:
          description: "`HKWorkout.uuid` côté Apple, `metadata.id` côté Health Connect. Il porte toute la protection contre le double crédit — le renvoyer à l'identique est ce qui rend une resynchronisation inoffensive."
          type: string
          maxLength: 128
        source:
          type: string
          enum:
            - APPLE_HEALTH
            - HEALTH_CONNECT
        activityType:
          description: 'Le nom de case `HKWorkoutActivityType` côté Apple, la constante `EXERCISE_TYPE_*` côté Health Connect. Envoyé tel quel, sans interprétation.'
          type: string
          example: traditionalStrengthTraining
          maxLength: 64
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        distanceMeters:
          type: integer
          nullable: true
          minimum: 0
        calories:
          type: integer
          nullable: true
          minimum: 0
        elevationGainMeters:
          type: integer
          nullable: true
          minimum: 0
        averageHeartRate:
          type: integer
          nullable: true
          maximum: 300
          minimum: 1
      type: object
    DailyActivityUpsertRequest:
      description: "Un lot de journées à réviser (#165), en dehors de la synchro d'import : une journée\nsédentaire doit pouvoir se remonter sans aucun workout à envoyer.\n"
      required:
        - days
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/DailyActivityEntry'
          maxItems: 90
          minItems: 1
      type: object
    DailyActivityEntry:
      description: "Une journée : l'énergie active seule — `activeEnergyBurned` chez Apple,\n`ActiveCaloriesBurnedRecord` chez Health Connect. Ni pas, ni étages, ni heures\nactives : une seule métrique, une seule permission de plus côté client.\n"
      required:
        - day
        - activeEnergyKcal
        - source
      properties:
        day:
          description: "Une date civile, jamais un instant : c'est le client qui sait dans quel fuseau\nla montre a agrégé la journée, exactement comme pour le streak.\n"
          type: string
          format: date
          example: '2026-08-27'
        activeEnergyKcal:
          description: "La borne haute est un garde-fou contre une unité mal convertie, pas une opinion sur ce qu'une journée humaine peut brûler."
          type: integer
          maximum: 20000
          minimum: 0
        source:
          type: string
          enum:
            - APPLE_HEALTH
            - HEALTH_CONNECT
      type: object
    SyncSummary:
      description: "**Le contrat le plus coûteux à casser du produit**, dans sa forme multi-workouts. Ce que\nle joueur reçoit quand sa montre a fini de parler.\n\n**L'ordre des champs est l'ordre de l'animation**, à deux niveaux : d'abord entre les\nworkouts — `imported` est chronologique, celui du crédit — puis à l'intérieur de chacun.\n\n**Rien n'est tronqué.** Au-delà d'une vingtaine de workouts, tout jouer prend plusieurs\nminutes : c'est une décision de mise en scène, et elle appartient au client. Le serveur\nenvoie tout, le client décide de ce qu'il joue.\n"
      required:
        - syncedAt
        - imported
        - skipped
        - totals
        - rulesetVersion
      properties:
        syncedAt:
          description: "L'horloge du serveur, et le seul instant de ce payload qui ne vienne pas d'un fournisseur. Sert de repère de dernière synchronisation réussie."
          type: string
          format: date-time
        imported:
          description: "Un `RewardSummary` par workout crédité, dans l'ordre chronologique. **C'est\nexactement l'objet que le client sait déjà jouer**, palier de départ compris : la\nbarre part du bon endroit pour *chacun*, et l'enchaînement est continu sans un seul\nrecalcul côté client.\n"
          type: array
          items:
            $ref: '#/components/schemas/RewardSummary'
        skipped:
          description: "Les séances qui n'ont **rien rapporté**, chacune **nommée** et non comptée : le client\ndoit pouvoir dire « le curling n'est pas encore un sport chez nous » plutôt que « 1\nséance ignorée ».\n\nÉcarté ne veut pas toujours dire absent. `OUT_OF_WINDOW` écarte le *crédit*, pas la\nséance : elle est bien en base et apparaîtra dans l'historique.\n"
          type: array
          items:
            required:
              - externalId
              - activityType
              - reason
            properties:
              externalId:
                type: string
              activityType:
                type: string
              reason:
                description: "`ALREADY_IMPORTED` : déjà en base sous le même couple (source, identifiant). Banal\net attendu — c'est ce que rend un client qui a perdu son curseur.\n\n`UNSUPPORTED_ACTIVITY` : aucune discipline ne correspond. Rien n'est écrit, donc\nrien n'est définitif — le jour où le sport entre dans la table serveur, la même\nséance renvoyée est créditée.\n\n`OUT_OF_WINDOW` : trop ancienne pour rapporter de l'XP, mais **conservée**. Le\njoueur retrouve son passé sans le monnayer, et le premier import devient un moment\nde produit au lieu d'un mur.\n\n`OVERLAPS` : une autre séance couvre déjà ce créneau. Ce ne sont pas deux\nentraînements, c'est le même vu par deux applications — beaucoup de gens ont Apple\nExercice *et* Strava sans le savoir. C'est l'enregistrement le plus complet qui\ngagne, sauf si l'autre est déjà en base.\n\n`TOO_SHORT` : sous le plancher de durée. Un faux départ sur la montre n'est pas une\nséance, et rien n'est écrit.\n"
                type: string
                enum:
                  - ALREADY_IMPORTED
                  - UNSUPPORTED_ACTIVITY
                  - OUT_OF_WINDOW
                  - OVERLAPS
                  - TOO_SHORT
            type: object
        totals:
          description: "Le raccourci de l'écran de résumé — « +847 XP · niveau 10 → 15 » — et ce que voit le\njoueur qui saute l'animation.\n\n**C'est un raccourci, jamais une source** : il est entièrement dérivé d'`imported`,\nqui dit déjà tout. Deux vérités finissent toujours par diverger.\n\n`null` quand rien n'a été crédité : il n'y a pas d'état d'arrivée quand rien n'est\narrivé, et « niveau 0 → 0 » mentirait à un joueur de niveau 12.\n"
          nullable: true
          allOf:
            -
              $ref: '#/components/schemas/SyncTotals'
        rulesetVersion:
          description: "L'équilibrage sous lequel la synchronisation a été calculée. Affiché dans un rapport de bug : c'est ce qui rend une capture d'écran exploitable."
          type: string
      type: object
    SyncTotals:
      required:
        - levelBefore
        - levelAfter
        - xpBefore
        - xpAfter
        - xpAwarded
        - workoutCount
      properties:
        levelBefore:
          type: integer
          example: 10
        levelAfter:
          type: integer
          example: 15
        xpBefore:
          type: integer
        xpAfter:
          type: integer
        xpAwarded:
          description: "La somme des montants accordés, écarts non compris — un workout écarté n'a rien rapporté."
          type: integer
        workoutCount:
          description: "Le nombre de workouts **crédités**, donc la longueur d'`imported`."
          type: integer
      type: object
    XpLine:
      description: "Une contribution au total, entier signé. Un multiplicateur se résout en points\n**avant** d'arriver ici : ce qui est écrit est ce que le joueur a reçu, pas la\nformule. Les deux dernières sources sont des garde-fous, négatives au crédit.\n\n**Une ligne à zéro n'existe pas.** Une métrique non mesurée, un bonus trop petit\npour peser, un garde-fou qui n'a rien repris : rien de tout ça n'occupe une ligne\nd'animation. Le client peut donc jouer chaque ligne sans la tester.\n"
      required:
        - source
        - amount
      properties:
        source:
          description: "`BASE` est le temps — une minute vaut un point. `DISTANCE` et `ELEVATION`\nsont ce que le terrain ajoute, et n'apparaissent que sur les disciplines où\nune montre les mesure de façon fiable. Les cinq suivantes sont les\ncontributeurs de modificateurs ; les deux dernières, les garde-fous.\n"
          type: string
          enum:
            - BASE
            - DISTANCE
            - ELEVATION
            - STREAK
            - ITEM
            - SKILL
            - LEAGUE
            - GUILD
            - DIMINISHING
            - DAILY_CAP
        amount:
          type: integer
          example: -55
      type: object
    AttributeGauge:
      description: "Une caractéristique du personnage — Strength, Endurance, Mobility ou Dexterity —\navec ce que la séance lui a rapporté et sa jauge avant/après. `gained` est le\ndétail par caractéristique d'`xp.awarded` : leur somme sur les quatre vaut\nexactement ce total.\n"
      required:
        - gained
        - before
        - after
      properties:
        gained:
          description: "Peut valoir zéro : cette séance n'a rien rapporté à cette caractéristique."
          type: integer
          example: 108
        before:
          type: integer
          example: 5000
        after:
          type: integer
          example: 5108
      type: object
    DroppedItemModifier:
      description: 'Un effet porté par un objet tombé — même vocabulaire que `ModifierType`, jamais un mécanisme parallèle.'
      required:
        - type
        - value
        - discipline
      properties:
        type:
          type: string
          enum:
            - XP_MULTIPLIER
            - LOOT_LUCK
            - STREAK_SHIELD
            - UNLOCK_SESSION_TYPE
            - STRENGTH_BONUS
            - ENDURANCE_BONUS
            - MOBILITY_BONUS
            - DEXTERITY_BONUS
            - HP_BONUS
            - DAMAGE_BONUS
            - MITIGATION_BONUS
            - EXTRA_TURN_BONUS
            - DODGE_BONUS
        value:
          description: "Un entier dont l'unité dépend de `type` — un pourcentage pour `XP_MULTIPLIER`, des points d'XP répartis pour un bonus de caractéristique. Jamais un flottant sur une valeur de jeu."
          type: integer
          example: 5
        discipline:
          description: "`null` = l'effet s'applique partout. Une valeur = seulement à cette discipline."
          nullable: true
          allOf:
            -
              $ref: '#/components/schemas/Discipline'
      type: object
    DroppedItem:
      description: "Un objet tombé d'un tirage (#226), de quoi l'afficher **sans requête\nsupplémentaire** — même geste qu'un titre dans `PlayerTitle`.\n"
      required:
        - key
        - name
        - rarity
        - slot
        - modifiers
        - priceCoins
      properties:
        key:
          description: "La clé du catalogue — stable, ce n'est pas un identifiant d'exemplaire."
          type: string
          example: WORN_RUNNING_SHOES
        name:
          description: 'Déjà traduit dans la langue du joueur — rien à recharger côté client.'
          type: string
          example: 'Chaussures de course usées'
        rarity:
          type: string
          enum:
            - COMMON
            - UNCOMMON
            - RARE
            - EPIC
            - LEGENDARY
        slot:
          type: string
          enum:
            - HEAD
            - CHEST
            - HANDS
            - LEGS
            - FEET
            - ACCESSORY
            - WEAPON
        modifiers:
          description: "Dans l'ordre du catalogue."
          type: array
          items:
            $ref: '#/components/schemas/DroppedItemModifier'
        priceCoins:
          description: "En pièces — de quoi afficher la valeur de l'objet sans recharger le catalogue."
          type: integer
          example: 30
      type: object
    InventoryLine:
      description: "Un objet possédé (#30) — la même forme que `DroppedItem`, une seule clé de plus :\n`quantity`. Ce n'est pas une troisième forme d'objet, c'est la même, augmentée d'un\nfait qu'un tirage n'a jamais eu à porter — un objet qui tombe en crée ou en\nincrémente une, il n'en a jamais une à afficher lui-même.\n"
      type: object
      allOf:
        -
          $ref: '#/components/schemas/DroppedItem'
        -
          required:
            - quantity
          properties:
            quantity:
              description: "Le nombre d'exemplaires possédés — pas de vente ni de rebut en v1, il ne redescend jamais."
              type: integer
              example: 1
          type: object
    Inventory:
      description: "`GET /api/inventory`, et ce que `PUT`/`DELETE /api/inventory/equipment/{slot}`\nrendent après une mutation, pour un seul aller-retour — le sac, la doublure\néquipée par emplacement, la bourse.\n\n`equipment` porte toujours les sept emplacements d'`EquipmentSlot`, `null` pour\nceux qui sont vides — jamais une clé absente, qui forcerait le client à distinguer\n« pas encore chargé » de « rien ici ». `items` porte tout ce que le joueur possède,\néquipé compris : ce n'est pas une donnée à recouper contre `equipment`, c'est la\nmême ligne, vue sous un autre angle.\n"
      required:
        - coins
        - equipment
        - items
      properties:
        coins:
          description: "Le solde de la bourse — cet écran lui appartient autant qu'au sac."
          type: integer
        equipment:
          required:
            - HEAD
            - CHEST
            - HANDS
            - LEGS
            - FEET
            - ACCESSORY
            - WEAPON
          properties:
            HEAD:
              nullable: true
              allOf:
                -
                  $ref: '#/components/schemas/InventoryLine'
            CHEST:
              nullable: true
              allOf:
                -
                  $ref: '#/components/schemas/InventoryLine'
            HANDS:
              nullable: true
              allOf:
                -
                  $ref: '#/components/schemas/InventoryLine'
            LEGS:
              nullable: true
              allOf:
                -
                  $ref: '#/components/schemas/InventoryLine'
            FEET:
              nullable: true
              allOf:
                -
                  $ref: '#/components/schemas/InventoryLine'
            ACCESSORY:
              nullable: true
              allOf:
                -
                  $ref: '#/components/schemas/InventoryLine'
            WEAPON:
              nullable: true
              allOf:
                -
                  $ref: '#/components/schemas/InventoryLine'
          type: object
        items:
          type: array
          items:
            $ref: '#/components/schemas/InventoryLine'
      type: object
    CoinTransaction:
      description: "Une écriture au ledger de pièces (#30) — le pendant, en beaucoup plus simple, de\n`XpTransaction` : `amount` **est** l'écriture, il n'y a ni breakdown ni répartition\nà recomposer.\n"
      required:
        - id
        - sourceId
        - reason
        - amount
        - occurredAt
      properties:
        id:
          type: string
          format: uuid
        sourceId:
          description: "Ce qui a produit l'écriture — l'identifiant du workout ou du combat. Le nom du ledger, pas celui d'une séance."
          type: string
          format: uuid
        reason:
          type: string
          enum:
            - WORKOUT_DROP
            - BATTLE_DROP
        amount:
          description: "Signé. Aucune ligne négative n'existe encore en v1 — la garde s'applique malgré tout à tout appel, quel que soit le signe."
          type: integer
        occurredAt:
          description: "L'instant du fait — la date du sport ou du combat, pas celle de l'écriture."
          type: string
          format: date-time
      type: object
    CoinHistoryPage:
      description: "`GET /api/inventory/coins` : le solde, et une page de mouvements dans l'ordre du\nfait — `occurredAt` décroissant, puis l'identifiant pour départager, même tri\nqu'`XpHistoryPage` et `BattlePage`. Une pièce créditée par un vieux workout se\nrange à la date de ce workout, pas à celle de l'écriture — voir le docblock de\n`CoinTransactionRepository::history()`.\n"
      required:
        - balance
        - transactions
        - nextCursor
      properties:
        balance:
          type: integer
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/CoinTransaction'
        nextCursor:
          type: string
          nullable: true
      type: object
    RewardSummary:
      description: "Ce que le joueur reçoit pour **un** workout crédité. Un `SyncSummary` en contient\nautant qu'il y a eu de séances, dans l'ordre chronologique.\n\n**L'ordre des champs est l'ordre de l'animation** : le client le joue de haut en\nbas — la séance se referme, la barre d'XP se remplit ligne à ligne, **les cinq\njauges de caractéristiques montent**, le niveau bascule, le titre tombe, le loot\nse révèle, **puis** les pièces tombent dedans. Un champ déplacé change la mise\nen scène.\n\n`attributes` se place entre `xp` et `level`, et nulle part ailleurs : les\ncaractéristiques sont la conséquence directe de l'XP qui vient de tomber, le\nniveau celui du **total** qu'elles composent — il vient donc après la\nrépartition qui l'alimente.\n\n**Un seul aller-retour.** Rien ici ne demande de recharger quoi que ce soit avant de\njouer l'animation — d'où le palier donné avant *et* après, les titres déjà\ntraduits, et `loot` qui porte de quoi afficher chaque objet sans recharger le\ncatalogue. `attributes` suit la même règle, Vitality comprise.\n\n**`coins` se place entre `loot` et `streak`, jamais ailleurs** — même geste que\nles jauges de caractéristiques et le palier de niveau, `{gained, before, after}`,\net pour la même raison : une bourse qui repartirait du solde final ne s'anime\npas. `before`/`after` sont lus sur le solde réel du joueur, jamais reconstitués\ndepuis `gained`.\n\n**Une séance sans tirage** — non créditée, ou sans table éligible — porte\n`loot: []` et un `coins` à gain nul, jamais des clés absentes : le client anime\nla même séquence dans tous les cas.\n\n`streak` et `unlockableNodes` restent **présents et vides** jusqu'aux Lots 5 et\n7. Une clé qui apparaîtrait plus tard obligerait un client déjà déployé à la\nrendre optionnelle pour toujours.\n"
      required:
        - session
        - xp
        - attributes
        - level
        - titlesUnlocked
        - loot
        - coins
        - streak
        - unlockableNodes
        - rulesetVersion
      properties:
        session:
          $ref: '#/components/schemas/Workout'
        xp:
          required:
            - awarded
            - breakdown
            - reason
          properties:
            awarded:
              description: 'La somme du `breakdown`, jamais autre chose.'
              type: integer
              example: 145
            breakdown:
              description: "Dans l'ordre d'affichage. Le client ne le trie pas, il le joue."
              type: array
              items:
                $ref: '#/components/schemas/XpLine'
            reason:
              description: "`null` pour toute séance créditée normalement — y compris une séance\nentièrement écrêtée par le plafond quotidien, dont `breakdown` porte déjà\nsa ligne `DAILY_CAP` pour l'expliquer.\n\nNon nul uniquement pour une discipline qui ne rapporte pas d'XP par\nconception : `breakdown` reste vide dans ce cas, puisqu'il n'y a rien eu\nà calculer, et `reason` porte l'explication à sa place plutôt qu'un\nbreakdown vide ou une ligne « base : 0 » qui mentirait sur un calcul qui\nn'a jamais eu lieu.\n\n`NO_XP_FEEDS_VITALITY` : la marche. Elle reste une séance à part entière\n— écrite, visible dans l'historique, animée ici — mais n'alimente que\nVitality, jamais l'XP.\n"
              type: string
              nullable: true
              enum:
                - NO_XP_FEEDS_VITALITY
          type: object
        attributes:
          description: "Les cinq caractéristiques du personnage, chacune avec son avant et son\naprès — même raison que le palier de niveau : une jauge qui repartirait de\nzéro mentirait à tout joueur qui n'y était pas.\n\n**Vitality n'a pas de `gained`.** Elle ne reçoit jamais d'XP directement —\nc'est une caractéristique dérivée des quatre autres, qui mesure l'équilibre\nde la pratique. Elle peut donc bouger sans que **cette** séance lui ait\nrien crédité : un joueur qui varie ses sports la voit sauter même le jour\noù la répartition de sa séance n'y touche pas directement.\n"
          required:
            - strength
            - endurance
            - mobility
            - dexterity
            - vitality
          properties:
            strength:
              $ref: '#/components/schemas/AttributeGauge'
            endurance:
              $ref: '#/components/schemas/AttributeGauge'
            mobility:
              $ref: '#/components/schemas/AttributeGauge'
            dexterity:
              $ref: '#/components/schemas/AttributeGauge'
            vitality:
              description: 'Dérivée, jamais créditée : pas de `gained` ici.'
              required:
                - before
                - after
              properties:
                before:
                  type: integer
                  example: 300
                after:
                  type: integer
                  example: 310
              type: object
          type: object
        level:
          required:
            - before
            - xpIntoLevelBefore
            - xpToNextLevelBefore
            - after
            - reached
            - totalXp
            - xpIntoLevel
            - xpToNextLevel
            - skillPointsGranted
          properties:
            before:
              type: integer
              example: 1
            xpIntoLevelBefore:
              description: "Où en était la barre avant la séance. Le client l'y place, **puis** la remplit."
              type: integer
              example: 30
            xpToNextLevelBefore:
              description: "Avec le précédent, la largeur du palier de départ. Elle ne se redéduit pas du reste dès que plusieurs niveaux sont franchis, et sans elle la barre repart de zéro pour un joueur qui n'y était pas. `null` au niveau maximum."
              type: integer
              example: 70
              nullable: true
            after:
              type: integer
              example: 2
            reached:
              description: "Les niveaux franchis, dans l'ordre. En gagner plusieurs d'un coup est un cas normal — le client les anime tous. Vide quand rien ne bouge."
              type: array
              items:
                type: integer
            totalXp:
              type: integer
            xpIntoLevel:
              type: integer
            xpToNextLevel:
              description: "Ce qu'il **reste** à gagner. `null` signifie le niveau maximum ; zéro voudrait dire « atteint »."
              type: integer
              nullable: true
            skillPointsGranted:
              type: integer
          type: object
        titlesUnlocked:
          description: "Vide le plus souvent — un titre est un événement rare, c'est ce qui en fait un."
          type: array
          items:
            $ref: '#/components/schemas/PlayerTitle'
        loot:
          description: 'Ce qui est tombé de cette séance (#226). Vide le plus souvent — voir le docblock de `LootRoller` — et jamais absent : une séance non créditée ou sans table éligible porte `[]`.'
          type: array
          items:
            $ref: '#/components/schemas/DroppedItem'
        coins:
          description: 'Entre `loot` et `streak` : le loot se révèle, puis les pièces tombent dedans (#226).'
          required:
            - gained
            - before
            - after
          properties:
            gained:
              description: 'Peut valoir zéro : aucune table éligible, ou séance non créditée.'
              type: integer
              example: 12
            before:
              type: integer
              example: 40
            after:
              type: integer
              example: 52
          type: object
        streak:
          description: "Lot 5 : toujours `null` aujourd'hui."
          type: object
          nullable: true
        unlockableNodes:
          description: "Lot 7 : toujours vide aujourd'hui."
          type: array
          items:
            type: object
        rulesetVersion:
          description: "L'équilibrage sous lequel ces montants ont été accordés. Le client n'en fait rien ; un rapport de bug, si."
          type: string
      type: object
    Progression:
      description: "L'état du joueur — l'écran d'accueil de l'app en une requête, servi du seul snapshot."
      required:
        - level
        - totalXp
        - xpIntoLevel
        - xpToNextLevel
        - skillPoints
        - attributes
        - vitalityBreakdown
        - activeTitle
        - unlockedTitles
        - rulesetVersion
        - lastProgressionAt
      properties:
        level:
          type: integer
        totalXp:
          type: integer
        xpIntoLevel:
          type: integer
        xpToNextLevel:
          description: '`null` au niveau maximum.'
          type: integer
          nullable: true
        skillPoints:
          description: "Deux nombres, alors qu'ils valent la même chose aujourd'hui. `earned` est un\ncumul de carrière qui ne redescend pas, `available` un solde que les arbres\nferont baisser. Les fondre obligerait à renommer — donc à casser le client —\nau premier point dépensé.\n"
          required:
            - earned
            - available
          properties:
            earned:
              type: integer
            available:
              type: integer
          type: object
        attributes:
          description: "Les cinq caractéristiques du personnage, à l'instant présent — même\nvocabulaire que dans `RewardSummary.attributes`, mais sous une forme\ndifférente : pas de `gained` ni d'avant/après ici, cette route ne rend\nqu'un instant. C'est cet état qui doit rester affiché après une\nsynchronisation, pas seulement le temps de l'animation.\n"
          required:
            - strength
            - endurance
            - mobility
            - dexterity
            - vitality
          properties:
            strength:
              type: integer
              example: 5108
            endurance:
              type: integer
              example: 3200
            mobility:
              type: integer
              example: 900
            dexterity:
              type: integer
              example: 1500
            vitality:
              description: "Dérivée des quatre autres, puis bonifiée par l'énergie active de la fenêtre glissante (#165) — jamais créditée directement. Voir `vitalityBreakdown` pour ce qui explique le bonus, et `RewardSummary.attributes.vitality` pour la même valeur, non bonifiée, au moment d'une séance."
              type: integer
              example: 310
          type: object
        vitalityBreakdown:
          description: "Ce qui explique `attributes.vitality` (#165) : sans ces trois nombres, une\nVitality qui bouge sans qu'aucune séance n'ait été créditée ne récompenserait\nrien aux yeux du joueur.\n"
          required:
            - windowAverageActiveKcal
            - targetActiveKcal
            - bonusPermille
          properties:
            windowAverageActiveKcal:
              description: "L'énergie active moyenne sur la fenêtre glissante — une journée absente y compte pour zéro, c'est précisément ce qui mesure la sédentarité."
              type: integer
              example: 420
            targetActiveKcal:
              description: "La cible d'équilibrage : l'atteindre en moyenne vaut le bonus plafond."
              type: integer
              example: 500
            bonusPermille:
              description: 'Le bonus effectivement appliqué à `attributes.vitality`, en millièmes du socle.'
              type: integer
              example: 168
          type: object
        activeTitle:
          nullable: true
          allOf:
            -
              $ref: '#/components/schemas/PlayerTitle'
        unlockedTitles:
          type: array
          items:
            $ref: '#/components/schemas/PlayerTitle'
        rulesetVersion:
          type: string
        lastProgressionAt:
          description: "`null` pour un joueur qui n'a encore rien fait."
          type: string
          format: date-time
          nullable: true
      type: object
    TitleBoard:
      description: "Le catalogue **entier**, traduit et situé. Pas seulement l'acquis : un mur qui ne\nmontrerait que l'atteint ne donnerait rien à viser.\n"
      required:
        - activeTitleId
        - titles
      properties:
        activeTitleId:
          description: 'Redondant avec le tableau — il évite de le parcourir pour savoir quoi cocher, et dit `null` sans ambiguïté.'
          type: string
          nullable: true
        titles:
          type: array
          items:
            $ref: '#/components/schemas/PlayerTitle'
      type: object
    XpTransaction:
      description: "Une écriture au ledger. **Le ledger est la vérité** ; le niveau et le total en sont\ndes projections. Rien ne s'efface : une séance invalidée produit une écriture\nnégative, et les deux restent.\n"
      required:
        - id
        - sourceId
        - reason
        - discipline
        - amount
        - durationSeconds
        - breakdown
        - attributes
        - rulesetVersion
        - occurredAt
      properties:
        id:
          type: string
          format: uuid
        sourceId:
          description: "Ce qui a produit l'écriture — l'identifiant du workout."
          type: string
          format: uuid
        reason:
          type: string
          enum:
            - SESSION_COMPLETED
            - SESSION_INVALIDATED
        discipline:
          $ref: '#/components/schemas/Discipline'
        amount:
          description: 'Signé. La somme du `breakdown`, jamais autre chose.'
          type: integer
        durationSeconds:
          description: 'Signée elle aussi — négative sur une annulation.'
          type: integer
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/XpLine'
        attributes:
          description: "La répartition de `amount` sur les quatre caractéristiques (#159) — ce qui\nrépond à « pourquoi ma Mobility stagne » sans avoir à recouper l'historique\nà la main. Signée comme `amount` : une annulation y montre des valeurs\nnégatives, la même contrepartie exacte qui explique la baisse.\n\n**Pas de `vitality` ici**, à la différence du vocabulaire de `RewardSummary` :\nelle ne reçoit jamais d'écriture, aucune transaction ne lui est adressée.\nSon état courant se lit sur `GET /api/progression`.\n"
          required:
            - strength
            - endurance
            - mobility
            - dexterity
          properties:
            strength:
              type: integer
              example: 108
            endurance:
              type: integer
              example: 0
            mobility:
              type: integer
              example: 0
            dexterity:
              type: integer
              example: 0
          type: object
        rulesetVersion:
          description: "Celui du calcul, pas celui d'aujourd'hui. C'est ce qui permet de rééquilibrer sans corrompre l'historique."
          type: string
        occurredAt:
          description: "**L'instant du sport, pas celui de l'écriture.** Un workout de mardi importé\nvendredi est daté de mardi : c'est ce qui range l'écriture dans la bonne journée,\npour le plafond quotidien comme pour l'affichage. L'instant de l'écriture, lui,\nest encodé dans l'`id` — c'est un UUID v7.\n"
          type: string
          format: date-time
      type: object
    XpHistoryPage:
      description: "Même pagination qu'à `GET /api/workouts`, curseur opaque compris : deux paginations qui divergeraient coûteraient deux implémentations côté client. L'ordre est celui du sport — `occurredAt` décroissant, puis l'identifiant pour départager."
      required:
        - transactions
        - nextCursor
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/XpTransaction'
        nextCursor:
          type: string
          nullable: true
      type: object
    BattleFighter:
      description: "Un combattant tel qu'affiché. **`mitigationPercent`, `extraTurnPercent` et\n`dodgePercent` sont résolus côté serveur**, jamais des taux que le client\nrecomposerait — même règle que `bonusPercent` sur une Risāla. Le domaine porte des\nmillièmes ; ce sont des pourcentages entiers, tronqués.\n"
      required:
        - hp
        - damage
        - mitigationPercent
        - extraTurnPercent
        - dodgePercent
      properties:
        hp:
          type: integer
          example: 240
        damage:
          type: integer
          example: 31
        mitigationPercent:
          description: 'Réduction du dégât reçu.'
          type: integer
          example: 18
        extraTurnPercent:
          description: 'Chance de rejouer un tour immédiatement.'
          type: integer
          example: 12
        dodgePercent:
          description: "Chance d'esquiver entièrement un coup."
          type: integer
          example: 8
      type: object
    BattleEnemy:
      description: "L'adversaire : les mêmes champs qu'un `BattleFighter`, plus son identité.\n\n**Le nom arrive traduit**, comme les titres : le client n'a pas de table de\ncorrespondance. `key` reste stable d'une locale à l'autre — c'est l'entrée du\ncatalogue (`combat.yaml`), pas une donnée d'affichage.\n"
      required:
        - key
        - name
        - hp
        - damage
        - mitigationPercent
        - extraTurnPercent
        - dodgePercent
      properties:
        key:
          type: string
          example: SAND_JACKAL
        name:
          description: 'Déjà traduit, dans la langue négociée sur `Accept-Language`.'
          type: string
          example: 'Chacal des sables'
        hp:
          type: integer
          example: 180
        damage:
          type: integer
          example: 22
        mitigationPercent:
          type: integer
          example: 10
        extraTurnPercent:
          type: integer
          example: 5
        dodgePercent:
          type: integer
          example: 3
      type: object
    BattleEvent:
      description: "Un instant de la timeline. **Seul l'ordre des éléments de la liste compte** — voir\nla description de `Battle.events` — un événement isolé n'a pas de position propre.\n\nCinq formes, distinguées par `type` ; seuls les champs de la forme concernée\nsont présents, les autres sont **absents**, jamais `null` :\n  - `BATTLE_STARTED` : `playerHp`, `enemyHp` — l'état de départ, avant le premier coup.\n  - `ATTACK` : `attacker`, `damage`, `mitigated`, `targetHpRemaining` — un coup porté,\n    la part absorbée par la mitigation, et ce qu'il reste à la cible.\n  - `DODGE` : `attacker` — la cible de l'attaquant a esquivé, aucun dégât n'est\n    appliqué. Remplace l'`ATTACK` que ce tour aurait produit, ne s'ajoute jamais à\n    côté.\n  - `EXTRA_TURN` : `actor` — qui rejoue un tour immédiatement, que le tour qui l'a\n    déclenché ait porté ou été esquivé.\n  - `BATTLE_FINISHED` : `result` — toujours le dernier événement de la timeline.\n"
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - BATTLE_STARTED
            - ATTACK
            - DODGE
            - EXTRA_TURN
            - BATTLE_FINISHED
        playerHp:
          description: '`BATTLE_STARTED` seulement.'
          type: integer
        enemyHp:
          description: '`BATTLE_STARTED` seulement.'
          type: integer
        attacker:
          description: '`ATTACK` et `DODGE` seulement.'
          type: string
          enum:
            - PLAYER
            - ENEMY
        damage:
          description: '`ATTACK` seulement.'
          type: integer
        mitigated:
          description: '`ATTACK` seulement : la part du dégât brut absorbée par la mitigation.'
          type: integer
        targetHpRemaining:
          description: '`ATTACK` seulement.'
          type: integer
        actor:
          description: '`EXTRA_TURN` seulement.'
          type: string
          enum:
            - PLAYER
            - ENEMY
        result:
          description: '`BATTLE_FINISHED` seulement.'
          type: string
          enum:
            - VICTORY
            - DEFEAT
      type: object
    BattleReward:
      description: "Ce qu'une victoire a rapporté (#227) — persisté sur la ligne du combat, jamais\nrejoué depuis la graine : le jour où `loot.yaml` est rééquilibré, rejouer un\nvieux tirage sous les tables courantes rendrait un butin différent de celui que\nle joueur a vu tomber.\n\n**Vide pour une défaite, ou une victoire tranchée par `max_turns` sans KO** —\n`loot: []` et `coins` à gain nul, jamais des clés absentes : une récompense de\nconsolation ferait du combat perdu la stratégie optimale, puisqu'il est plus\nrapide à jouer qu'à gagner.\n\nMême forme, mêmes clés, dans le même ordre que `loot`/`coins` sur\n`RewardSummary` — les objets d'abord, les pièces ensuite — pour que le client\nréutilise le composant qu'il a déjà écrit.\n"
      required:
        - loot
        - coins
      properties:
        loot:
          description: "Vide pour une défaite, ou si l'adversaire n'a pas de table dédiée."
          type: array
          items:
            $ref: '#/components/schemas/DroppedItem'
        coins:
          required:
            - gained
            - before
            - after
          properties:
            gained:
              description: 'Peut valoir zéro : défaite, ou adversaire sans table dédiée.'
              type: integer
              example: 8
            before:
              type: integer
              example: 40
            after:
              type: integer
              example: 48
          type: object
      type: object
    Battle:
      description: "Un combat PvE joué et jugé — ce que rendent `POST /api/battles` et\n`GET /api/battles/{id}`, à l'identique.\n\n**L'ordre des champs est l'ordre de l'animation**, et c'est un contrat, pas une\nconvention d'écriture — même règle que `RewardSummary`.\n"
      required:
        - id
        - result
        - turns
        - foughtAt
        - player
        - enemy
        - events
        - rewards
      properties:
        id:
          type: string
          format: uuid
        result:
          description: 'Toujours renseigné, du point de vue du joueur : un combat se termine toujours avec un vainqueur.'
          type: string
          enum:
            - VICTORY
            - DEFEAT
        turns:
          type: integer
          example: 7
        foughtAt:
          description: "L'instant de la requête : contrairement à un workout, un combat n'a aucune antériorité au serveur."
          type: string
          format: date-time
        player:
          $ref: '#/components/schemas/BattleFighter'
        enemy:
          $ref: '#/components/schemas/BattleEnemy'
        events:
          description: "La timeline complète, dans l'ordre de l'animation."
          type: array
          items:
            $ref: '#/components/schemas/BattleEvent'
        rewards:
          $ref: '#/components/schemas/BattleReward'
      type: object
    BattleSummary:
      description: "Une ligne de `GET /api/battles` (#220) — **jamais la timeline**. `Battle` peut\ncompter deux cents événements (`max_turns`) ; vingt résumés par page restent\nlégers, et le client va chercher `GET /api/battles/{id}` au moment où il choisit\nun combat précis à rejouer.\n\n`result` est **toujours** `VICTORY` ou `DEFEAT`, y compris pour un combat conclu\npar `max_turns` sans KO — voir la description de `Battle.result`. C'est ce qui\npermet à la liste d'être colorée ligne par ligne sans aucun troisième état à\ndessiner.\n\n`rewards` rend `Battle.rewards` à l'identique (#227) : c'est une ligne déjà\nécrite, rien à recalculer pour l'afficher dans la liste.\n"
      required:
        - id
        - result
        - enemy
        - turns
        - foughtAt
        - rewards
      properties:
        id:
          type: string
          format: uuid
        result:
          type: string
          enum:
            - VICTORY
            - DEFEAT
        enemy:
          description: "La clé et le nom traduit seulement — pas les statistiques de combat, qui\nn'ont pas leur place dans une ligne de liste. Le nom vient de la clé du\nsnapshot, jamais de `EnemyCatalog` : un combat déjà joué est un fait écrit,\nvoir la description de `Battle`.\n"
          required:
            - key
            - name
          properties:
            key:
              type: string
              example: SAND_JACKAL
            name:
              type: string
              example: 'Chacal des sables'
          type: object
        turns:
          type: integer
          example: 7
        foughtAt:
          type: string
          format: date-time
        rewards:
          $ref: '#/components/schemas/BattleReward'
      type: object
    BattlePage:
      description: "Une page d'historique, **dans l'ordre du combat** : `foughtAt` décroissant, puis\nl'identifiant pour départager deux combats livrés à la même seconde.\n\n`nextCursor` est une **chaîne opaque** — le client la renvoie telle quelle. `null`\nsignifie la fin ; il n'y a pas de total, un défilement infini n'en a aucun usage.\n"
      required:
        - battles
        - nextCursor
      properties:
        battles:
          type: array
          items:
            $ref: '#/components/schemas/BattleSummary'
        nextCursor:
          type: string
          nullable: true
      type: object
    ChosenEnemyRequest:
      description: "Le corps, facultatif, de `POST /api/battles` (#219). Absent — ou `{\"enemy\": null}` —\nle serveur choisit l'ennemi au niveau du joueur, comportement inchangé depuis le\n#212. `enemy` porte n'importe quelle clé du catalogue rendu par `GET /api/enemies`,\nboss comme ennemi ordinaire.\n"
      properties:
        enemy:
          type: string
          example: DUNE_SOVEREIGN
          nullable: true
      type: object
    Enemy:
      description: "Une entrée du catalogue rendu par `GET /api/enemies` — ennemi ordinaire ou boss,\nsous la même forme : le corps de `POST /api/battles` les choisit tous les deux de\nla même façon.\n\n**`minimumLevel` est le niveau requis pour choisir cette clé explicitement.** Pour\nun ennemi ordinaire, c'est aussi le palier auquel le serveur le choisirait tout\nseul en l'absence de corps ; pour un boss, c'est le seul verrou — il reste\naffrontable au-delà.\n"
      required:
        - key
        - name
        - minimumLevel
        - hp
        - damage
        - mitigationPercent
        - extraTurnPercent
        - dodgePercent
      properties:
        key:
          type: string
          example: DUNE_SOVEREIGN
        name:
          description: 'Déjà traduit, dans la langue négociée sur `Accept-Language`.'
          type: string
          example: 'Souverain des dunes'
        minimumLevel:
          type: integer
          example: 10
        hp:
          type: integer
          example: 700
        damage:
          type: integer
          example: 40
        mitigationPercent:
          type: integer
          example: 20
        extraTurnPercent:
          type: integer
          example: 12
        dodgePercent:
          type: integer
          example: 9
      type: object
    EnemyCatalog:
      description: "Le catalogue entier rendu par `GET /api/enemies` — niché sous `enemies`, jamais un\ntableau nu à la racine, même convention que `WorkoutPage` et `TitleBoard` : c'est ce\nqui laisse la place à un champ frère plus tard sans casser un client déjà déployé.\nEnnemis ordinaires puis boss, dans l'ordre de déclaration de chaque liste.\n\n**`player` précède `enemies` (#227) : c'est le combattant de l'appelant,\nmodificateurs équipés compris** — le seul endroit de l'API où leur effet se lit\navant de s'engager dans un combat. `GET /api/progression` continue de rendre le\nsocle nu du ledger ; c'est délibéré.\n"
      required:
        - player
        - enemies
      properties:
        player:
          $ref: '#/components/schemas/BattleFighter'
        enemies:
          type: array
          items:
            $ref: '#/components/schemas/Enemy'
      type: object
    FightBattleRequest:
      properties:
        enemy:
          type: string
          nullable: true
          default: null
      type: object
    BattleHistoryQuery:
      properties:
        cursor:
          type: string
          nullable: true
          default: null
        limit:
          type: integer
          default: 20
          maximum: 50
          minimum: 1
      type: object
    FoundGuildRequest:
      properties:
        name:
          type: string
          default: ''
          maxLength: 40
      type: object
    RenameGuildRequest:
      properties:
        name:
          type: string
          default: ''
          maxLength: 40
      type: object
    JoinGuildRequest:
      properties:
        code:
          type: string
          pattern: '[A-Z0-9]+'
          default: ''
          maxLength: 8
          minLength: 8
      type: object
    Discipline:
      type: string
      enum:
        - RUNNING
        - WALKING
        - CYCLING
        - SWIMMING
        - STRENGTH
        - HIIT
        - HIKING
        - MOBILITY
        - CLIMBING
        - FOOTBALL
        - COURT_SPORTS
        - RACKET_SPORTS
    ChooseRisalaRequest:
      properties:
        discipline:
          nullable: true
          oneOf:
            -
              $ref: '#/components/schemas/Discipline'
          default: null
      type: object
    DevicePlatform:
      type: string
      enum:
        - IOS
        - ANDROID
    DeviceEnvironment:
      type: string
      enum:
        - DEVELOPMENT
        - PRODUCTION
    RegisterDeviceRequest:
      properties:
        pushToken:
          type: string
          default: ''
          maxLength: 255
        platform:
          nullable: true
          oneOf:
            -
              $ref: '#/components/schemas/DevicePlatform'
          default: null
        environment:
          nullable: true
          oneOf:
            -
              $ref: '#/components/schemas/DeviceEnvironment'
          default: null
      type: object
    RefreshTokenRequest:
      properties:
        refreshToken:
          type: string
          default: ''
      type: object
    NotificationCategory:
      type: string
      enum:
        - GUILD_ACTIVITY
        - RISALA_TURN
        - RISALA_REVEALED
    NotificationPreferenceRequest:
      properties:
        category:
          nullable: true
          oneOf:
            -
              $ref: '#/components/schemas/NotificationCategory'
          default: null
        enabled:
          type: boolean
          nullable: true
          default: null
      type: object
    UpdateProfileRequest:
      properties:
        displayName:
          type: string
          nullable: true
          default: null
          maxLength: 40
        timezone:
          type: string
          nullable: true
          default: null
        notificationPreferences:
          type: array
          items:
            $ref: '#/components/schemas/NotificationPreferenceRequest'
          default: []
      type: object
    RegisterRequest:
      properties:
        email:
          type: string
          default: ''
          maxLength: 180
        password:
          type: string
          default: ''
          maxLength: 4096
          minLength: 12
        displayName:
          type: string
          default: ''
          maxLength: 40
        timezone:
          type: string
          default: UTC
      type: object
    SocialSignInRequest:
      properties:
        code:
          type: string
          default: ''
          maxLength: 2048
        redirectUri:
          type: string
          default: ''
          maxLength: 2048
        codeVerifier:
          type: string
          nullable: true
          default: null
          maxLength: 128
          minLength: 43
        timezone:
          type: string
          default: UTC
      type: object
    XpHistoryQuery:
      properties:
        cursor:
          type: string
          nullable: true
          default: null
        limit:
          type: integer
          default: 20
          maximum: 50
          minimum: 1
      type: object
    SelectTitleRequest:
      properties:
        titleId:
          type: string
          nullable: true
          default: null
          maxLength: 64
      type: object
    EquipItemRequest:
      properties:
        itemKey:
          type: string
          default: ''
      type: object
    CoinHistoryQuery:
      properties:
        cursor:
          type: string
          nullable: true
          default: null
        limit:
          type: integer
          default: 20
          maximum: 50
          minimum: 1
      type: object
    WorkoutSource:
      type: string
      enum:
        - APPLE_HEALTH
        - HEALTH_CONNECT
    DailyActivityEntryRequest:
      properties:
        day:
          type: string
          format: date-time
          nullable: true
          default: null
        activeEnergyKcal:
          type: integer
          nullable: true
          default: null
          maximum: 20000
          minimum: 0
        source:
          nullable: true
          oneOf:
            -
              $ref: '#/components/schemas/WorkoutSource'
          default: null
      type: object
    DailyActivityUpsertRequest2:
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/DailyActivityEntryRequest'
          default: []
          maxItems: 90
          minItems: 1
      type: object
    ImportedWorkoutRequest:
      properties:
        externalId:
          type: string
          default: ''
          maxLength: 128
        source:
          nullable: true
          oneOf:
            -
              $ref: '#/components/schemas/WorkoutSource'
          default: null
        activityType:
          type: string
          default: ''
          maxLength: 64
        startedAt:
          type: string
          format: date-time
          nullable: true
          default: null
        endedAt:
          type: string
          format: date-time
          nullable: true
          default: null
        distanceMeters:
          type: integer
          nullable: true
          default: null
          minimum: 0
        calories:
          type: integer
          nullable: true
          default: null
          minimum: 0
        elevationGainMeters:
          type: integer
          nullable: true
          default: null
          minimum: 0
        averageHeartRate:
          type: integer
          nullable: true
          default: null
          maximum: 300
          minimum: 1
      type: object
    ImportWorkoutsRequest:
      properties:
        workouts:
          type: array
          items:
            $ref: '#/components/schemas/ImportedWorkoutRequest'
          default: []
          maxItems: 200
          minItems: 1
      type: object
    WorkoutHistoryQuery:
      properties:
        discipline:
          nullable: true
          oneOf:
            -
              $ref: '#/components/schemas/Discipline'
          default: null
        from:
          type: string
          format: date-time
          nullable: true
          default: null
        to:
          type: string
          format: date-time
          nullable: true
          default: null
        cursor:
          type: string
          nullable: true
          default: null
        limit:
          type: integer
          default: 20
          maximum: 50
          minimum: 1
      type: object
  responses:
    BadRequest:
      description: "Requête malformée — en-tête d'idempotence absent, corps illisible."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: "Le jeton d'accès n'a pas fait son travail, et le `type` dit lequel des trois cas\nc'est — `access-token-missing`, `access-token-expired` ou `access-token-invalid`.\nLa distinction est le tout : **expiré** dit de rafraîchir et de rejouer la requête,\n**invalide** et **absent** disent de renvoyer le joueur sur l'écran de connexion.\n"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: "La ressource n'existe pas, **ou n'appartient pas à ce compte**. Les deux cas\nrendent la même réponse : répondre « interdit » confirmerait l'existence, et un\nidentifiant, ça s'essaie en boucle.\n"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: "L'état actuel refuse l'opération. Le `type` dit lequel, et les membres supplémentaires disent comment se recaler."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: "L'appelant est bien identifié, la ressource existe, et il n'a pas le droit\ndemandé. **C'est ce qui distingue ce statut du 404** : un 403 ne se rend qu'à\nquelqu'un qui savait déjà que la ressource existe — un membre de la guilde qui\nn'en est pas le fondateur. À un non-membre, l'API répond 404, sans quoi elle\ndirait quels UUID désignent une guilde.\n"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: "Trop d'essais. L'en-tête `Retry-After` dit combien de secondes attendre, et le\nclient doit l'honorer plutôt que de réessayer en boucle. Aujourd'hui seul\n`POST /api/guilds/join` est limité : un code d'invitation est court par\nnécessité — il se dicte à voix haute — et c'est ce plafond qui rend le tirage au\nhasard sans issue.\n"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableEntity:
      description: 'Le corps est bien formé mais son contenu est refusé.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: "Une clé propre à cette tentative, stable au travers des rejeus du client.\nRejouer la même clé sur la même requête rend la réponse d'origine sans rien\nréexécuter, et l'en-tête `Idempotent-Replay: true` le signale. La même clé sur\nune requête différente est un abus et vaut un 409.\n"
      required: true
      schema:
        type: string
        maxLength: 255
  securitySchemes:
    bearerAuth:
      type: http
      description: "Le JWT rendu par `/api/auth/login`, `/api/auth/register` ou `/api/auth/refresh`.\nQuinze minutes de validité — il ne se révoque pas, c'est pour ça qu'il est court.\nPassé ce délai, on le renouvelle avec le refresh token.\n"
      bearerFormat: JWT
      scheme: bearer
security:
  -
    bearerAuth: []
