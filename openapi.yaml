openapi: 3.0.0
info:
  title: GRRIND
  description: "L'API de GRRIND — le sport en RPG : XP, niveaux, titres, arbres de compétences, loot, séries.\n\n**Le serveur arbitre l'horloge.** L'import accepte les bornes du **fournisseur santé** — une\nséance a eu lieu avant que Grrind en entende parler, aucune horloge serveur n'existe pour un\nfait passé. Ce qu'il n'accepte pas, c'est une **durée** : elle se recalcule des deux bornes.\nLe reste de l'arbitrage — fenêtre d'antériorité, chevauchements, plancher et plafond — refuse\nce qui ne tient pas debout.\n\n**Les écritures de jeu sont idempotentes.** Les routes qui accordent quelque chose exigent un\nen-tête `Idempotency-Key` : un client mobile rejoue ses requêtes, et le rejeu rend la réponse\nd'origine sans rien réexécuter.\n\n**Les erreurs sont en `application/problem+json`** (RFC 9457). Le membre `type` est un\nidentifiant stable sur lequel un client peut brancher un comportement ; le `detail` est du\ntexte, il peut changer.\n"
  version: 1.0.0
paths:
  /api/enemies:
    get:
      tags:
        - Combat
      operationId: get_combat_enemies_list
      responses:
        '200':
          description: "Le combattant de l'appelant, puis le catalogue entier — ennemis ordinaires et boss, dans cet ordre, chacun avec son nom traduit et son niveau minimum."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnemyCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/battles:
    get:
      tags:
        - Combat
      operationId: get_combat_battle_list
      parameters:
        -
          name: cursor
          in: query
          required: false
          schema:
            type: string
            nullable: true
            default: null
        -
          name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 50
            minimum: 1
      responses:
        '200':
          description: "Une page d'historique, du plus récent au plus ancien — un résumé par combat, jamais sa timeline."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BattlePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      tags:
        - Combat
      operationId: post_combat_battle_fight
      parameters:
        -
          $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChosenEnemyRequest'
      responses:
        '201':
          description: "Le combat est joué et écrit. La timeline entière est rendue : un seul aller-retour, rien à recharger avant de l'animer."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Battle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: "Clé d'adversaire inconnue (`enemy-key-unknown`) ou niveau insuffisant (`enemy-level-too-low`)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/battles/{id}':
    get:
      tags:
        - Combat
      operationId: get_combat_battle_show
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Exactement la charge utile rendue par `POST /api/battles` au moment du combat.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Battle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "Le combat n'existe pas, **ou n'a pas été mené par l'appelant** (`battle-not-found`).\nLes deux cas rendent la même réponse, et **jamais 403** : un 403 confirmerait qu'un\ncombat porte cet UUID, et les UUID v7 encodent leur instant de création — l'API\ndeviendrait un moyen d'énumérer les combats joués un jour donné."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/guilds:
    post:
      tags:
        - Guildes
      operationId: post_community_guild_found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuildName'
      responses:
        '201':
          description: "La guilde est fondée et l'appelant en est le fondateur : les deux dans le même geste."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guild'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: "Le joueur appartient déjà à une guilde (`player-already-in-a-guild`). Il doit la quitter avant d'en fonder une autre."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  '/api/guilds/{id}':
    get:
      tags:
        - Guildes
      operationId: get_community_guild_show
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "La même charge utile que `/api/guilds/mine`, sans l'enveloppe : ici la guilde existe forcément, puisqu'un non-membre reçoit 404."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Guildes
      operationId: delete_community_guild_dissolve
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: "La guilde et toutes ses adhésions sont parties dans la même transaction. Ses membres sont libres d'en fonder ou d'en rejoindre une autre."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Guildes
      operationId: patch_community_guild_rename
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuildName'
      responses:
        '200':
          description: 'La guilde renommée.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guild'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  '/api/guilds/{id}/invite-code':
    post:
      tags:
        - Guildes
      operationId: post_community_invite_code_issue
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: "Le nouveau code. **Il révoque le précédent** : une guilde n'a jamais deux codes vivants, et régénérer est le geste par lequel on coupe un code qui a trop circulé."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildInviteCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Guildes
      operationId: delete_community_invite_code_revoke
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: "Plus aucun code ne mène à cette guilde. Révoquer alors qu'il n'y avait rien à révoquer rend le même 204 : l'état visé est atteint."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/guilds/join:
    post:
      tags:
        - Guildes
      summary: "Le limiteur est **configuré, pas écrit** : la politique et les seuils vivent dans\n`config/packages/rate_limiter.yaml`, et l'attribut ne fait que désigner la clé."
      description: "Cette clé est le joueur et non l'IP — une IP mobile change en cours de trajet et se\npartage entre colocataires, alors que seul un compte authentifié peut consommer un\ncode. `args[\"user\"]` est l'argument du contrôleur, disponible parce que l'attribut\nest traité sur `kernel.controller_arguments`, après résolution."
      operationId: post_community_guild_join
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuildJoin'
      responses:
        '200':
          description: "Le joueur est entré. La guilde est rendue en entier, pour que l'écran s'affiche sans second appel."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guild'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 'Le code ne mène à rien : **inconnu, expiré ou révoqué, indistinctement** (`invite-code-not-usable`). Les distinguer dirait quels codes existent.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'Le joueur appartient déjà à une guilde (`player-already-in-a-guild`), ou celle-ci est complète (`guild-is-full`, qui porte sa `capacity`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/guilds/mine:
    get:
      tags:
        - Guildes
      operationId: get_community_guild_mine
      responses:
        '200':
          description: "La guilde du joueur et ses membres, ou `{\"guild\": null}` s'il n'en a pas. **Pas d'erreur dans ce second cas** : ouvrir l'onglet quand on n'a pas de guilde est une situation normale, pas une panne, et c'est l'écran qui invite à en fonder une."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyGuild'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/guilds/mine/leave:
    post:
      tags:
        - Guildes
      operationId: post_community_guild_leave
      responses:
        '204':
          description: "Le joueur est sorti. Trois issues invisibles pour lui, et toutes dans la même transaction :\nil s'en va simplement ; il était fondateur et la guilde passe **au membre le plus ancien** ;\nil était le dernier et la guilde est dissoute, code d'invitation compris."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "Le joueur n'a pas de guilde à quitter (`guild-not-found`)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/guilds/{id}/members/{playerId}':
    delete:
      tags:
        - Guildes
      operationId: delete_community_guild_exclude
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
        -
          name: playerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: "Le membre est sorti. **Il peut revenir avec un code valide** : il n'y a pas de liste\nnoire en v1, et le recours du fondateur est de révoquer le code — ce qui referme la\nguilde pour tout le monde."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: "La guilde est invisible à l'appelant (`guild-not-found`), ou le joueur visé n'en est pas membre (`player-is-not-a-member`)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: "Le fondateur a tenté de s'exclure lui-même (`founder-cannot-exclude-himself`). Il doit passer par `POST /api/guilds/mine/leave`, qui sait gérer la succession."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/players/{id}':
    get:
      tags:
        - Guildes
      operationId: get_community_player_show
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Le profil public. **Exactement le bloc servi dans la liste des membres** : mêmes ports, même ressource, donc un seul type à décoder côté client.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "Le joueur n'existe pas, **ou n'est ni soi-même ni un co-équipier** (`player-not-found`).\nLes deux cas rendent la même réponse, et **jamais 403** : un 403 confirmerait qu'un\ncompte porte cet UUID, et les UUID v7 encodent leur instant de création — l'API\ndeviendrait un moyen d'énumérer les comptes ouverts un jour donné."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/guilds/mine/risalat:
    get:
      tags:
        - Guildes
      operationId: get_community_risalat_show
      responses:
        '200':
          description: "Les Risālāt vivantes **dans l'ordre de révélation** — qui est aussi celui de leur\nextinction — et le tour en cours. Deux en régime établi, une seule après un tour manqué,\naucune la première quinzaine d'une guilde neuve."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Risalat'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "Le joueur n'a pas de guilde (`guild-not-found`). Contrairement à `GET /api/guilds/mine`, cet écran n'existe qu'à l'intérieur d'une guilde."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/guilds/mine/risalat/turn:
    put:
      tags:
        - Guildes
      operationId: put_community_risala_choose
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - discipline
              properties:
                discipline:
                  description: 'Le sport envoyé à la guilde. Doit figurer dans le `choosable` du tour.'
                  type: string
                  enum: [RUNNING, WALKING, CYCLING, SWIMMING, STRENGTH, HIIT, HIKING, MOBILITY, CLIMBING, FOOTBALL, COURT_SPORTS, RACKET_SPORTS]
              type: object
      responses:
        '200':
          description: "Le choix est enregistré, et l'écran complet est rendu — rien à recharger."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Risalat'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "Le tour appartient à quelqu'un d'autre (`risala-turn-is-not-yours`). **403 et non 404**,\ncontrairement au reste du module : le refus ne protège rien, puisque\n`GET /api/guilds/mine/risalat` a déjà dit à l'appelant à qui appartient le tour."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: "Pas de guilde (`guild-not-found`), ou aucun tour ouvert (`risala-turn-is-not-open`) —\nune guilde d'un seul membre n'en tire pas, et une guilde neuve attend la bascule."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: "Trois refus, un `type` chacun : l'échéance est passée (`risala-turn-is-closed`), la\ndiscipline ne rapporte pas d'XP (`discipline-does-not-credit`), ou une Risāla vivante la\nporte déjà (`discipline-already-challenged`). Le premier ne se réessaie pas ; les deux\nautres se corrigent en choisissant dans `choosable`."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/devices:
    post:
      tags:
        - Appareils
      operationId: post_identity_device_register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '200':
          description: "L'appareil est enregistré — ou son propriétaire mis à jour si le jeton appartenait à un autre compte."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/auth/login:
    post:
      tags:
        - Authentification
      operationId: post_identity_login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              type: object
      responses:
        '200':
          description: 'Identifiants acceptés.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: "Identifiants refusés (`invalid-credentials`). La réponse ne distingue pas une adresse inconnue d'un mot de passe faux, et le temps de réponse non plus (#39) — c'est aussi ce que reçoit un compte né d'un social sign-in, qui n'a pas de mot de passe."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security: []
  /api/auth/logout:
    post:
      tags:
        - Authentification
      summary: "Le jeton d'accès n'est pas requis : la preuve de possession du refresh token\nsuffit, et c'est justement quand le JWT vient d'expirer qu'on veut pouvoir\nse déconnecter proprement."
      operationId: post_identity_logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: "La famille entière est révoquée — c'est l'appareil qui se déconnecte, pas seulement ce jeton. Rien à rendre."
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security: []
  /api/me:
    get:
      tags:
        - Profil
      operationId: get_identity_me
      responses:
        '200':
          description: "Le profil, titre porté et titre visé compris : l'état du joueur en une requête à l'ouverture de l'app."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
        - Profil
      operationId: patch_identity_me_update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 'Le profil mis à jour. Les champs absents ne sont pas touchés.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/auth/refresh:
    post:
      tags:
        - Authentification
      operationId: post_identity_refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 'Une paire neuve. **Le jeton présenté est consommé** : il est à usage unique et rotatif.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: 'Jeton inconnu, expiré, **ou déjà consommé** (`invalid-refresh-token`). Un rejeu révoque toute la famille : on ne peut pas distinguer le voleur du vrai client qui a été doublé, donc on coupe.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security: []
  /api/auth/register:
    post:
      tags:
        - Authentification
      operationId: post_identity_register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: "Le compte est ouvert **et la session aussi** : forcer un login juste après ajouterait un aller-retour sur l'étape la plus fragile du tunnel."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '409':
          description: 'Adresse déjà prise (`email-already-used`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security: []
  '/api/auth/social/{provider}':
    post:
      tags:
        - Authentification
      operationId: post_identity_social_sign_in
      parameters:
        -
          name: provider
          in: path
          required: true
          schema:
            type: string
            pattern: google|apple
            enum:
              - google
              - apple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialSignInRequest'
      responses:
        '200':
          description: "Compte rattaché ou créé. Un compte né ici n'a pas de mot de passe et ne peut pas passer par `/api/auth/login`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: 'Le fournisseur a refusé le code (`social-sign-in-rejected`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: "L'adresse appartient à un compte existant que le fournisseur ne certifie pas (`email-belongs-to-another-account`) — sans certification, rattacher serait une prise de contrôle en une requête. Ou profil incomplet (`social-profile-incomplete`)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security: []
  /api/progression:
    get:
      tags:
        - Progression
      operationId: get_progression_state
      responses:
        '200':
          description: "L'état du joueur, servi du seul snapshot — aucune relecture du ledger."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progression'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/progression/history:
    get:
      tags:
        - Progression
      summary: "L'argument `#[MapQueryString]` n'est ni nullable ni pourvu d'un défaut, et c'est\nvoulu : le résolveur ne construit le DTO sur une query string vide que dans ce\ncas-là. Nullable, il faudrait un `?? new XpHistoryQuery()` à la main."
      operationId: get_progression_history
      parameters:
        -
          name: cursor
          in: query
          required: false
          schema:
            type: string
            nullable: true
            default: null
        -
          name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 50
            minimum: 1
      responses:
        '200':
          description: "Une page du ledger, la plus récente d'abord. C'est la vérité dont le niveau est une projection."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XpHistoryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/titles:
    get:
      tags:
        - Progression
      operationId: get_progression_titles
      responses:
        '200':
          description: 'Le catalogue entier, situé pour ce joueur.'
          content:
            application/json:
