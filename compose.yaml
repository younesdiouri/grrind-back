services:
  php:
    build:
      context: .
      target: dev
    environment:
      APP_ENV: dev
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      SERVER_NAME: ':80'
      # FrankenPHP sert en HTTP nu en local : le TLS est du ressort de l'ingress.
      DATABASE_URL: 'postgresql://grrind:grrind@database:5432/grrind?serverVersion=17&charset=utf8'
    volumes:
      - .:/app
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - '${HTTP_PORT:-8080}:80'
    depends_on:
      database:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Le consommateur de l'outbox. Même image que `php` : c'est le même code, dans un autre
  # rôle. `--time-limit` plutôt qu'un processus éternel — un worker PHP finit toujours par
  # garder de la mémoire, et se faire relancer toutes les heures coûte moins cher que de
  # chercher pourquoi. La stack le redémarre, y compris tant que `messenger_messages`
  # n'existe pas : sur une installation neuve il boucle jusqu'au `make migrate`.
  worker:
    build:
      context: .
      target: dev
    command: ['php', 'bin/console', 'messenger:consume', 'outbox', '--time-limit=3600', '-v']
    environment:
      APP_ENV: dev
      DATABASE_URL: 'postgresql://grrind:grrind@database:5432/grrind?serverVersion=17&charset=utf8'
    volumes:
      - .:/app
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  # L'image de prod, uniquement pour y jouer les migrations du déploiement.
  #
  # `profiles` la tient hors de `make up` : elle ne fait pas partie de la stack de
  # travail, c'est une tâche ponctuelle qu'on invoque par `make migrate-prod`. C'est
  # l'équivalent local de la tâche ECS one-off qui devra tourner **avant** que les
  # nouvelles tâches prennent du trafic.
  #
  # Elle ne connaît que `DATABASE_URL` — ni clés JWT, ni secrets OAuth. Migrer ne
  # demande rien d'autre, et une étape de déploiement qui exige tous les secrets de
  # l'application est une étape qui échouera pour une mauvaise raison.
  php-prod:
    build:
      context: .
      target: prod
    profiles: ['deploy']
    environment:
      APP_ENV: prod
      APP_DEBUG: '0'
      # Surchargeable depuis l'environnement : en prod, l'URL vient du gestionnaire
      # de secrets et pointe sur RDS.
      DATABASE_URL: '${DATABASE_URL:-postgresql://grrind:grrind@database:5432/grrind?serverVersion=17&charset=utf8}'
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: grrind
      POSTGRES_USER: grrind
      POSTGRES_PASSWORD: grrind
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grrind -d grrind']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  caddy_data:
  caddy_config:
