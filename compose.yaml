services:
  php:
    build:
      context: .
      target: dev
    environment:
      APP_ENV: dev
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      SERVER_NAME: ':80'
      # FrankenPHP sert en HTTP nu en local : le TLS est du ressort de l'ingress.
      DATABASE_URL: 'postgresql://grrind:grrind@database:5432/grrind?serverVersion=17&charset=utf8'
    volumes:
      - .:/app
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - '${HTTP_PORT:-8080}:80'
    depends_on:
      database:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Le consommateur de l'outbox. Même image que `php` : c'est le même code, dans un autre
  # rôle. La stack le redémarre, y compris tant que `messenger_messages` n'existe pas :
  # sur une installation neuve il boucle jusqu'au `make migrate`.
  worker:
    build:
      context: .
      target: dev
    # `--memory-limit` d'abord : c'est la vraie raison de recycler le processus, un
    # worker PHP finissant toujours par garder de la mémoire. `--time-limit` reste en
    # filet, mais l'horloge n'est pas ce qui devrait décider — sur ECS, un processus qui
    # sort en boucle fait tourner le compteur de redémarrages du service.
    command:
      - php
      - bin/console
      - messenger:consume
      - outbox
      - --memory-limit=128M
      - --time-limit=3600
      - -v
    environment:
      APP_ENV: dev
      DATABASE_URL: 'postgresql://grrind:grrind@database:5432/grrind?serverVersion=17&charset=utf8'
    volumes:
      - .:/app
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    # L'image FrankenPHP embarque une sonde HTTP. Le worker n'écoute sur aucun port :
    # elle échouait donc indéfiniment, le conteneur restait `unhealthy` alors qu'il
    # consommait très bien, et le `--wait` de `make up` sortait en erreur.
    #
    # On la désactive plutôt que d'en inventer une fausse : la santé d'un worker se
    # mesure à la profondeur de sa file, pas à un port ouvert. Cette sonde-là est
    # ticketée avec les métriques (#57).
    healthcheck:
      disable: true

  # L'image de prod, uniquement pour y jouer les migrations du déploiement.
  #
  # `profiles` la tient hors de `make up` : elle ne fait pas partie de la stack de
  # travail, c'est une tâche ponctuelle qu'on invoque par `make migrate-prod`. C'est
  # l'équivalent local de la tâche ECS one-off qui devra tourner **avant** que les
  # nouvelles tâches prennent du trafic.
  #
  # Elle ne connaît que `DATABASE_URL` — ni clés JWT, ni secrets OAuth. Migrer ne
  # demande rien d'autre, et une étape de déploiement qui exige tous les secrets de
  # l'application est une étape qui échouera pour une mauvaise raison.
  php-prod:
    build:
      context: .
      target: prod
    profiles: ['deploy']
    environment:
      APP_ENV: prod
      APP_DEBUG: '0'
      # Surchargeable depuis l'environnement : en prod, l'URL vient du gestionnaire
      # de secrets et pointe sur RDS.
      DATABASE_URL: '${DATABASE_URL:-postgresql://grrind:grrind@database:5432/grrind?serverVersion=17&charset=utf8}'
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: grrind
      POSTGRES_USER: grrind
      POSTGRES_PASSWORD: grrind
    volumes:
      - db_data:/var/lib/postgresql/data
    # PostgreSQL reste privé au réseau Compose. Le publier sur l'hôte n'est pas utile :
    # PHP, le worker et les commandes Make l'atteignent tous via `database:5432`.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grrind -d grrind']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  caddy_data:
  caddy_config:
