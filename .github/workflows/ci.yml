name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Qualité et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image dev
        run: docker compose build

      # Le target dev ne fige pas les dépendances dans l'image : le code arrive
      # par bind mount, donc vendor/ doit être installé ici comme en local.
      - name: Dépendances
        run: make composer c="install --no-interaction --no-progress"

      # Aucun secret n'est versionné : la CI génère les siens, jetables, à chaque run.
      - name: Secrets éphémères
        run: make secrets

      - name: Clés JWT
        run: make jwt-keys

      # Les barrières tournent dans la même image que le poste de dev :
      # pas de divergence possible entre "ça passe chez moi" et la CI.
      - name: Analyse statique
        run: make phpstan

      - name: Style
        run: make cs

      - name: Frontières entre modules
        run: make deptrac

      - name: Tests
        run: make test

      # Le contrat client est un fichier versionné : le dépôt front en génère son client
      # TypeScript. Un openapi.yaml en retard d'une route, c'est une intégration qui casse
      # côté front pour une raison qui vient d'ici.
      #
      # Régénérer puis comparer, plutôt que faire confiance : personne ne pense à lancer
      # `make openapi` en ajoutant une route, et c'est précisément ce qu'il faut attraper.
      - name: Contrat d'API à jour
        run: |
          make openapi
          git diff --exit-code --stat openapi.yaml \
            || { echo "::error::openapi.yaml a dérivé. Lance 'make openapi' et committe le résultat."; exit 1; }

      - name: Arrêt de la stack
        if: always()
        run: make down
