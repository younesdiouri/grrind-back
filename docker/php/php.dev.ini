; Réglages dev — priorité au feedback rapide, pas à la perf.
memory_limit = 512M
max_execution_time = 60

display_errors = On
error_reporting = E_ALL

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

date.timezone = UTC

; Xdebug piloté par la variable d'env XDEBUG_MODE (off par défaut, cf. compose.yaml).
xdebug.client_host = host.docker.internal
xdebug.start_with_request = yes
