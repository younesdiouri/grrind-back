# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# L'équilibrage du jeu est du config-as-code, sous `config/game/v1/`. Il n'est pas importé
# ici : ce n'est pas de la configuration Symfony mais de la donnée, lue et validée à la
# compilation par App\Shared\Infrastructure\Config\GameBalancePass, qui en tire les
# paramètres `game.*` utilisés plus bas et le `rulesetVersion` du dossier.

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            bool $debug: '%kernel.debug%'
            # Même source que lexik_jwt_authentication.token_ttl : la durée annoncée
            # au client ne peut pas diverger de celle réellement signée.
            int $accessTokenTtl: '%env(int:JWT_TTL)%'
            # Le hash de l'équilibrage chargé. Il se stocke avec chaque transaction d'XP :
            # c'est ce qui permet de rééquilibrer sans corrompre l'historique.
            string $rulesetVersion: '%game.ruleset_version%'

    App\:
        resource: '../src/'

    App\Identity\Application\SocialProfileResolver: '@App\Identity\Infrastructure\OAuth\LeagueSocialProfileResolver'

    # Sonde du #155 : `event.bus` n'est référencé nulle part par son id de service —
    # seulement par le type `MessageBusInterface` avec `#[Target]` — donc le compilateur
    # l'inlinerait sans cet alias public, et un test qui voudrait y dispatcher
    # directement ne pourrait pas le récupérer. `command.bus` n'a pas besoin de son
    # pendant : c'est le `default_bus`, déjà exposé publiquement par le framework sous
    # `messenger.default_bus`. Déclaré ici plutôt que sous `when@test` : le service
    # `event.bus` existe dans tous les environnements, et PHPStan résout les services
    # contre le conteneur `dev` (`phpstan.dist.neon`) — un alias test-conditionnel n'y
    # serait pas trouvé.
    messenger.test.event_bus:
        alias: event.bus
        public: true

    # L'objet typé que le domaine consomme, construit depuis les paramètres tirés de
    # `game/v1/training.yaml`. Un paramètre absent casse la compilation du conteneur en
    # nommant ce service : l'équilibrage se valide au démarrage, pas à la première
    # requête d'un joueur.
    App\Training\Domain\WorkoutRules:
        arguments:
            $minimumDurationSeconds: '%game.training.minimum_duration_seconds%'
            $maximumDurationSeconds: '%game.training.maximum_duration_seconds%'
            $importWindowDays: '%game.training.import_window_days%'

    # La traduction des types de séance des fournisseurs santé, une liste par source. Ajouter
    # un sport ou corriger une correspondance se fait dans le YAML, sans publier sur l'App
    # Store et sans revenir ici.
    App\Shared\Domain\Activity\ActivityTypeMap:
        arguments:
            $appleHealth: '%game.activity_types.apple_health%'
            $healthConnect: '%game.activity_types.health_connect%'

    # Le barème de base. `disciplines` est une liste dans le YAML, donc le chargeur n'y
    # descend pas et le paramètre reste unique : ouvrir une discipline, ou lui donner un
    # bonus de distance, se fait dans le YAML sans revenir ici. Le socle, lui, est un
    # scalaire et se câble explicitement — il ne dépend plus de la discipline (#90).
    App\Progression\Domain\XpRates:
        arguments:
            $baseXpPerHour: '%game.xp.base_xp_per_hour%'
            $disciplines: '%game.xp.disciplines%'

    # La taille d'une guilde, tirée de `game/v1/community.yaml`. Même raison que
    # `WorkoutRules` : le domaine reçoit un objet validé, pas un entier venu d'un YAML.
    App\Community\Domain\GuildRules:
        arguments:
            $maximumMembers: '%game.community.maximum_members%'
            $inviteCodeLifetimeHours: '%game.community.invite_code_lifetime_hours%'

    # Le calendrier des Risālāt (#191), tiré du même fichier que la taille des guildes.
    # `week_timezone` est le fuseau de la *semaine de jeu*, pas celui d'un joueur — voir le
    # docblock de `RisalaRules` pour pourquoi c'est la seule date du projet qui échappe au
    # fuseau de celui qu'elle concerne.
    App\Community\Domain\RisalaRules:
        arguments:
            $activeWeeks: '%game.community.risala.active_weeks%'
            $revealWeekday: '%game.community.risala.reveal_day%'
            $revealHour: '%game.community.risala.reveal_hour%'
            $weekTimezone: '%game.community.risala.week_timezone%'
            $recipientBonusPercent: '%game.community.risala.recipient_bonus_percent%'
            $senderBonusPercent: '%game.community.risala.sender_bonus_percent%'

    # Les disciplines qui créditent, lues une seule fois depuis la **même** liste brute que
    # `XpRates` et `AttributeSplit` consomment (#191). `Community` en a besoin pour refuser
    # une Risāla sur une discipline qui ne rapporte rien, et Deptrac lui interdit de lire
    # quoi que ce soit de `Progression` — d'où l'objet, dans `Shared`.
    App\Shared\Domain\Activity\CreditingDisciplines:
        arguments:
            $disciplines: '%game.xp.disciplines%'

    # Les heures calmes d'un destinataire (#133), tirées de `game/v1/notifications.yaml`.
    App\Community\Domain\QuietHours:
        arguments:
            $startHour: '%game.notifications.quiet_hours_start_hour%'
            $endHour: '%game.notifications.quiet_hours_end_hour%'

    # La fraîcheur d'une séance créditée : au-delà, c'est de l'historique, pas une raison
    # de réveiller la guilde. Le délai, lui, n'est pas de l'équilibrage au sens des autres
    # réglages — voir le docblock d'`AnnounceGuildActivity` pour ce qu'il garantit
    # réellement.
    App\Community\Application\GuildActivityNotifier:
        arguments:
            $freshnessWindowMinutes: '%game.notifications.freshness_window_minutes%'
            $announcementDelaySeconds: '%game.notifications.announcement_delay_seconds%'

    # Le seuil d'abandon d'une fenêtre (#134), tiré du même fichier — voir le docblock de
    # `PendingGuildActivityRepository::recordSession()` pour ce qu'il déclenche.
    App\Community\Infrastructure\Doctrine\PendingGuildActivityRepository:
        arguments:
            $staleWindowMinutes: '%game.notifications.stale_window_minutes%'

    App\Progression\Domain\LevelCurve:
        arguments:
            $levels: '%game.levels.levels%'

    # Le catalogue des titres, d'un bloc pour la même raison que le barème : c'est une
    # liste, et son ordre — qui départage les ex æquo au moment de désigner le prochain
    # titre — doit survivre au conteneur compilé.
    App\Progression\Domain\TitleCatalog:
        arguments:
            $titles: '%game.titles.titles%'

    # Les socles d'un combattant (#208), tirés de `game/v1/combat.yaml`. Même raison que
    # `WorkoutRules` : le domaine reçoit un objet validé, pas dix entiers venus tel quels
    # du YAML. La dérivation caractéristique → combattant elle-même arrive au #210.
    App\Combat\Domain\CombatRules:
        arguments:
            $baseHp: '%game.combat.fighter.base_hp%'
            $hpPer1000Vitality: '%game.combat.fighter.hp_per_1000_vitality%'
            $baseDamage: '%game.combat.fighter.base_damage%'
            $damagePer1000Strength: '%game.combat.fighter.damage_per_1000_strength%'
            $mitigationPermillePer1000Endurance: '%game.combat.fighter.mitigation_permille_per_1000_endurance%'
            $mitigationCapPermille: '%game.combat.fighter.mitigation_cap_permille%'
            $extraTurnPermillePer1000Dexterity: '%game.combat.fighter.extra_turn_permille_per_1000_dexterity%'
            $extraTurnCapPermille: '%game.combat.fighter.extra_turn_cap_permille%'
            $dodgePermillePer1000Mobility: '%game.combat.fighter.dodge_permille_per_1000_mobility%'
            $dodgeCapPermille: '%game.combat.fighter.dodge_cap_permille%'
            $minimumDamage: '%game.combat.fighter.minimum_damage%'
            $maxTurns: '%game.combat.fighter.max_turns%'

    # Le catalogue d'ennemis (#208), d'un bloc pour la même raison que le barème de titres :
    # c'est une liste, et son ordre de déclaration doit survivre au conteneur compilé.
    App\Combat\Domain\EnemyCatalog:
        arguments:
            $enemies: '%game.combat.enemies%'

    App\Progression\Domain\DiminishingReturns:
        arguments:
            $brackets: '%game.xp.diminishing_returns%'
            $beyondWeightPercent: '%game.xp.diminishing_returns_beyond_percent%'

    # La table de répartition de l'XP entre les quatre caractéristiques (#158), tirée de
    # `game/v1/attributes.yaml`. Une liste, comme `disciplines` de `XpRates` juste
    # au-dessus : ouvrir une discipline ou corriger un pourcentage se fait dans le YAML,
    # sans revenir ici.
    #
    # `$disciplines` est la **même** liste que celle de `XpRates` juste au-dessus (#167) :
    # c'est elle qui dit quelles disciplines créditent, donc quelles disciplines doivent
    # avoir une ligne ici. Les deux tables ne peuvent pas diverger sur « qui crédite »
    # sans qu'un seul fichier — `xp.yaml` — bouge.
    App\Shared\Domain\Activity\AttributeSplit:
        arguments:
            $splits: '%game.attributes.splits%'
            $disciplines: '%game.xp.disciplines%'

    # Vitality (#161), dérivée des quatre caractéristiques ci-dessus — même fichier, même
    # geste : le domaine reçoit un objet validé, pas un entier venu tel quel du YAML.
    # `$targetActiveKcal` et `$bonusCapPermille` sont le bonus quotidien du #165 ; voir le
    # docblock de la classe pour pourquoi ils voyagent avec le plancher plutôt qu'à part.
    App\Shared\Domain\Activity\Vitality:
        arguments:
            $floorPermille: '%game.attributes.vitality.floor_permille%'
            $targetActiveKcal: '%game.attributes.vitality.target_active_kcal%'
            $bonusCapPermille: '%game.attributes.vitality.bonus_cap_permille%'

    # Le #165 : la largeur de la fenêtre glissante du bonus de Vitality, seul réglage que
    # `Vitality` elle-même n'a pas à connaître — voir le docblock d'`AttributeSplitSection`.
    App\Progression\Application\VitalityBonusProvider:
        arguments:
            $windowDays: '%game.attributes.vitality.window_days%'

    # Le pendant du #165, dans l'autre sens : `Training` possède `daily_activity`,
    # `Progression` ne connaît que l'interface — voir le docblock du port.
    App\Shared\Application\ActiveEnergyWindows: '@App\Training\Infrastructure\Doctrine\DailyActivityRepository'

    # Le fuseau du joueur traverse la frontière des modules par ce seul point : `Identity`
    # implémente le port, `Progression` et `Engagement` ne connaissent que l'interface.
    App\Shared\Application\PlayerTimezones: '@App\Identity\Infrastructure\Doctrine\UserRepository'

    # Le pendant exact, dans l'autre sens : `Progression` possède les titres, `Identity` les
    # affiche dans le profil sans jamais connaître ni le catalogue ni la table.
    App\Shared\Application\PlayerTitles: '@App\Progression\Infrastructure\Translation\TranslatedPlayerTitles'

    # Les deux ports **batch** du #117 : la liste des membres d'une guilde demande N joueurs
    # d'un coup, et un port qui en rendrait un à la fois deviendrait un N+1 au premier écran.
    # `Community` les consomme, `Identity` et `Progression` les implémentent, et aucune
    # flèche ne va de l'un à l'autre.
    App\Shared\Application\PlayerProfiles: '@App\Identity\Infrastructure\Doctrine\AccountPlayerProfiles'
    App\Shared\Application\PlayerProgressions: '@App\Progression\Infrastructure\Translation\TranslatedPlayerProgressions'

    # Le troisième et dernier port : `Training` clôt la séance, `Progression` la crédite, et
    # aucun des deux ne nomme l'autre. C'est ce câblage-là qui fait la transaction de
    # complétion — sans lui, une séance se fermerait sans rapporter un point.
    App\Shared\Application\SessionRewards: '@App\Progression\Infrastructure\Reward\LedgerSessionRewards'

    # Le registre des appareils (#149) : `$targetEnvironment` vient du réglage
    # `PUSH_TARGET_ENVIRONMENT` (voir `.env`), résolu par le processeur `enum:` de
    # Symfony — jamais de `%kernel.environment%`, qui décrit le serveur et non le canal
    # APNs visé. Voir le docblock de `DeviceEnvironment` pour pourquoi les deux axes ne
    # se confondent pas.
    App\Identity\Infrastructure\Doctrine\UserDeviceRepository:
        arguments:
            $targetEnvironment: '%env(enum:App\Identity\Domain\DeviceEnvironment:PUSH_TARGET_ENVIRONMENT)%'

    # Le port posé au #129 en préalable du jalon Notifications : `Community` notifiera un
    # joueur sans jamais importer une entité `Identity`, comme les précédents.
    App\Shared\Application\PushTargets: '@App\Identity\Infrastructure\Doctrine\UserDeviceRepository'

    # Le #131 : même repository, même frontière, un contrat séparé parce que lire les
    # jetons et effacer un jeton mort ne sont pas la même intention — voir le docblock du
    # port.
    App\Shared\Application\DeadPushTokens: '@App\Identity\Infrastructure\Doctrine\UserDeviceRepository'

    # Le bridge Expo posé au #130 : contrairement aux autres ports, l'implémentation vit
    # dans `Shared` lui-même — traduire vers Expo n'appartient à aucun module métier, et
    # `ExpoPushSender` ne fait que consommer le port `PushTargets` juste au-dessus.
    #
    # Le #150 : `$transport` vise `texter.transports` (le service `Transports` du
    # framework), jamais `TexterInterface`/`texter` — voir le docblock de la classe pour
    # pourquoi `Texter::send()` rend toujours `null` dès qu'un bus Messenger lui est
    # injecté, ce que `FrameworkExtension` fait automatiquement. `Transports` est `final`,
    # donc `'@texter'` (un `Texter`, pas un `Transports`) n'est plus câblable ici — le
    # conteneur refuserait de compiler plutôt que de rejouer la panne en silence.
    # L'autowiring seul ne suffirait pas non plus : `chatter.transports` partage la même
    # classe `Transports`, donc deux candidats existent pour ce type, d'où l'argument
    # explicite.
    App\Shared\Infrastructure\Notifier\ExpoPushSender:
        arguments:
            $transport: '@texter.transports'

    # Le #131 le décore plutôt que d'y ajouter des dépendances : voir le docblock de
    # `ReceiptSchedulingPushSender`. `$sender` est câblé explicitement vers la classe
    # concrète — l'autowiring par l'interface `PushSender` bouclerait sur cet alias-ci.
    App\Shared\Infrastructure\Notifier\ReceiptSchedulingPushSender:
        arguments:
            $sender: '@App\Shared\Infrastructure\Notifier\ExpoPushSender'

    App\Shared\Application\PushSender: '@App\Shared\Infrastructure\Notifier\ReceiptSchedulingPushSender'

    # Le #131 : le même jeton que `ExpoTransport` envoie pour l'envoi (`Authorization:
    # Bearer …`), extrait du même DSN — voir le docblock du handler pour pourquoi un
    # second réglage aurait pu diverger du premier.
    App\Shared\Infrastructure\Notifier\CheckExpoPushReceiptsHandler:
        arguments:
            $expoDsn: '%env(EXPO_DSN)%'

    # Providers league/oauth2-client câblés directement : KnpUOAuth2ClientBundle a été
    # écarté (décision Lot 1bis). Ils sont derrière un service locator dans le résolveur,
    # donc construits à la demande — le constructeur d'Apple refuse une configuration
    # vide, et un poste sans clé Apple doit pouvoir servir Google.
    oauth2.provider.google:
        class: League\OAuth2\Client\Provider\Google
        arguments:
            $options:
                clientId: '%env(GOOGLE_CLIENT_ID)%'
                clientSecret: '%env(GOOGLE_CLIENT_SECRET)%'
                redirectUri: '%env(GOOGLE_REDIRECT_URI)%'

    oauth2.provider.apple:
        class: League\OAuth2\Client\Provider\Apple
        arguments:
            $options:
                clientId: '%env(APPLE_CLIENT_ID)%'
                teamId: '%env(APPLE_TEAM_ID)%'
                keyFileId: '%env(APPLE_KEY_FILE_ID)%'
                keyFilePath: '%env(resolve:APPLE_KEY_FILE_PATH)%'
                redirectUri: '%env(APPLE_REDIRECT_URI)%'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        # Aucune suite de tests ne peut appeler Google ni Apple.
        App\Tests\Support\StubSocialProfileResolver: ~
        App\Identity\Application\SocialProfileResolver: '@App\Tests\Support\StubSocialProfileResolver'

        # Le seul contributeur de modificateurs tant qu'aucun module n'en accorde. Rien ne
        # le câble au resolver : l'autoconfiguration le tague parce qu'il implémente
        # `ModifierContributor`, et c'est précisément ce qu'il sert à démontrer.
        App\Tests\Support\ProgrammableModifiers: ~

        # Publics pour que les tests les appellent sans passer par HTTP : la charge du jour
        # et le crédit se démontrent contre la vraie base, indépendamment de la route qui
        # les déclenche.
        App\Progression\Application\DailyLoadProvider:
            public: true

        App\Progression\Application\GrantXpHandler:
            public: true

        # Public pour que le test de câblage l'appelle sans détour : sans autre
        # consommateur que l'alias lui-même, le compilateur l'inlinerait sinon et
        # `self::getContainer()->get(PushSender::class)` échouerait — même besoin que
        # `DailyLoadProvider` et `GrantXpHandler` juste au-dessus. Pointe vers le même
        # service qu'en production (#131) : `PushSenderWiringTest` prouve la chaîne
        # réellement câblée, décorateur compris, pas un raccourci propre aux tests.
        App\Shared\Application\PushSender:
            alias: App\Shared\Infrastructure\Notifier\ReceiptSchedulingPushSender
            public: true

        # Route protégée qui sert de sonde à l'idempotence.
        App\Tests\Support\Http\:
            resource: '../tests/Support/Http/'

        # N'écrase pas l'alias global `PushSender` — voir son docblock — seulement ce
        # que consomme `AnnounceGuildActivityHandler` (#133), pour observer ses envois
        # sans dépendre des logs du transport Expo nul.
        App\Tests\Support\SpyingPushSender: ~
        # Public pour que les tests l'appellent directement plutôt que d'attendre le
        # `DelayStamp` posé par `GuildActivityNotifier` — même besoin que
        # `DailyLoadProvider` et `GrantXpHandler` plus haut, et c'est aussi ce qui permet
        # de démontrer le mode dégradé documenté dans `AnnounceGuildActivity` : appeler ce
        # handler *entre* deux séances créditées du même auteur simule un délai déjà
        # écoulé, sans qu'un test attende une vraie minute.
        App\Community\Application\AnnounceGuildActivityHandler:
            public: true
            arguments:
                $pushSender: '@App\Tests\Support\SpyingPushSender'

        # Publics pour que le test d'idempotence du #134 lise le `windowId` d'une fenêtre
        # ouverte et pose une réservation d'envoi avant d'appeler le handler — simuler une
        # panne au milieu de la boucle d'envoi sans en provoquer une vraie.
        App\Community\Infrastructure\Doctrine\PendingGuildActivityRepository:
            public: true
            arguments:
                $staleWindowMinutes: '%game.notifications.stale_window_minutes%'

        App\Shared\Infrastructure\Doctrine\NotificationAttemptRepository:
            public: true

        # Le #131 : aucune suite de tests ne peut appeler Expo pour les reçus non plus —
        # même exigence que `notifier.yaml` pour l'envoi, appliquée ici par l'outil de test
        # que `symfony/http-client` fournit plutôt qu'un drapeau maison. Sans réponse
        # programmée, `MockHttpClient` rend une réponse vide qu'`ExceptionInterface` attrape
        # côté handler — silencieux par défaut, un test qui a besoin d'un vrai reçu appelle
        # `setResponseFactory()` sur le service ci-dessous plutôt que d'en écraser un autre.
        Symfony\Component\HttpClient\MockHttpClient: ~

        Symfony\Contracts\HttpClient\HttpClientInterface:
            alias: Symfony\Component\HttpClient\MockHttpClient
            public: true

        # Publics pour que le test du #131 pose un ticket en attente et invoque le handler
        # directement — même besoin que `AnnounceGuildActivityHandler` plus haut, sans
        # attendre le `DelayStamp` posé par `ExpoPushSender`.
        App\Shared\Infrastructure\Doctrine\PendingPushReceiptRepository:
            public: true

        # `$expoDsn` répété : la redéclaration d'un service déjà défini plus haut ne fusionne
        # pas ses arguments, elle les remplace — même geste que `PendingGuildActivityRepository`
        # juste au-dessus pour `$staleWindowMinutes`.
        App\Shared\Infrastructure\Notifier\CheckExpoPushReceiptsHandler:
            public: true
            arguments:
                $expoDsn: '%env(EXPO_DSN)%'

        # Le temps piloté (#191) : la bascule des Risālāt se démontre sur trois semaines, et
        # personne n'attendra trois semaines. `MockClock` vient du composant Clock — c'est
        # exactement ce pour quoi il existe, et il n'est injecté qu'au handler de la bascule :
        # le reste de l'application garde l'horloge réelle, donc rien d'autre ne se met à
        # vivre dans un futur inventé.
        Symfony\Component\Clock\MockClock:
            arguments: ['2026-08-30 20:00:00', 'Europe/Paris']
            public: true

        # Public pour que les tests appellent la bascule sans attendre le battement horaire
        # du planificateur — même besoin que `AnnounceGuildActivityHandler` plus haut.
        App\Community\Application\RevealRisalatHandler:
            public: true
            arguments:
                $clock: '@Symfony\Component\Clock\MockClock'

        App\Community\Infrastructure\Doctrine\RisalaRepository:
            public: true

        App\Community\Infrastructure\Doctrine\GuildRepository:
            public: true

        # Public pour que le #192 interroge le contributeur directement, sans passer par un
        # crédit : ce qu'il rend est une liste de modificateurs, et c'est elle qui se lit.
        App\Community\Application\RisalaModifiers:
            public: true

        # Les deux annonces des Risālāt (#194) : publiques pour que les tests les invoquent
        # sans drainer l'outbox, et branchées sur l'espion plutôt que sur le vrai
        # `PushSender` — même geste qu'`AnnounceGuildActivityHandler` plus haut, et pour la
        # même raison : l'alias global reste câblé vers `ExpoPushSender`, ce que
        # `PushSenderWiringTest` prouve.
        App\Community\Application\AnnounceRisalaHandler:
            public: true
            arguments:
                $pushSender: '@App\Tests\Support\SpyingPushSender'

        App\Community\Application\AnnounceRisalaTurnHandler:
            public: true
            arguments:
                $pushSender: '@App\Tests\Support\SpyingPushSender'

        # `$disciplines` répété : la redéclaration d'un service déjà défini plus haut ne
        # fusionne pas ses arguments, elle les remplace.
        App\Shared\Domain\Activity\CreditingDisciplines:
            public: true
            arguments:
                $disciplines: '%game.xp.disciplines%'

        # L'abonné qui prouve qu'un module tiers réagit à un workout importé sans être
        # nommé nulle part. Il n'est pas autoconfiguré par le `App\Tests\` du dessus — il
        # n'y en a pas — donc il se déclare ici, et son `#[AsMessageHandler]` fait le reste.
        App\Tests\Support\Messaging\:
            resource: '../tests/Support/Messaging/'

        # Publics pour que `FightBattleHandlerTest` (#211) appelle le pipeline de combat
        # directement, avec les mêmes collaborateurs — chargés depuis le vrai `combat.yaml`
        # — que ceux que le handler emploie. `FightController` (#212) les consomme
        # désormais aussi, mais par injection de constructeur : ça ne rend pas la
        # déclaration publique inutile, `container->get()` continue d'exiger `public: true`
        # — même besoin que `GrantXpHandler` plus haut.
        # `$rulesetVersion` répété : la redéclaration ci-dessous ne fusionne pas avec le
        # bind global de `_defaults` plus haut, elle le remplace — même geste que
        # `$expoDsn` sur `CheckExpoPushReceiptsHandler` plus haut.
        App\Combat\Application\FightBattleHandler:
            public: true
            arguments:
                $rulesetVersion: '%game.ruleset_version%'

        App\Combat\Application\FighterFactory:
            public: true

        # `$enemies` répété, pour la même raison que `$rulesetVersion` ci-dessus.
        App\Combat\Domain\EnemyCatalog:
            public: true
            arguments:
                $enemies: '%game.combat.enemies%'

        App\Combat\Domain\BattleSimulator:
            public: true

        App\Combat\Infrastructure\Doctrine\BattleRepository:
            public: true
