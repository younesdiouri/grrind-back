# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# L'équilibrage du jeu est du config-as-code. `v1` est figé — au Lot 3, tout le dossier
# sera hashé pour produire le `rulesetVersion` stocké avec chaque transaction d'XP.
imports:
    - { resource: game/v1/training.yaml }

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            bool $debug: '%kernel.debug%'
            # Même source que lexik_jwt_authentication.token_ttl : la durée annoncée
            # au client ne peut pas diverger de celle réellement signée.
            int $accessTokenTtl: '%env(int:JWT_TTL)%'

    App\:
        resource: '../src/'

    App\Identity\Application\SocialProfileResolver: '@App\Identity\Infrastructure\OAuth\LeagueSocialProfileResolver'

    # Un paramètre absent casse la compilation du conteneur : l'équilibrage se valide au
    # démarrage, pas à la première requête d'un joueur.
    App\Training\Domain\TrainingRules:
        arguments:
            $minimumDurationSeconds: '%game.training.minimum_duration_seconds%'
            $maximumDurationSeconds: '%game.training.maximum_duration_seconds%'
            $cooldownSeconds: '%game.training.cooldown_seconds%'

    # Providers league/oauth2-client câblés directement : KnpUOAuth2ClientBundle a été
    # écarté (décision Lot 1bis). Ils sont derrière un service locator dans le résolveur,
    # donc construits à la demande — le constructeur d'Apple refuse une configuration
    # vide, et un poste sans clé Apple doit pouvoir servir Google.
    oauth2.provider.google:
        class: League\OAuth2\Client\Provider\Google
        arguments:
            $options:
                clientId: '%env(GOOGLE_CLIENT_ID)%'
                clientSecret: '%env(GOOGLE_CLIENT_SECRET)%'
                redirectUri: '%env(GOOGLE_REDIRECT_URI)%'

    oauth2.provider.apple:
        class: League\OAuth2\Client\Provider\Apple
        arguments:
            $options:
                clientId: '%env(APPLE_CLIENT_ID)%'
                teamId: '%env(APPLE_TEAM_ID)%'
                keyFileId: '%env(APPLE_KEY_FILE_ID)%'
                keyFilePath: '%env(resolve:APPLE_KEY_FILE_PATH)%'
                redirectUri: '%env(APPLE_REDIRECT_URI)%'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        # Aucune suite de tests ne peut appeler Google ni Apple.
        App\Tests\Support\StubSocialProfileResolver: ~
        App\Identity\Application\SocialProfileResolver: '@App\Tests\Support\StubSocialProfileResolver'

        # Route protégée qui sert de sonde à l'idempotence.
        App\Tests\Support\Http\:
            resource: '../tests/Support/Http/'

        # Un abonné aux événements de domaine qui ne connaît pas leur émetteur : il
        # vérifie que la chaîne complète tient.
        App\Tests\Support\Messaging\:
            resource: '../tests/Support/Messaging/'
