# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# L'équilibrage du jeu est du config-as-code, sous `config/game/v1/`. Il n'est pas importé
# ici : ce n'est pas de la configuration Symfony mais de la donnée, lue et validée à la
# compilation par App\Shared\Infrastructure\Config\GameBalancePass, qui en tire les
# paramètres `game.*` utilisés plus bas et le `rulesetVersion` du dossier.

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            bool $debug: '%kernel.debug%'
            # Même source que lexik_jwt_authentication.token_ttl : la durée annoncée
            # au client ne peut pas diverger de celle réellement signée.
            int $accessTokenTtl: '%env(int:JWT_TTL)%'
            # Le hash de l'équilibrage chargé. Il se stocke avec chaque transaction d'XP :
            # c'est ce qui permet de rééquilibrer sans corrompre l'historique.
            string $rulesetVersion: '%game.ruleset_version%'

    App\:
        resource: '../src/'

    App\Identity\Application\SocialProfileResolver: '@App\Identity\Infrastructure\OAuth\LeagueSocialProfileResolver'

    # L'objet typé que le domaine consomme, construit depuis les paramètres tirés de
    # `game/v1/training.yaml`. Un paramètre absent casse la compilation du conteneur en
    # nommant ce service : l'équilibrage se valide au démarrage, pas à la première
    # requête d'un joueur.
    App\Training\Domain\WorkoutRules:
        arguments:
            $minimumDurationSeconds: '%game.training.minimum_duration_seconds%'
            $maximumDurationSeconds: '%game.training.maximum_duration_seconds%'

    # La traduction des types de séance des fournisseurs santé, une liste par source. Ajouter
    # un sport ou corriger une correspondance se fait dans le YAML, sans publier sur l'App
    # Store et sans revenir ici.
    App\Shared\Domain\Activity\ActivityTypeMap:
        arguments:
            $appleHealth: '%game.activity_types.apple_health%'
            $healthConnect: '%game.activity_types.health_connect%'

    # Le barème de base, d'un bloc : `disciplines` est une liste dans le YAML, donc le
    # chargeur n'y descend pas et le paramètre reste unique. Ouvrir une discipline se fait
    # dans le YAML, sans revenir ici.
    App\Progression\Domain\XpRates:
        arguments:
            $disciplines: '%game.xp.disciplines%'

    App\Progression\Domain\LevelCurve:
        arguments:
            $levels: '%game.levels.levels%'

    # Le catalogue des titres, d'un bloc pour la même raison que le barème : c'est une
    # liste, et son ordre — qui départage les ex æquo au moment de désigner le prochain
    # titre — doit survivre au conteneur compilé.
    App\Progression\Domain\TitleCatalog:
        arguments:
            $titles: '%game.titles.titles%'

    App\Progression\Domain\DiminishingReturns:
        arguments:
            $brackets: '%game.xp.diminishing_returns%'
            $beyondWeightPercent: '%game.xp.diminishing_returns_beyond_percent%'

    # Le fuseau du joueur traverse la frontière des modules par ce seul point : `Identity`
    # implémente le port, `Progression` et `Engagement` ne connaissent que l'interface.
    App\Shared\Application\PlayerTimezones: '@App\Identity\Infrastructure\Doctrine\UserRepository'

    # Le pendant exact, dans l'autre sens : `Progression` possède les titres, `Identity` les
    # affiche dans le profil sans jamais connaître ni le catalogue ni la table.
    App\Shared\Application\PlayerTitles: '@App\Progression\Infrastructure\Translation\TranslatedPlayerTitles'

    # Le troisième et dernier port : `Training` clôt la séance, `Progression` la crédite, et
    # aucun des deux ne nomme l'autre. C'est ce câblage-là qui fait la transaction de
    # complétion — sans lui, une séance se fermerait sans rapporter un point.
    App\Shared\Application\SessionRewards: '@App\Progression\Infrastructure\Reward\LedgerSessionRewards'

    # Providers league/oauth2-client câblés directement : KnpUOAuth2ClientBundle a été
    # écarté (décision Lot 1bis). Ils sont derrière un service locator dans le résolveur,
    # donc construits à la demande — le constructeur d'Apple refuse une configuration
    # vide, et un poste sans clé Apple doit pouvoir servir Google.
    oauth2.provider.google:
        class: League\OAuth2\Client\Provider\Google
        arguments:
            $options:
                clientId: '%env(GOOGLE_CLIENT_ID)%'
                clientSecret: '%env(GOOGLE_CLIENT_SECRET)%'
                redirectUri: '%env(GOOGLE_REDIRECT_URI)%'

    oauth2.provider.apple:
        class: League\OAuth2\Client\Provider\Apple
        arguments:
            $options:
                clientId: '%env(APPLE_CLIENT_ID)%'
                teamId: '%env(APPLE_TEAM_ID)%'
                keyFileId: '%env(APPLE_KEY_FILE_ID)%'
                keyFilePath: '%env(resolve:APPLE_KEY_FILE_PATH)%'
                redirectUri: '%env(APPLE_REDIRECT_URI)%'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        # Aucune suite de tests ne peut appeler Google ni Apple.
        App\Tests\Support\StubSocialProfileResolver: ~
        App\Identity\Application\SocialProfileResolver: '@App\Tests\Support\StubSocialProfileResolver'

        # Le seul contributeur de modificateurs tant qu'aucun module n'en accorde. Rien ne
        # le câble au resolver : l'autoconfiguration le tague parce qu'il implémente
        # `ModifierContributor`, et c'est précisément ce qu'il sert à démontrer.
        App\Tests\Support\ProgrammableModifiers: ~

        # Publics pour que les tests les appellent sans passer par HTTP : la charge du jour
        # et le crédit se démontrent contre la vraie base, indépendamment de la route qui
        # les déclenche.
        App\Progression\Application\DailyLoadProvider:
            public: true

        App\Progression\Application\GrantXpHandler:
            public: true

        # Route protégée qui sert de sonde à l'idempotence.
        App\Tests\Support\Http\:
            resource: '../tests/Support/Http/'

        # L'abonné qui prouve qu'un module tiers réagit à un workout importé sans être
        # nommé nulle part. Il n'est pas autoconfiguré par le `App\Tests\` du dessus — il
        # n'y en a pas — donc il se déclare ici, et son `#[AsMessageHandler]` fait le reste.
        App\Tests\Support\Messaging\:
            resource: '../tests/Support/Messaging/'
