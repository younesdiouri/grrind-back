# Ce qu'une guilde peut contenir. De l'équilibrage, pas du code : la bonne taille d'un
# groupe est une question de produit, et elle bougera après les premiers joueurs.
#
# Ce fichier est de la donnée, pas de la configuration Symfony : il est lu et validé à la
# compilation du conteneur par App\Community\Infrastructure\Config\CommunitySection, et il
# entre dans le `rulesetVersion`. Une clé inconnue fait échouer le démarrage.

# ————— La capacité d'une guilde ————————————————————————————————————————————————————————
#
# Trente, parce que la guilde de la v1 sert à *voir qui est là* (#117) et pas à animer une
# foule : au-delà, la liste des membres cesse d'être un écran qu'on parcourt et devient un
# annuaire qu'on filtre — un autre produit, avec sa recherche et sa pagination.
#
# C'est aussi ce qui donne son sens au verrou pris sur la ligne de la guilde au moment de
# rejoindre (#116) : une limite qu'on n'atteint jamais est une limite qu'on ne teste jamais.
maximum_members: 30
