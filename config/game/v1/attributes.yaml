# Où va l'XP d'une séance, une fois calculé. `XpCalculator` rend un montant ; cette table
# le répartit entre les quatre caractéristiques du personnage — Strength, Endurance,
# Mobility, Dexterity — selon la discipline pratiquée. La quantité vient de l'effort ; la
# destination vient du sport.
#
# ————— Ce que cette table dit ——————————————————————————————————————————————————————————
#
# Un pourcentage par couple (discipline, caractéristique), qui doit sommer à exactement
# 100 sur chaque ligne — validé au démarrage par `AttributeSplit`, qui refuse aussi une
# discipline absente ou en double. `Vitality`, la cinquième caractéristique du game
# design, n'apparaît pas ici : elle est dérivée des quatre autres et ne reçoit jamais d'XP
# directement.
#
# La répartition se pose sur le total final d'`XpCalculator`, pas sur le socle : les
# garde-fous — rendements décroissants, plafond quotidien — restent inchangés, calculés
# avant cette table et sans jamais la consulter.
#
# ————— Ce que cette table ne prétend pas dire ———————————————————————————————————————————
#
# Ces valeurs sont reprises du document de game design tel quel, avec deux écarts
# assumés et confirmés en revue — de l'équilibrage, qui se patche ici sans migration :
#
#   - `STRENGTH` : le document écrit 75/15/5/0, qui somme à 95 — une coquille, seule
#     ligne dans ce cas. Le point manquant va en Dexterity.
#   - `HIIT` n'a pas de ligne au document. Il reprend la famille « Fitness / gymnastique ».
#   - `CLIMBING` reprend l'exemple d'escalade donné au fil du texte du document.
#
# Aucune formule ne relie une ligne à la charge réelle du sport : ce n'est pas mesuré,
# c'est choisi. Le jour où un Effort Score par famille de sport existera, il changera peut-
# être `base_xp_per_hour` d'`xp.yaml` ; il ne changera pas cette table, qui répond à une
# question différente — pas combien, mais vers où.
#
# ————— `WALKING` n'a pas de ligne, et ne doit pas en avoir (#167) ——————————————————————
#
# La marche ne crédite plus d'XP — voir `xp.yaml`, `credits_xp: false` — donc il n'y a
# rien à répartir pour elle : `XpCalculator` ne l'atteint jamais, `AttributeSplit` ne
# l'exige plus. Une ligne gardée « au cas où » serait de la config morte qui pourrit sans
# que personne s'en aperçoive ; `AttributeSplit` la refuserait d'ailleurs, comme il refuse
# toute ligne pour une discipline qui ne crédite pas.
splits:
    - { discipline: STRENGTH, strength: 75, endurance: 15, mobility: 5, dexterity: 5 }
    - { discipline: RUNNING, strength: 5, endurance: 75, mobility: 5, dexterity: 15 }
    - { discipline: CYCLING, strength: 15, endurance: 60, mobility: 10, dexterity: 15 }
    - { discipline: SWIMMING, strength: 15, endurance: 55, mobility: 20, dexterity: 10 }
    - { discipline: HIKING, strength: 10, endurance: 55, mobility: 20, dexterity: 15 }
    - { discipline: HIIT, strength: 20, endurance: 25, mobility: 25, dexterity: 30 }
    - { discipline: MOBILITY, strength: 5, endurance: 10, mobility: 70, dexterity: 15 }
    - { discipline: CLIMBING, strength: 40, endurance: 20, mobility: 20, dexterity: 20 }
    - { discipline: FOOTBALL, strength: 15, endurance: 30, mobility: 15, dexterity: 40 }
    - { discipline: COURT_SPORTS, strength: 15, endurance: 30, mobility: 10, dexterity: 45 }
    - { discipline: RACKET_SPORTS, strength: 10, endurance: 25, mobility: 10, dexterity: 55 }

# Vitality (#161), la cinquième caractéristique du game design : entièrement dérivée des
# quatre ci-dessus, jamais créditée directement — voir le docblock d'`App\Shared\Domain\
# Activity\Vitality`. Le même sujet que la table plus haut — les caractéristiques du
# personnage — d'où le même fichier plutôt qu'un huitième pour deux nombres.
#
# ————— Le coefficient d'équilibre —————————————————————————————————————————————————————
#
# Maximal quand les quatre totaux sont égaux, minimal dès qu'un seul porte tout :
#
#     coefficient = (S × E × M × D)^(1/4) / ((S + E + M + D) / 4)
#
# le rapport de la moyenne géométrique à la moyenne arithmétique des quatre totaux. Tranché
# en revue contre un `min/max`, écarté pour être trop brutal — une seule caractéristique à
# zéro l'aurait écrasée même avec les trois autres parfaitement équilibrées. La formule
# elle-même n'a pas de paramètre libre ; ce fichier ne porte donc que ce que l'équilibrage
# a réellement à trancher : le plancher ci-dessous.
#
# ————— Le plancher ——————————————————————————————————————————————————————————————————————
#
# Une part du total, pas une valeur absolue :
#
#     vitality = max(total × coefficient, total × floor_permille / 1000)
#
# Un plancher absolu figerait un joueur monospécialisé à 100 000 XP au même niveau qu'un
# débutant. `floor_permille` dit la bonne chose : celui qui ne fait qu'un sport progresse
# quand même, mille millièmes divisé par ce nombre fois plus lentement que celui qui varie.
# **Non négociable à zéro** : un débutant qui n'a pratiqué qu'un sport doit avoir une
# Vitality basse, jamais nulle — ce sera les HP du personnage au PvP, et zéro HP à
# l'inscription serait une punition pour avoir commencé. `total = 0` fait exception :
# c'est l'état d'un compte qui vient de s'inscrire, pas celui d'une pratique déséquilibrée,
# et le plancher ne s'y applique pas — voir `Vitality::of()`.
vitality:
    floor_permille: 250
