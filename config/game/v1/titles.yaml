# Le catalogue des titres. Un titre est une **récompense de statut** : il ne produit aucun
# modificateur, il ne change rien au calcul d'XP, il se porte. C'est la seule récompense du
# jeu dont la valeur est entièrement sociale, et c'est voulu.
#
# Ce fichier ne porte **que l'identifiant et la condition** — l'équilibrage, donc. Les
# libellés vivent dans `translations/titles.{fr,en}.yaml` et n'entrent pas dans le
# `rulesetVersion` : renommer « Vétéran » en « Ancien » ne change rien à ce qu'un joueur a
# gagné, alors que baisser un seuil, si. Deux choses qui bougent à des rythmes différents ne
# partagent pas un fichier.
#
# Les quatre types de condition ne lisent que le ledger d'XP et le snapshot — donc rien
# qu'un autre module possède. C'est ce qui permet de les évaluer à la complétion sans
# franchir une frontière :
#
#   level_reached      niveau atteint                       (pas de discipline)
#   total_xp           XP cumulée au ledger                 (pas de discipline)
#   session_count      séances créditées, toutes ou d'une discipline
#   discipline_seconds temps cumulé dans une discipline     (discipline obligatoire)
#
# Les compteurs sont **nets** : une séance invalidée écrit sa contrepartie négative au
# ledger et cesse de compter ici comme elle cesse de compter en XP. Un titre déjà débloqué,
# lui, ne se reprend jamais — c'est la table `player_title` qui le garantit, pas ce fichier.
#
# L'ordre de déclaration départage les ex æquo quand il s'agit de désigner le **prochain**
# titre d'un joueur : à progression égale, le premier écrit ici gagne. Les seuils les plus
# accessibles sont donc en tête de chaque famille, et l'assiduité passe avant le reste —
# c'est ce qui fait qu'un compte tout neuf, où tout est à zéro, se voit proposer « termine ta
# première séance » plutôt qu'un palier lointain.
titles:
    # L'assiduité, indépendamment du volume. Une séance courte compte autant qu'une longue :
    # c'est exactement ce que les rendements décroissants encouragent par ailleurs.
    - { id: first_steps, condition: { type: session_count, threshold:   1 } }
    - { id: regular,     condition: { type: session_count, threshold:  25 } }
    - { id: veteran,     condition: { type: session_count, threshold: 100 } }

    # La courbe de niveaux. Le joueur les croise sans les chercher — ce sont les jalons qui
    # récompensent le simple fait de continuer.
    - { id: apprentice, condition: { type: level_reached, threshold:  5 } }
    - { id: adept,      condition: { type: level_reached, threshold: 10 } }
    - { id: master,     condition: { type: level_reached, threshold: 25 } }
    - { id: legend,     condition: { type: level_reached, threshold: 50 } }

    # L'XP brute. Redondante avec le niveau par construction, et c'est l'intérêt : elle
    # donne un second palier à afficher entre deux niveaux qui s'espacent.
    - { id: ten_thousand,   condition: { type: total_xp, threshold: 10000 } }
    - { id: fifty_thousand, condition: { type: total_xp, threshold: 50000 } }

    # La spécialisation. Vingt séances dans une discipline, c'est une pratique, pas un essai.
    - { id: road_runner, condition: { type: session_count, threshold: 20, discipline: RUNNING } }
    - { id: peloton,     condition: { type: session_count, threshold: 20, discipline: CYCLING } }
    - { id: triton,      condition: { type: session_count, threshold: 20, discipline: SWIMMING } }
    - { id: iron,        condition: { type: session_count, threshold: 20, discipline: STRENGTH } }
    - { id: elastic,     condition: { type: session_count, threshold: 20, discipline: MOBILITY } }
    - { id: spider,      condition: { type: session_count, threshold: 20, discipline: CLIMBING } }

    # Le temps passé, en secondes — l'unité du ledger, sans conversion à relire de travers.
    # 360 000 s = 100 h, 720 000 s = 200 h.
    - { id: marathoner, condition: { type: discipline_seconds, threshold: 360000, discipline: RUNNING } }
    - { id: centurion,  condition: { type: discipline_seconds, threshold: 720000, discipline: CYCLING } }
