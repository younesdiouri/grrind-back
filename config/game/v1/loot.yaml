# Les tables de tirage (#27), consommées par App\Rewards\Domain\LootRoller (#28). Comme
# `items.yaml` et `combat.yaml`, ce fichier est de la donnée, lue et validée à la
# compilation du conteneur par App\Rewards\Infrastructure\Config\LootSection, et il entre
# dans le `rulesetVersion`.
#
# ————— `loot_luck`, le plancher et le plafond du LOOT_LUCK effectif ————————————————————
#
# `LootRoller` déplace les poids d'une table vers ses objets selon le LOOT_LUCK composé du
# joueur, jamais l'entrée « rien » — voir son docblock. `floor_percent` et `cap_percent`
# bornent ce total composé : le plancher à zéro garantit qu'aucun poids ne descend sous ce
# qui est déclaré ci-dessous, le plafond empêche qu'un empilement d'objets ne transforme une
# table en distributeur — voir le docblock d'`App\Rewards\Domain\LootLuckRules` pour les
# deux raisons en détail. `200` est la valeur livrée, sans prétention d'équilibrage, même
# réserve que le reste de ce fichier.
#
# ————— `version`, indépendante du `rulesetVersion` global ————————————————————————————————
#
# Un tirage audité (#28) stocke le roll, la graine, **et** la version de la table qui l'a
# produit — voir le docblock d'`App\Rewards\Domain\LootTables`. Rééquilibrer les poids
# d'une table incrémente `version` sans toucher au `rulesetVersion` global : les deux
# datent des choses différentes, un rééquilibrage de loot n'a aucune raison d'invalider
# l'historique d'XP.
#
# ————— Trois origines ——————————————————————————————————————————————————————————————————
#
# `workout` : une table par palier de séance, gardée par une éligibilité — discipline (liste
# vide = toute discipline), durée minimale en minutes, niveau minimal. Plusieurs tables
# peuvent être éligibles à la fois pour une même séance ; départager laquelle s'applique est
# une décision du tirage (#28), pas de ce fichier.
#
# `adversary` : une table par clé d'ennemi ou de boss de `combat.yaml` — l'adversaire choisi
# *est* la condition, il n'y a donc pas d'éligibilité à écrire ici, même geste
# qu'`EnemyCatalog` pour unifier ennemis et boss sous un seul vocabulaire.
#
# `chest` (#230) : une table par clé de coffre de `items.yaml` (`kind: CHEST`) — même geste
# qu'`adversary`, le coffre choisi *est* la condition. Une table de coffre ne peut pas
# contenir de coffre : refusé au chargement par `App\Rewards\Domain\LootTables`, voir son
# docblock — un coffre s'achète à la boutique, il ne tombe jamais d'un tirage.
#
# ————— Chaque table ————————————————————————————————————————————————————————————————————
#
# `coins` est une bande — un minimum, un maximum — jamais un montant fixe : un nombre
# constant n'est pas une récompense, c'est un compteur. Tirée sous la même graine que les
# objets (#28), donc auditable au même titre.
#
# `entries` pondère chaque objet possible, plus une entrée « rien » explicite (l'absence de
# `item`) : un tirage bredouille est un résultat à part entière, pas un trou dans la table.
# La somme des poids doit rester positive — validé par `LootTable`, qui refuse aussi une
# table sans entrée « rien ».
#
# ————— Réserve ————————————————————————————————————————————————————————————————————————
#
# Chaque adversaire de `combat.yaml` a sa table ici, avec une part de « rien » qui décroît
# et une bande de pièces qui croît à mesure que l'adversaire monte en palier — sans aucune
# prétention d'équilibrage, personne n'a encore joué à ce jeu. Même réserve que la note
# au-dessus du catalogue d'ennemis dans `combat.yaml` : ces poids se patchent ici sans
# migration, en incrémentant `version`.
version: 1

loot_luck:
    floor_percent: 0
    cap_percent: 200

workout:
    - key: STARTER_SESSION_DROP
      eligibility: { disciplines: [], minimum_duration_minutes: 20, minimum_level: 1 }
      coins: { minimum: 5, maximum: 15 }
      entries:
          - { weight: 70 }
          - { item: WORN_RUNNING_SHOES, weight: 10 }
