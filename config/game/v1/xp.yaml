# Ce qu'une séance rapporte, avant tout modificateur et avant tout garde-fou.
#
# ————— Une formule qu'on explique en une phrase ————————————————————————————————————————
#
#     une minute = un point, plus les kilomètres, plus le dénivelé.
#
# Le barème précédent donnait un taux horaire par discipline — 90 en course, 100 en
# natation, 85 en escalade. Il n'était ni juste ni faux : il était **non mesuré**, inventé
# avant d'avoir un seul joueur, et il coûtait six lignes à défendre à chaque discussion
# d'équilibrage.
#
# La V1 santé a une seule question à poser : *est-ce que le fait que mon activité réelle
# alimente mon personnage est fun ?* Une formule qu'un joueur comprend sans y penser ne
# pollue pas la réponse. La formule RPG parfaite se construira après, sur des joueurs
# réels, et le `rulesetVersion` est précisément ce qui permet de la changer sans toucher à
# l'historique déjà écrit.
#
# ————— Pourquoi toutes les disciplines n'ont pas de bonus de distance ——————————————————
#
# `STRENGTH`, `HIIT`, `MOBILITY` et `CLIMBING` sont à la durée seule. Pas parce qu'elles
# valent moins : parce qu'aucune montre ne leur donne une seconde dimension fiable. Une
# dimension qu'on n'aurait que sur la moitié des appareils créerait deux jeux au lieu d'un,
# et le joueur au bracelet d'entrée de gamme serait puni pour son matériel.
#
# Le dénivelé n'est déclaré que sur `HIKING`, où il *est* l'effort. Une course en côte le
# gagnera peut-être plus tard ; ce sera une ligne ici, et rien d'autre.
#
# Une clé absente vaut « pas de bonus » — elle ne vaut pas zéro. La distinction se voit
# côté joueur : une séance de fonte n'affiche pas « +0 XP pour tes 0 km ».
base_xp_per_hour: 60

# `daily_cap_xp` est un **filet, pas une laisse.** Il n'existe que pour qu'aucune journée ne
# devienne aberrante ; le limiteur qui se ressent, et qui est une vraie mécanique de jeu,
# ce sont les rendements décroissants plus bas. Les disciplines à la durée seule sont
# bornées de fait par ces tranches — 87 minutes retenues au maximum sur une journée — donc
# leur plafond ne sert que face à un empilement de modificateurs.
#
# Les disciplines à distance ont un plafond plus haut parce qu'elles peuvent légitimement
# aller plus loin : un trail de trente kilomètres est une vraie journée de sport, pas un
# abus, et le refuser serait exactement le genre de garde-fou qui punit le joueur assidu.
disciplines:
    - { discipline: RUNNING, daily_cap_xp: 400, xp_per_km: 10 }
    - { discipline: WALKING, daily_cap_xp: 200, xp_per_km: 5 }
    - { discipline: CYCLING, daily_cap_xp: 400, xp_per_km: 3 }
    - { discipline: SWIMMING, daily_cap_xp: 300, xp_per_km: 50 }
    - { discipline: HIKING, daily_cap_xp: 500, xp_per_km: 8, xp_per_100m_elevation: 20 }
    - { discipline: STRENGTH, daily_cap_xp: 200 }
    - { discipline: HIIT, daily_cap_xp: 200 }
    - { discipline: MOBILITY, daily_cap_xp: 200 }
    - { discipline: CLIMBING, daily_cap_xp: 200 }

# Rendements décroissants sur le **cumul de la journée**, toutes disciplines confondues, et
# dans le fuseau du joueur. C'est le garde-fou anti-abus qui ne se ressent pas comme une
# punition : au-delà d'un certain temps d'entraînement quotidien, continuer rapporte de
# moins en moins, ce qui supprime l'intérêt de tricher tout en restant une règle de jeu
# qu'un sportif trouve juste.
#
# Ils portent sur le **socle**, donc sur le temps. La distance et le dénivelé s'y ajoutent
# sans être rabotés, et c'est cohérent avec ce qu'ils mesurent : dix kilomètres restent dix
# kilomètres, quelle que soit l'heure de la journée à laquelle on les a courus. C'est le
# plafond quotidien qui borne ce côté-là.
#
# Le découpage est **par tranche**, pas par palier global : une séance à cheval sur deux
# tranches est coupée en deux, chaque morceau à son propre poids. Une séance de 20 min
# commencée à la 50ᵉ minute de la journée compte 10 min à 100 % puis 10 min à 60 %.
#
# `up_to_minutes` est la borne haute du cumul quotidien, `weight_percent` ce que vaut la
# minute passée dans cette tranche. Les poids doivent décroître — c'est le nom de la
# mécanique, et un poids qui remonterait rendrait rentable d'attendre.
diminishing_returns:
    - { up_to_minutes: 60, weight_percent: 100 }
    - { up_to_minutes: 90, weight_percent: 60 }
    - { up_to_minutes: 120, weight_percent: 30 }

# Au-delà de la dernière tranche : plus rien. La séance existe, elle compte pour le streak
# et pour l'historique, mais son temps ne rapporte plus d'XP.
diminishing_returns_beyond_percent: 0
