# La courbe de niveaux. `total_xp` est le seuil **cumulé** : le niveau d'un joueur est le
# plus haut dont le seuil est atteint par son total au ledger. Le niveau n'est donc jamais
# stocké comme une vérité — c'est une projection, et `progression_snapshot` n'en est qu'un
# cache reconstructible.
#
# La forme vient de `coût(n) = 100 + 60 × (n − 1)` XP pour passer du niveau n au suivant :
# une progression arithmétique, donc une courbe cumulée quadratique. Les seuils sont écrits
# en clair et non calculés au chargement, pour qu'un niveau puisse être retouché seul —
# c'est ce que « config-as-code » veut dire, et une formule ne le permettrait pas.
#
# Rythme visé, pour un joueur actif à ~100 XP/jour :
#   niveau  5 →   760 XP  ~ 1 semaine
#   niveau 10 →  3 060 XP ~ 1 mois
#   niveau 20 → 12 160 XP ~ 4 mois
#   niveau 30 → 27 260 XP ~ 9 mois
#   niveau 50 → 75 460 XP ~ 2 ans
#
# `skill_points` est ce que **ce** niveau accorde en arrivant : 1 par niveau, 3 aux dizaines
# pour que les paliers ronds soient un événement. 59 points au total sur la courbe — c'est
# le budget que les arbres de compétences (#31) auront à dépenser, et il se règle ici.
#
# Le niveau 1 est déclaré explicitement à 0 XP et 0 point : un fichier qui commence à 2
# laisserait le socle implicite, et c'est le genre de sous-entendu qu'on relit de travers.
levels:
    - { level:  1, total_xp:      0, skill_points: 0 }
    - { level:  2, total_xp:    100, skill_points: 1 }
    - { level:  3, total_xp:    260, skill_points: 1 }
    - { level:  4, total_xp:    480, skill_points: 1 }
