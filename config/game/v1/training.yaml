# Ce qu'un workout importé doit mesurer pour entrer, et ce qu'il vaut au maximum. Ces
# valeurs sont de l'équilibrage, pas du code : elles bougeront après les premiers joueurs.
#
# Ce fichier est de la donnée, pas de la configuration Symfony : il est lu et validé à la
# compilation du conteneur par App\Training\Infrastructure\Config\TrainingSection, et il
# entre dans le `rulesetVersion` stocké avec chaque transaction d'XP. Une clé inconnue ou
# un seuil incohérent fait échouer le démarrage.

# Sous ce seuil, le workout n'entre pas : douze secondes, c'est un faux départ sur la
# montre, pas une séance. Il est signalé au client plutôt que crédité (#91).
minimum_duration_seconds: 300

# Au-delà, la durée est écrêtée, pas rejetée : l'enregistrement oublié sur la montre
# rend quatre heures créditées au lieu de tout perdre.
maximum_duration_seconds: 14400
