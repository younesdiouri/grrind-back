# Le catalogue d'objets (#27). Comme `combat.yaml`, ce fichier est de la donnée, pas de la
# configuration Symfony : il est lu et validé à la compilation du conteneur par
# App\Rewards\Infrastructure\Config\ItemsSection, et il entre dans le `rulesetVersion`. Une
# clé inconnue — rareté, emplacement, type de modificateur — fait échouer le démarrage.
#
# Aucune ligne de base et aucun tirage ici (#28), aucun inventaire (#29) : ce ticket pose le
# catalogue entier, prix compris, pour que les tickets suivants du lot n'aient jamais à le
# rouvrir pour y ajouter un champ qu'on savait devoir y mettre.
#
# ————— Le prix, avant la boutique ——————————————————————————————————————————————————————
#
# `price_coins` a existé un temps sans qu'aucune route ne le dépense (#27) : un montant de
# pièces qui ne s'adosse à aucun prix ne s'équilibre pas, il se devine. Le poser tôt a donné
# aux pièces une échelle dès le premier drop (#28), avant même qu'on puisse en dépenser — la
# boutique (#229) referme la boucle, et n'a rien eu à ajouter ici : le prix reste sur l'objet,
# où il était déjà. Un objet peut porter un prix sans être à l'étal, c'est même le cas normal :
# les trois quarts du catalogue en portent un depuis le premier jour, `shop:` ci-dessous ne
# vend que les sept premiers.
#
# ————— La boutique : `shop:` (#229) —————————————————————————————————————————————————————
#
# Facultatif, objet par objet — absent vaut « pas vendu ». `{ available: true, minimum_level:
# N }` : `minimum_level` suit le palier de la rareté (COMMON/UNCOMMON → même rythme que
# `enemies:` de `combat.yaml`, RARE → le palier suivant), pas une valeur libre. Un
# `minimum_level` posé sans `available: true` est une config qui ment, refusée au démarrage
# par `ItemCatalog`.
#
# **Aucun objet EPIC ou LEGENDARY n'entre dans `shop:`, et `ItemCatalog` le refuse s'il en
# arrivait un.** Un objet qui s'achète n'est plus une récompense de tirage — voir le docblock
# de la classe pour la règle complète. `OBSIDIAN_WARBLADE`, `STORMCALLERS_BOOTS` et
# `CROWN_OF_THE_TIRELESS` restent donc hors étal : ils ont un prix (pour l'affichage d'un
# drop) mais jamais de bloc `shop:`.
#
# Ni rotation ni exemplaire multiple : l'étal entier se lit en un `GET`, sept objets, et un
# objet déjà possédé ne se revend ni ne se rachète — voir `POST /api/shop/purchases` pour les
# deux refus que ça pose (`item-already-owned`, jamais un champ « unique » sur le catalogue).
#
# ————— Les modificateurs : un seul vocabulaire, jamais un mécanisme parallèle ——————————
#
# `type` se valide contre `App\Shared\Domain\Modifier\ModifierType::tryFrom()`, pas contre
# une liste recopiée ici — voir `ItemsSection` et `ItemModifier`. Deux familles y entrent,
# depuis le #224 :
#
#   - les quatre types de la V1 (`XP_MULTIPLIER`, `LOOT_LUCK`, `STREAK_SHIELD`,
#     `UNLOCK_SESSION_TYPE`) ;
#   - les caractéristiques pures et les stats de combat directes ouvertes au #224
#     (`STRENGTH_BONUS`, `ENDURANCE_BONUS`, `MOBILITY_BONUS`, `DEXTERITY_BONUS`, `HP_BONUS`,
#     `DAMAGE_BONUS`, `MITIGATION_BONUS`, `EXTRA_TURN_BONUS`, `DODGE_BONUS`), consommées par
#     `FighterFactory` — voir son docblock pour l'ordre exact de la dérivation.
#
# **L'unité d'un bonus de caractéristique est le point d'XP réparti, pas un point abstrait.**
# Les caractéristiques d'`attributes.yaml` sont des totaux cumulés, et `combat.yaml` les
# consomme par milliers (`damage_per_1000_strength: 6`) : un objet à « +5 Strength » ne
# donnerait rigoureusement rien, `intdiv(5 * 6, 1000) == 0`. « Des centaines » ne suffit pas
# comme consigne : un `STRENGTH_BONUS` de 100 dérive *encore* à zéro dégât, l'erreur commise
# à la livraison de ce fichier avant d'être relevée en revue de la PR #232. Le seuil réel
# dépend du coefficient de la caractéristique visée dans `combat.yaml` (`valeur × coefficient
# ÷ 1000 ≥ 1`), donc il ne se fige pas ici — il se prouve :
# `RewardsCoverageTest::testChaqueBonusDeCaracteristiquePureLivreChangeLeFighterDUnCompteNeuf()`
# fait échouer `make test` pour tout objet livré dont le bonus de caractéristique dérive à
# zéro sur un compte neuf. Les valeurs se repatchent ici sans migration ; cette règle-là ne
# se repatche pas.
#
# `discipline`, sur un modificateur, est facultatif — absente vaut global, une valeur vaut
# « seulement pour cette discipline », comme `Modifier::$discipline`. C'est ce qui permet
# des bottes de course qui ne servent à rien en natation, voir le docblock de `Modifier`.
# Aucun des neuf types de combat ci-dessus n'en porte : un combat n'a lieu « dans » aucune
# discipline, et `FighterFactory` ignore ce champ pour eux — voir son docblock.
#
# ————— Réserve ————————————————————————————————————————————————————————————————————————
#
# Dix objets, une progression de prix et de puissance qui suit les paliers d'ennemis de
# `combat.yaml`, sans aucune prétention d'équilibrage : personne n'a encore joué à ce jeu,
# même réserve que la note au-dessus du catalogue d'ennemis dans `combat.yaml`. Ces valeurs
# se patchent ici sans migration, c'est tout l'intérêt d'un fichier de config.
items:
    - key: WORN_RUNNING_SHOES
      rarity: COMMON
      slot: FEET
      price_coins: 30
      shop: { available: true, minimum_level: 1 }
      modifiers:
          - { type: XP_MULTIPLIER, value: 5, discipline: RUNNING }
          # Une chaussure ne rend pas plus fort, elle rend plus agile — Mobility, pas Strength.
          # 1000 × dodge_permille_per_1000_mobility (10) ÷ 1000 = 10 ‰ d'esquive.
          - { type: MOBILITY_BONUS, value: 1000 }

    - key: IRON_GAUNTLETS
      rarity: COMMON
      slot: HANDS
      price_coins: 30
      shop: { available: true, minimum_level: 1 }
      modifiers:
          - { type: XP_MULTIPLIER, value: 5, discipline: STRENGTH }
          # 350 × damage_per_1000_strength (6) ÷ 1000 = 2 dégâts (12,5 % du socle de 16).
          - { type: STRENGTH_BONUS, value: 350 }

    - key: TRAVELERS_CLOAK
      rarity: UNCOMMON
      slot: CHEST
      price_coins: 80
      shop: { available: true, minimum_level: 5 }
      modifiers:
          - { type: XP_MULTIPLIER, value: 8 }
          # Encaisse le froid et la fatigue de la route — Endurance, pas des PV directs.
          # 1200 × mitigation_permille_per_1000_endurance (15) ÷ 1000 = 18 ‰ de mitigation.
          - { type: ENDURANCE_BONUS, value: 1200 }

    - key: LUCKY_RABBIT_CHARM
      rarity: UNCOMMON
      slot: ACCESSORY
      price_coins: 90
      shop: { available: true, minimum_level: 5 }
      modifiers:
          - { type: LOOT_LUCK, value: 10 }
          # La chance ne s'arrête pas au loot : un porte-bonheur fait aussi éviter le coup.
          # Direct, donc déjà l'effet final — même ordre de grandeur que l'Endurance de
          # `TRAVELERS_CLOAK` ci-dessus, à rareté égale.
          - { type: DODGE_BONUS, value: 18 }

    - key: TEMPERED_HEADBAND
      rarity: RARE
      slot: HEAD
      price_coins: 180
      shop: { available: true, minimum_level: 10 }
      modifiers:
          - { type: XP_MULTIPLIER, value: 12 }
          # 2400 × extra_turn_permille_per_1000_dexterity (12) ÷ 1000 = 28 ‰ de tour supplémentaire.
          - { type: DEXTERITY_BONUS, value: 2400 }

    - key: SWIFT_TRAIL_LEGGINGS
      rarity: RARE
      slot: LEGS
      price_coins: 180
      shop: { available: true, minimum_level: 10 }
      modifiers:
          - { type: XP_MULTIPLIER, value: 10, discipline: HIKING }
          - { type: LOOT_LUCK, value: 5 }
          # « Swift » : le réflexe pour rejouer un tour, direct plutôt que via Dexterity.
          # Direct, donc déjà l'effet final — même ordre de grandeur que la Dexterity de
          # `TEMPERED_HEADBAND` ci-dessus, à rareté égale.
          - { type: EXTRA_TURN_BONUS, value: 28 }

    - key: EMBER_OF_THE_ANCESTORS
      rarity: RARE
      slot: ACCESSORY
      price_coins: 220
      shop: { available: true, minimum_level: 10 }
      modifiers:
          # Une charge : voir le docblock de `ModifierType::StreakShield`. Le futur
          # contributeur de `Rewards` (#29) décidera comment plusieurs charges portées
          # à la fois se composent ; ce catalogue ne pose qu'un objet à une charge.
          - { type: STREAK_SHIELD, value: 1 }
          # La braise protège autant qu'elle porte chance — mitigation directe, même
          # ordre de grandeur que les deux autres objets RARE ci-dessus.
          - { type: MITIGATION_BONUS, value: 28 }

    - key: OBSIDIAN_WARBLADE
      rarity: EPIC
      slot: WEAPON
      price_coins: 450
      modifiers:
          - { type: XP_MULTIPLIER, value: 15, discipline: STRENGTH }
          - { type: LOOT_LUCK, value: 10 }
          # Une lame ajoute du dégât brut, pas de la Strength — direct plutôt que dérivé.
          # 4 dégâts (25 % du socle de 16) : notable sans décider seul du combat.
          - { type: DAMAGE_BONUS, value: 4 }

    - key: STORMCALLERS_BOOTS
      rarity: EPIC
      slot: FEET
      price_coins: 450
      modifiers:
          - { type: XP_MULTIPLIER, value: 18, discipline: RUNNING }
          # 4200 × dodge_permille_per_1000_mobility (10) ÷ 1000 = 42 ‰ d'esquive.
          - { type: MOBILITY_BONUS, value: 4200 }

    - key: CROWN_OF_THE_TIRELESS
      rarity: LEGENDARY
      slot: HEAD
      price_coins: 900
      modifiers:
          - { type: XP_MULTIPLIER, value: 20 }
          - { type: LOOT_LUCK, value: 20 }
          # « Tireless » : plus de points de vie, jamais via Vitality — voir le docblock
          # de `ModifierType` pour pourquoi Vitality ne peut pas recevoir de modificateur.
          # 40 PV (28,6 % du socle de 140) : le seul objet LEGENDARY du catalogue, notable
          # sans être décisif à lui seul.
          - { type: HP_BONUS, value: 40 }
