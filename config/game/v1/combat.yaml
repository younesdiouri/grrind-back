# Le combat PvE : les socles d'un combattant, et le catalogue des ennemis. Ce fichier est de
# la donnée, pas de la configuration Symfony : il est lu et validé à la compilation du
# conteneur par App\Combat\Infrastructure\Config\CombatSection, et il entre dans le
# `rulesetVersion`. Une clé inconnue fait échouer le démarrage.
#
# La dérivation caractéristique → combattant (#210, `FighterFactory`) et le combat lui-même
# (#209, `BattleSimulator`) sont appliqués depuis ces nombres.

# ————— Le combattant ————————————————————————————————————————————————————————————————————
#
# Une dérivation **linéaire** des quatre caractéristiques, assumée en V1 : elles sont des
# totaux d'XP répartis, donc sans borne, et une dérivation linéaire donne des dégâts qui
# croissent sans borne eux aussi. C'est acceptable *uniquement* parce que l'ennemi opposé
# est choisi au niveau du joueur — voir `EnemyCatalog`. Le jour où un combat opposera deux
# courbes qui ne montent pas au même rythme (PvP, ennemi de palier fixe), il faudra une
# vraie courbe, sur le modèle de `LevelCurve` — ce sera un ticket, pas une rustine ici.
#
# `base_hp` et `base_damage` ont été relevés au #210, en revue du #208 : un compte neuf (les
# quatre caractéristiques à zéro) perdait son premier combat contre `SAND_JACKAL`, et pas de
# justesse — voir `CombatCoverageTest::testTheShippedFighterSocleWinsTheLevelOneEncounter()`
# pour le calcul rejoué sur les valeurs livrées. Le socle est le seul levier qui compte pour
# un compte neuf, puisque les quatre coefficients ci-dessous s'appliquent à des totaux
# encore nuls — c'est pour ça qu'on le relève lui, pas eux.
fighter:
  # Un socle de PV avant tout apport de Vitality : un joueur qui n'a encore rien réparti
  # ailleurs qu'en Strength ne doit pas se retrouver à un point de vie.
  base_hp: 140
  hp_per_1000_vitality: 40

  base_damage: 16
  damage_per_1000_strength: 6

  # La mitigation réduit le dégât reçu, en millièmes du dégât brut. Le plafond doit rester
  # *strictement* sous 1000 (100 %) — `CombatRules` le refuse, voir son docblock : à 1000,
  # un combattant devient invulnérable et la boucle ne se termine plus sur ses propres
  # mérites.
  mitigation_permille_per_1000_endurance: 15
  mitigation_cap_permille: 700

  # La chance, en millièmes, de rejouer un tour immédiatement. Même garde-fou que la
  # mitigation : à 1000 (100 %), le joueur ne rendrait jamais la main.
  extra_turn_permille_per_1000_dexterity: 12
  extra_turn_cap_permille: 350

  # La chance, en millièmes, qu'une attaque contre ce combattant échoue entièrement : Mobility
  # entre en combat (#218) — Strength frappe, Endurance encaisse, Dexterity rejoue, Mobility
  # évite. Même garde-fou que les deux précédents : à 1000 (100 %), une cible n'encaisserait
  # plus jamais rien, et le combat ne se déciderait plus que par `max_turns` — voir
  # `CombatRules`.
  dodge_permille_per_1000_mobility: 10
  dodge_cap_permille: 300

  # Le plancher qui garantit qu'un tour fait toujours reculer un point de vie, quelle que
  # soit la mitigation en face — `CombatRules` refuse une valeur sous 1.
  minimum_damage: 1

  # Le filet de sécurité algorithmique, indépendant des deux plafonds ci-dessus : même une
  # dérivation cohérente doit avoir une borne dure sur la durée d'un combat, pour que le
  # #209 puisse le prouver sans compter sur l'équilibrage pour rester sage.
  max_turns: 200

# ————— Le catalogue d'ennemis ——————————————————————————————————————————————————————————
#
# Un ennemi par palier, pas une courbe : ses stats sont écrites en clair, pas dérivées d'une
# formule — voir le docblock d'`EnemyCatalog`. Les paliers suivent le rythme de la courbe de
# niveaux (`levels.yaml` : 5 ~ 1 semaine, 10 ~ 1 mois, 20 ~ 4 mois, 30 ~ 9 mois, 50 ~ 2 ans),
# pour qu'il y ait toujours un adversaire récent à opposer à un joueur qui progresse.
#
# Premier jet, à ajuster en jeu : les six premiers ennemis ne couvrent qu'un an et demi de
# progression, le reste du catalogue s'ajoutera avec les niveaux au-delà de 50.
#
# `ASH_TITAN` a été relevé au #210, en revue du #208 : les quatre caractéristiques d'un
# joueur sont des totaux d'XP répartis, donc **linéaires en XP** — et `total_xp` est
# quadratique en niveau (`levels.yaml`). Un ennemi écrit à la main pour suivre le rythme des
# niveaux, lui, ne l'est pas : sans ce relevé, un joueur de haut niveau dépassait le
# catalogue de plus en plus largement, jusqu'à ne plus jamais être inquiété — voir
# `CombatCoverageTest::testTheShippedTopTierEncounterIsNotAFormality()`. Ce n'est pas la
# vraie correction — celle-là demande une courbe, voir plus haut — seulement de quoi rendre
# le dernier palier livré à nouveau menaçant pour la fourchette de niveaux qu'il couvre.
#
# **`DUNE_RAIDER`, `IRON_JACKAL`, `STORM_HYENA` et `OBSIDIAN_WOLF` n'ont pas bougé au #210.**
# Le socle du joueur (`fighter.base_hp`, `fighter.base_damage`), lui, a été relevé pour tout
# le monde — voir plus haut — donc les niveaux 5 à 30 sont mécaniquement devenus *plus
# faciles* qu'ils ne l'étaient déjà, alors que le seul constat écrit à ce jour porte sur les
# niveaux 1 et 50. Ce n'est pas oublié, c'est délibérément laissé tel quel : personne n'a
# encore joué à ce jeu, et accorder quatre paliers au jugé serait ajuster des chiffres contre
# une intuition plutôt que contre une vraie partie. `CombatCoverageTest` ne pince donc que
# les deux extrémités ; un test de fumée séparé vérifie seulement que chaque palier livré
# produit un combat qui tient debout, sans juger de sa difficulté.
#
# `dodge_permille` (#218) suit la même progression que `extra_turn_permille` du même palier,
# à l'échelle près : un ennemi qui rejoue plus souvent son tour est aussi un ennemi qui évite
# mieux les coups, même geste de lisibilité que le reste du catalogue. Ces valeurs n'ont pas
# eu besoin d'un second relevé comme celui d'`ASH_TITAN` au #210 : `CombatCoverageTest` passe
# sans y toucher, esquive et tour supplémentaire compris — cette progression proportionnelle
# suffit à laisser `testTheShippedFighterSocleWinsTheLevelOneEncounter()` gagnable et
# `testTheShippedTopTierEncounterIsNotAFormality()` disputé.
enemies:
  - { key: SAND_JACKAL, level: 1, hp: 120, damage: 12, mitigation_permille: 50, extra_turn_permille: 40, dodge_permille: 30 }
  - { key: DUNE_RAIDER, level: 5, hp: 220, damage: 18, mitigation_permille: 80, extra_turn_permille: 60, dodge_permille: 45 }
  - { key: IRON_JACKAL, level: 10, hp: 380, damage: 26, mitigation_permille: 120, extra_turn_permille: 90, dodge_permille: 70 }
  - { key: STORM_HYENA, level: 20, hp: 640, damage: 40, mitigation_permille: 180, extra_turn_permille: 130, dodge_permille: 100 }
  - { key: OBSIDIAN_WOLF, level: 30, hp: 950, damage: 58, mitigation_permille: 240, extra_turn_permille: 170, dodge_permille: 130 }
  - { key: ASH_TITAN, level: 50, hp: 2400, damage: 132, mitigation_permille: 400, extra_turn_permille: 300, dodge_permille: 220 }

# ————— Les boss (#219) —————————————————————————————————————————————————————————————————
#
# Ce que cette table décide : un boss est un ennemi avec de plus gros chiffres et un verrou
# de niveau — rien de plus. `minimum_level` et non `level` : contrairement à un ennemi de
# `enemies:`, un boss n'est jamais choisi automatiquement par `forLevel()`, il se choisit en
# nommant sa clé dans le corps de `POST /api/battles`, et reste affrontable au-delà de son
# palier — on y retourne quand on est plus fort, voir le docblock d'`EnemyCatalog`.
#
# Ce qu'elle ne décide pas : aucune limite de tentatives. Le #227 a apporté la récompense
# que le #219 laissait volontairement en suspens — un boss donne par sa propre table dans
# `loot.yaml`, comme n'importe quel adversaire — et n'a rien borné du farm pour autant : voir
# le docblock de `App\Combat\Application\FightBattleHandler` pour la décision et le ticket de
# dette #228. Pas de phase, pas de mécanique spéciale : un `Fighter` de plus dans la même
# boucle que `BattleSimulator` connaît déjà.
#
# Un palier par boss, choisi pour recouper un niveau déjà couvert par `enemies:` ci-dessus
# — c'est ce qui permet à `CombatCoverageTest` de réutiliser la même table de XP de
# référence pour les deux. Les stats visent un adversaire nettement plus dur que l'ennemi
# ordinaire du même palier, sans prétendre à un équilibrage précis : personne n'a encore
# joué à ce jeu, voir la note au-dessus du catalogue d'ennemis pour la même réserve.
bosses:
  - { key: DUNE_SOVEREIGN, minimum_level: 10, hp: 700, damage: 40, mitigation_permille: 200, extra_turn_permille: 120, dodge_permille: 90 }
  - { key: STORM_MATRIARCH, minimum_level: 20, hp: 1150, damage: 62, mitigation_permille: 260, extra_turn_permille: 170, dodge_permille: 130 }
  - { key: OBSIDIAN_WARLORD, minimum_level: 30, hp: 1700, damage: 88, mitigation_permille: 320, extra_turn_permille: 220, dodge_permille: 170 }
  - { key: CINDER_SOVEREIGN, minimum_level: 50, hp: 3600, damage: 190, mitigation_permille: 440, extra_turn_permille: 330, dodge_permille: 250 }
