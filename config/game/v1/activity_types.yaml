# Ce que la montre a enregistré → ce que Grrind en fait.
#
# C'est de l'**équilibrage**, pas du câblage : changer une correspondance change ce qu'une
# activité rapporte, donc ce fichier entre dans le `rulesetVersion` comme le reste.
#
# ————— Pourquoi la table est ici et pas dans l'app —————————————————————————————————————
#
# C'est elle qui décide ce qui vaut de l'XP. Ajouter un sport, ou corriger une
# correspondance ratée, doit se faire sans publier une version sur l'App Store et sans
# attendre que les joueurs mettent à jour. Le client envoie le type **brut** du
# fournisseur et ne l'interprète jamais.
#
# ————— Ce qui n'est pas traduit n'est pas importé ——————————————————————————————————————
#
# Il n'y a pas de discipline « autre » : elle deviendrait le fourre-tout par lequel on
# contourne le plafond d'XP quotidien. Un type absent de cette table est donc écarté — mais
# il est compté et **nommé** au joueur dans la réponse d'import (raison
# `UNSUPPORTED_ACTIVITY`, #92). Une activité qui disparaît sans un mot est un bug de son
# point de vue, même quand c'est le comportement voulu.
#
# ————— Les chaînes sont le contrat —————————————————————————————————————————————————————
#
# Côté Apple ce sont les noms de cases de `HKWorkoutActivityType` tels que Swift les écrit ;
# côté Google, les constantes `EXERCISE_TYPE_*` de `ExerciseSessionRecord`. Une casse qui
# diverge n'est pas une erreur bruyante, c'est un import silencieusement vide — le module
# natif (grrind-app#14, #15) doit envoyer exactement ces valeurs.
#
# Plusieurs types du fournisseur pointent souvent la même discipline. C'est une traduction,
# pas une bijection, et l'inverse n'aurait aucun sens : personne ne convertit une discipline
# Grrind en type Apple.
#
# **Chaque discipline doit être atteignable chez les deux fournisseurs.** Une discipline
# qu'aucun type ne produit est une discipline qu'aucun workout ne portera jamais ; le
# démarrage échoue plutôt que de la laisser dormir.

