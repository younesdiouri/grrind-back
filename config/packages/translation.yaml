framework:
    # Le client envoie son `Accept-Language` : c'est la seule chose que le serveur ait à
    # écouter pour rendre un libellé dans la langue du joueur. Pas de `_locale` dans les
    # routes — l'API n'est pas un site, ses URL ne varient pas avec la langue — et pas de
    # préférence stockée en profil tant que personne ne demande à lire l'app dans une autre
    # langue que celle de son téléphone.
    #
    # @see https://symfony.com/doc/current/translation/locale.html
    set_locale_from_accept_language: true

    # `en` par défaut et en repli : c'est ce que sert un client qui n'annonce rien, ou qui
    # annonce une langue qu'on ne parle pas encore. Le repli n'est pas cosmétique — sans
    # lui, une clé absente d'un catalogue partirait telle quelle sur le réseau, et le joueur
    # lirait `veteran.name` au lieu d'un titre.
    default_locale: en
    enabled_locales: ['en', 'fr']

    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: ['en']
