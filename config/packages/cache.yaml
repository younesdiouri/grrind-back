# Le cache reste sur le filesystem. Le snapshot de règles y survit aux resets des workers ;
# PostgreSQL demeure néanmoins la source de vérité si ce pool est indisponible.
framework:
    cache:
        pools:
            # Le snapshot est relu dans les workers et entre deux requêtes : un pool Array
            # ferait repasser PostgreSQL à chaque reset Symfony et annulerait le hot path.
            game.ruleset:
                adapter: cache.adapter.filesystem
                tags: true
