security:
    password_hashers:
        # La clé est l'interface : tout ce qui s'authentifie par mot de passe est couvert.
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Pas de `property` : le dépôt implémente UserLoaderInterface, parce que
        # l'identifiant est tantôt un UUID (claim `sub`), tantôt une adresse (login).
        app_users:
            entity:
                class: App\Identity\Domain\User

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false

        # `json_login` vérifie le mot de passe, protège de l'énumération de comptes et
        # déclenche le rehash. Rien de tout ça n'est écrit dans le projet.
        login:
            pattern: ^/api/auth/login$
            stateless: true
            provider: app_users
            json_login:
                check_path: identity_login
                username_path: email
                password_path: password
                # Lexik signe le JWT ; AuthenticationResponseListener remplace ensuite
                # le corps par le contrat GRRIND (profil + paire de jetons).
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Inscription, rafraîchissement et déconnexion s'authentifient par ce qu'ils
        # portent dans leur corps. Le logout doit rester possible quand le JWT vient
        # d'expirer.
        auth:
            pattern: ^/api/auth/
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_users
            jwt: ~

        public:
            pattern: ^/
            security: false

    access_control:
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Le hachage est coûteux par construction ; en test on paie le minimum.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
