security:
    password_hashers:
        # La clé est l'interface : tout ce qui s'authentifie par mot de passe est couvert.
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            id: App\Identity\Infrastructure\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_users
            jwt: ~

        # /health et tout ce qui n'est pas sous /api : pas de firewall, pas de session.
        public:
            pattern: ^/
            security: false

    access_control:
        # S'inscrire et se connecter suppose de ne pas être connecté.
        - { path: ^/api/auth, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Le hachage est coûteux par construction ; en test on paie le minimum.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
