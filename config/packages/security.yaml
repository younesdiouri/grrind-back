security:
    # https://symfony.com/doc/current/security.html
    password_hashers:
        # La clé est l'interface : tout ce qui s'authentifie par mot de passe est couvert.
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Pas de `property` : le dépôt implémente UserLoaderInterface. C'est lui qui
        # sait qu'un identifiant est tantôt un UUID (le claim `sub` d'un JWT), tantôt
        # une adresse e-mail (le corps d'un login), et qui normalise la seconde.
        app_users:
            entity:
                class: App\Identity\Domain\User

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false

        # Un firewall pour le seul login : c'est `json_login` qui vérifie le mot de
        # passe, protège de l'énumération de comptes et déclenche le rehash quand
        # l'algorithme a évolué. Rien de tout ça n'est écrit dans le projet.
        login:
            pattern: ^/api/auth/login$
            stateless: true
            provider: app_users
            json_login:
                check_path: identity_login
                username_path: email
                password_path: password
                # Lexik signe le JWT ; AuthenticationResponseListener remplace ensuite
                # le corps par le contrat GRRIND (profil + paire de jetons).
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Inscription, rafraîchissement et déconnexion s'authentifient par ce qu'ils
        # portent dans leur corps, pas par un jeton d'accès. Le logout en particulier
        # doit rester possible quand le JWT vient d'expirer.
        auth:
            pattern: ^/api/auth/
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_users
            jwt: ~

        # /health et tout ce qui n'est pas sous /api : pas de firewall, pas de session.
        public:
            pattern: ^/
            security: false

    access_control:
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Le hachage est coûteux par construction ; en test on paie le minimum.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
