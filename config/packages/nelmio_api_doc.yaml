# La description de l'API, et **rien d'autre que le vocabulaire partagé**.
#
# Le bundle n'est chargé qu'en `dev` : il ne sert qu'à produire `openapi.yaml`, que
# `make openapi` écrit et que la CI compare. Rien n'expose la documentation en HTTP — le
# contrat est le fichier versionné, pas une route de plus sous `^/api`.
#
# **Pourquoi les schémas sont ici et pas en attributs sur les ressources.** Nos ressources
# HTTP rendent leur JSON par un `toArray()` qui compose — `skillPoints` regroupe deux
# champs, un titre en imbrique trois — et aucun générateur ne sait déduire ça de leurs
# propriétés. Écrire les schémas à la main est donc le seul chemin honnête ; ils vivent d'un
# bloc pour qu'on relise le contrat comme un tout plutôt qu'éparpillé sur quinze fichiers.
#
# Ce qui empêche cette description de mentir n'est pas la relecture : ce sont les tests, qui
# figent les mêmes formes contre la vraie API — jusqu'à l'ordre des clés du `RewardSummary`
# — plus `OpenApiContractTest`, qui refuse une route non documentée.
when@dev:
    nelmio_api_doc:
        # Seul `^/api` est décrit. `/health` est une sonde d'infrastructure : elle
        # n'appartient pas au contrat client, et la documenter inviterait à s'en servir.
        areas:
            path_patterns:
                - ^/api

        documentation:
            info:
                title: GRRIND
                description: |
                    L'API de GRRIND — le sport en RPG : XP, niveaux, titres, arbres de compétences, loot, séries.

                    **Le serveur arbitre l'horloge.** L'import accepte les bornes du **fournisseur santé** — une
                    séance a eu lieu avant que Grrind en entende parler, aucune horloge serveur n'existe pour un
                    fait passé. Ce qu'il n'accepte pas, c'est une **durée** : elle se recalcule des deux bornes.
                    Le reste de l'arbitrage — fenêtre d'antériorité, chevauchements, plancher et plafond — refuse
                    ce qui ne tient pas debout.

                    **Les écritures de jeu sont idempotentes.** Les routes qui accordent quelque chose exigent un
                    en-tête `Idempotency-Key` : un client mobile rejoue ses requêtes, et le rejeu rend la réponse
                    d'origine sans rien réexécuter.

                    **Les erreurs sont en `application/problem+json`** (RFC 9457). Le membre `type` est un
                    identifiant stable sur lequel un client peut brancher un comportement ; le `detail` est du
                    texte, il peut changer.
                version: 1.0.0

            components:
                # Les réponses d'erreur sont déclarées une fois et référencées par les
                # routes : quinze contrôleurs qui recopieraient le même bloc finiraient par
                # en avoir quinze versions, dont quatorze fausses.
                responses:
                    BadRequest:
                        description: "Requête malformée — en-tête d'idempotence absent, corps illisible."
                        content:
                            application/problem+json:
                                schema: { $ref: '#/components/schemas/ProblemDetails' }
                    Unauthorized:
                        description: |
                            Le jeton d'accès n'a pas fait son travail, et le `type` dit lequel des trois cas
                            c'est — `access-token-missing`, `access-token-expired` ou `access-token-invalid`.
                            La distinction est le tout : **expiré** dit de rafraîchir et de rejouer la requête,
                            **invalide** et **absent** disent de renvoyer le joueur sur l'écran de connexion.
                        content:
                            application/problem+json:
                                schema: { $ref: '#/components/schemas/ProblemDetails' }
                    NotFound:
                        description: |
                            La ressource n'existe pas, **ou n'appartient pas à ce compte**. Les deux cas
                            rendent la même réponse : répondre « interdit » confirmerait l'existence, et un
                            identifiant, ça s'essaie en boucle.
                        content:
                            application/problem+json:
                                schema: { $ref: '#/components/schemas/ProblemDetails' }
                    Conflict:
                        description: "L'état actuel refuse l'opération. Le `type` dit lequel, et les membres supplémentaires disent comment se recaler."
                        content:
                            application/problem+json:
                                schema: { $ref: '#/components/schemas/ProblemDetails' }
                    Forbidden:
                        description: |
                            L'appelant est bien identifié, la ressource existe, et il n'a pas le droit
                            demandé. **C'est ce qui distingue ce statut du 404** : un 403 ne se rend qu'à
                            quelqu'un qui savait déjà que la ressource existe — un membre de la guilde qui
                            n'en est pas le fondateur. À un non-membre, l'API répond 404, sans quoi elle
                            dirait quels UUID désignent une guilde.
                        content:
                            application/problem+json:
                                schema: { $ref: '#/components/schemas/ProblemDetails' }
                    TooManyRequests:
                        description: |
                            Trop d'essais. L'en-tête `Retry-After` dit combien de secondes attendre, et le
                            client doit l'honorer plutôt que de réessayer en boucle. Aujourd'hui seul
                            `POST /api/guilds/join` est limité : un code d'invitation est court par
                            nécessité — il se dicte à voix haute — et c'est ce plafond qui rend le tirage au
                            hasard sans issue.
                        content:
                            application/problem+json:
                                schema: { $ref: '#/components/schemas/ProblemDetails' }
                    UnprocessableEntity:
                        description: "Le corps est bien formé mais son contenu est refusé."
                        content:
                            application/problem+json:
                                schema: { $ref: '#/components/schemas/ValidationProblem' }

                parameters:
                    IdempotencyKey:
                        name: Idempotency-Key
                        in: header
                        required: true
                        description: |
                            Une clé propre à cette tentative, stable au travers des rejeus du client.
                            Rejouer la même clé sur la même requête rend la réponse d'origine sans rien
                            réexécuter, et l'en-tête `Idempotent-Replay: true` le signale. La même clé sur
                            une requête différente est un abus et vaut un 409.
                        schema: { type: string, maxLength: 255 }

                securitySchemes:
                    bearerAuth:
                        type: http
                        scheme: bearer
                        bearerFormat: JWT
                        description: |
                            Le JWT rendu par `/api/auth/login`, `/api/auth/register` ou `/api/auth/refresh`.
                            Quinze minutes de validité — il ne se révoque pas, c'est pour ça qu'il est court.
                            Passé ce délai, on le renouvelle avec le refresh token.

                schemas:
                    # ————— Le vocabulaire des erreurs ——————————————————————————————————
                    ProblemDetails:
                        type: object
                        description: |
                            Une erreur, RFC 9457. `type` est l'identifiant stable de la panne ; `title` et
                            `detail` sont du texte. Certaines erreurs ajoutent leurs propres membres — une
                            violation de validation donne `violations` — pour que le client se recale au lieu
                            d'afficher un refus sec.
                        required: [type, title, status, detail]
                        additionalProperties: true
                        properties:
                            type:
                                type: string
                                format: uri
                                description: |
                                    **L'énumération est exhaustive** : tout ce que le back sait émettre est ici,
                                    pannes de transport comprises. C'est ce qui permet au client d'en faire un
                                    `switch` exhaustif et de laisser son compilateur réclamer un cas quand une
                                    panne s'ajoute — brancher un message sur le statut HTTP à la place ne
                                    marcherait pas, un même statut couvrant des pannes qui n'appellent pas la
                                    même phrase.

                                    `OpenApiContractTest` compare cette liste à ce que le code produit, dans les
                                    deux sens : elle ne peut ni oublier une panne ni en garder une disparue.
                                enum:
                                    # Transport — la requête n'a pas atteint le métier. Ce sont des bugs de
                                    # client, pas des situations de jeu : rien à en dire au joueur qu'une
                                    # erreur technique. Ils sont listés parce que le back les émet, et qu'un
                                    # contrat qui les tait force le client à garder un cas fourre-tout.
                                    - https://grrind.app/problems/bad-request
                                    - https://grrind.app/problems/not-found
                                    - https://grrind.app/problems/forbidden
                                    - https://grrind.app/problems/method-not-allowed
                                    - https://grrind.app/problems/too-many-requests
                                    - https://grrind.app/problems/unsupported-media-type
                                    - https://grrind.app/problems/validation-failed
                                    - https://grrind.app/problems/internal-error
                                    # Idempotence
                                    - https://grrind.app/problems/idempotency-key-required
                                    - https://grrind.app/problems/idempotency-key-in-flight
                                    - https://grrind.app/problems/idempotency-key-reused
                                    # Identité — comptes, jetons, social
                                    - https://grrind.app/problems/email-already-used
                                    - https://grrind.app/problems/email-belongs-to-another-account
                                    - https://grrind.app/problems/invalid-credentials
                                    - https://grrind.app/problems/access-token-missing
                                    - https://grrind.app/problems/access-token-expired
                                    - https://grrind.app/problems/access-token-invalid
                                    - https://grrind.app/problems/invalid-refresh-token
                                    - https://grrind.app/problems/social-sign-in-rejected
                                    - https://grrind.app/problems/social-profile-incomplete
                                    # Entraînement — vidé avec le chronomètre (#85), et l'import (#88)
                                    # ne l'a pas rempli : un workout écarté d'un lot de dix n'empêche
                                    # pas les neuf autres d'être crédités, donc ce n'est pas une erreur
                                    # HTTP mais une entrée de `skipped`. #91 ajoutera des raisons, pas
                                    # des types de panne.
                                    # Progression
                                    - https://grrind.app/problems/title-unknown
                                    - https://grrind.app/problems/title-not-unlocked
                                    # Communauté — les deux refus qu'une guilde prononce elle-même.
                                    # Les deux sont des 409 : la requête était légitime, c'est l'état
                                    # qui la refuse, et il peut changer sans que le client s'y prenne
                                    # autrement. `guild-is-full` porte sa capacité en membre
                                    # d'extension, pour que l'app puisse l'écrire dans la phrase.
                                    - https://grrind.app/problems/guild-is-full
                                    - https://grrind.app/problems/player-already-in-a-guild
                                    - https://grrind.app/problems/guild-not-found
                                    # Un seul type pour « inconnu », « expiré » et « révoqué ».
                                    # Les distinguer ferait de la route un oracle qui dit quels
                                    # codes existent — le client affiche la même phrase dans les
                                    # trois cas, et c'est la bonne phrase.
                                    - https://grrind.app/problems/invite-code-not-usable
                            title: { type: string, example: Conflict }
                            status: { type: integer, example: 409 }
                            detail: { type: string }

                    ValidationProblem:
                        description: "Le corps est bien formé mais son contenu est refusé. Chaque violation nomme son champ."
                        allOf:
                            - $ref: '#/components/schemas/ProblemDetails'
                            - type: object
                              properties:
                                  violations:
                                      type: array
                                      items:
                                          type: object
                                          required: [field, message]
                                          properties:
                                              field: { type: string, example: email }
                                              message: { type: string }

                    # ————— Identité ————————————————————————————————————————————————————
                    PlayerTitle:
                        type: object
                        description: |
                            **La seule forme d'un titre dans toute l'API** — débloqué comme verrouillé, dans le
                            profil, sur le mur des titres et dans une récompense. Un seul type à décoder, un
                            seul composant à dessiner.

                            `unlockedAt` à `null` est ce qui distingue les deux états. `progress` est toujours
                            renseignée : sur un titre acquis, `current` vaut `target`.
                        required: [id, name, hint, unlocked, unlockedAt, progress]
                        properties:
                            id: { type: string, example: first_steps }
                            name: { type: string, description: "Déjà traduit, dans la langue négociée sur `Accept-Language`.", example: First Steps }
                            hint: { type: string, description: "Ce qu'il reste à faire, rédigé.", example: Complete your first session }
                            unlocked: { type: boolean }
                            unlockedAt: { type: string, format: date-time, nullable: true }
                            progress:
                                type: object
                                required: [current, target, unit]
                                properties:
                                    current: { type: integer, description: "Écrêté à `target` — une barre ne dépasse pas." }
                                    target: { type: integer }
                                    unit: { type: string, enum: [LEVELS, XP, SESSIONS, SECONDS] }

                    GuildName:
                        type: object
                        required: [name]
                        description: |
                            Le nom seul. **Il n'est pas unique**, et il ne le deviendra pas : on n'entre
                            dans une guilde que par un code d'invitation, donc rien ne dépend de pouvoir la
                            désigner par son nom. Deux guildes homonymes sont un cas normal.
                        properties:
                            name: { type: string, minLength: 1, maxLength: 40, example: Les Lève-Tôt }

                    Guild:
                        type: object
                        required: [id, name, createdAt, memberCount, capacity, role]
                        description: |
                            Une guilde, vue par l'un de ses membres. Elle **ne produit aucune valeur de
                            jeu** en v1 : ni XP, ni modificateur, ni loot. Elle réunit des joueurs, c'est
                            tout.
                        properties:
                            id: { type: string, format: uuid }
                            name: { type: string, maxLength: 40 }
                            createdAt: { type: string, format: date-time }
                            memberCount: { type: integer, example: 12 }
                            capacity:
                                type: integer
                                example: 30
                                description: |
                                    La capacité vient de l'équilibrage du serveur et voyage avec la
                                    réponse : l'écran affiche « 12 / 30 », et embarquer le dénominateur
                                    dans l'app obligerait à repasser par l'App Store pour le corriger.
                            role:
                                type: string
                                enum: [FOUNDER, MEMBER]
                                description: |
                                    Le rôle de **l'appelant**, pas une propriété de la guilde. Il sert à
                                    décider quoi dessiner — le bouton « dissoudre » n'existe que pour le
                                    fondateur — jamais à autoriser : le serveur reste seul juge, et
                                    l'action est de toute façon revérifiée.

                    GuildInviteCode:
                        type: object
                        required: [code, expiresAt]
                        description: |
                            Le laissez-passer d'une guilde. Il **remplace l'annuaire au lieu de le
                            compléter** : aucune recherche de joueur n'existe, et une recherche par adresse
                            rendrait l'API capable de confirmer qu'une adresse a un compte. Le code se
                            partage hors de l'app, et seul un joueur déjà inscrit et connecté peut le
                            consommer.
                        properties:
                            code:
                                type: string
                                minLength: 8
                                maxLength: 8
                                example: K7QM3XPB
                                description: |
                                    Huit caractères sur un alphabet **amputé de ce qui se confond** : ni
                                    `O` ni `0`, ni `I`, `L` ou `1`. Un code se lit au téléphone et se
                                    recopie d'une capture d'écran.
                            expiresAt:
                                type: string
                                format: date-time
                                description: |
                                    Une date et non une durée restante : l'écran affiche « valable jusqu'à
                                    demain 18 h », et des secondes se périmeraient dans la réponse
                                    elle-même.

                    GuildJoin:
                        type: object
                        required: [code]
                        description: |
                            **Aucun identifiant de guilde** : c'est le code qui la désigne, sans quoi il
                            suffirait d'un UUID pour entrer. Le serveur normalise la casse et les espaces,
                            donc un code collé depuis un message passe tel quel.
                        properties:
                            code: { type: string, minLength: 8, maxLength: 8, example: K7QM3XPB }

                    UserProfile:
                        type: object
                        required: [id, email, displayName, timezone, registeredAt, title, nextTitle]
                        properties:
                            id: { type: string, format: uuid }
                            email: { type: string, format: email }
                            displayName: { type: string }
                            timezone:
                                type: string
                                description: "Identifiant IANA. **Le streak et le plafond quotidien se calculent dedans** : c'est un attribut de profil, jamais une déduction."
                                example: Europe/Paris
                            registeredAt: { type: string, format: date-time }
                            title:
                                description: "Le titre porté, ou `null` si le joueur n'en a débloqué aucun ou n'en affiche aucun."
                                nullable: true
                                allOf: [{ $ref: '#/components/schemas/PlayerTitle' }]
                            nextTitle:
                                description: "Le plus proche d'aboutir parmi ceux qui restent. `null` quand il les a tous."
                                nullable: true
                                allOf: [{ $ref: '#/components/schemas/PlayerTitle' }]

                    TokenPair:
                        type: object
                        description: |
                            Deux jetons de nature différente. Le JWT porte l'identité et ne se révoque pas —
                            d'où sa courte durée. Le refresh token est **à usage unique et rotatif**, groupé par
                            famille : une famille est un appareil connecté, s'en déconnecter la révoque
                            entièrement. Rejouer un jeton déjà consommé révoque toute la famille.
                        required: [accessToken, tokenType, expiresIn, refreshToken, refreshTokenExpiresAt]
                        properties:
                            accessToken: { type: string }
                            tokenType: { type: string, enum: [Bearer] }
                            expiresIn: { type: integer, description: "Secondes de validité du JWT.", example: 900 }
                            refreshToken: { type: string }
                            refreshTokenExpiresAt: { type: string, format: date-time }

                    AuthSession:
                        type: object
                        description: "Ce que rendent l'inscription, la connexion et le rafraîchissement — le profil et la paire de jetons, en une réponse."
                        required: [user, tokens]
                        properties:
                            user: { $ref: '#/components/schemas/UserProfile' }
                            tokens: { $ref: '#/components/schemas/TokenPair' }

                    # ————— Entraînement ————————————————————————————————————————————————
                    Workout:
                        type: object
                        description: |
                            **La seule forme d'un workout dans toute l'API** — l'historique la sert, le `SyncSummary`
                            l'embarque telle quelle. Un client décode un seul type.

                            Une séance **déjà faite** : elle n'a pas d'état, et `endedAt` comme `durationSeconds` ne
                            sont pas nullables. Un workout arrive terminé ou n'arrive pas.

                            `durationSeconds` est calculée par le serveur à partir des deux bornes, jamais recopiée
                            d'un champ envoyé par le client. C'est la durée **réellement mesurée** : au-delà du
                            plafond, l'XP est calculée sur une durée écrêtée, mais l'historique dit ce qui s'est
                            passé.

                            **Les mesures sont nullables, et c'est structurel** : aucun appareil ne fournit tout.
                            `null` veut dire « non mesuré », jamais zéro — un tour de piste plat a bien un dénivelé
                            de zéro.
                        required: [id, discipline, source, trust, startedAt, endedAt, durationSeconds, distanceMeters, calories, elevationGainMeters, averageHeartRate, externalId]
                        properties:
                            id: { type: string, format: uuid }
                            discipline: { type: string, enum: [RUNNING, WALKING, CYCLING, SWIMMING, STRENGTH, HIIT, HIKING, MOBILITY, CLIMBING] }
                            source:
                                type: string
                                enum: [APPLE_HEALTH, HEALTH_CONNECT]
                                description: |
                                    L'agrégateur de plateforme qui a rapporté la séance, pas l'appareil qui l'a
                                    mesurée : une montre Garmin arrive en `APPLE_HEALTH` sur iPhone et en
                                    `HEALTH_CONNECT` sur Android.
                            trust:
                                type: string
                                enum: [DECLARED, PROVIDER_VERIFIED]
                                description: "Toujours `PROVIDER_VERIFIED` aujourd'hui : les deux sources sont vérifiées. `DECLARED` reste le plancher de l'échelle, pas une valeur morte."
                            startedAt: { type: string, format: date-time }
                            endedAt: { type: string, format: date-time }
                            durationSeconds: { type: integer }
                            distanceMeters: { type: integer, nullable: true }
                            calories: { type: integer, nullable: true }
                            elevationGainMeters: { type: integer, nullable: true }
                            averageHeartRate: { type: integer, nullable: true }
                            externalId:
                                type: string
                                nullable: true
                                description: "L'identifiant chez le fournisseur, rendu parce que c'est le client qui l'a envoyé : il peut ainsi rapprocher sa liste HealthKit de ce que le serveur connaît déjà, sans deviner."

                    WorkoutPage:
                        type: object
                        description: |
                            Une page d'historique, **dans l'ordre de la pratique** : `startedAt` décroissant, puis
                            l'identifiant pour départager deux séances commencées à la même seconde.

                            `nextCursor` est une **chaîne opaque** — le client la renvoie telle quelle, il n'a rien à
                            y lire. `null` signifie la fin ; il n'y a pas de total, un défilement infini n'en a aucun
                            usage.
                        required: [workouts, nextCursor]
                        properties:
                            workouts:
                                type: array
                                items: { $ref: '#/components/schemas/Workout' }
                            nextCursor: { type: string, nullable: true }

                    SyncState:
                        type: object
                        description: |
                            De quoi demander la bonne fenêtre à HealthKit ou Health Connect.

                            **Le curseur vient du serveur.** Le client peut garder sa date de dernière
                            synchronisation en local, et il le fera pour éviter un aller-retour au démarrage — mais
                            il ne doit pas en *dépendre* : réinstallation, changement d'appareil, second appareil sur
                            le même compte. Le cache local est une optimisation, pas la vérité.

                            **La fenêtre est servie et pas codée en dur** : elle doit pouvoir bouger sans publication
                            sur les stores. Une app qui demanderait trente jours pendant que le serveur en accepte
                            soixante enverrait moins que ce qu'elle pourrait.
                        required: [lastImportedAt, importWindowDays]
                        properties:
                            lastImportedAt:
                                type: string
                                format: date-time
                                nullable: true
                                description: |
                                    La fin du workout le plus récent que le serveur ait en base — pas la date du dernier
                                    appel d'import, qui a pu ne rien apporter. Les séances archivées hors fenêtre comptent :
                                    ce qu'on désigne ici est la frontière de ce que le serveur **connaît**, pas de ce qu'il a
                                    payé. `null` sur un compte qui n'a jamais synchronisé.
                            importWindowDays:
                                type: integer
                                example: 30
                                description: "Au-delà, une séance est conservée mais ne rapporte pas d'XP. C'est ce qui empêche trois ans d'archives d'amener un joueur au niveau 60 avant sa première course pour Grrind."

                    WorkoutImportRequest:
                        type: object
                        description: |
                            Ce que la montre a enregistré depuis la dernière synchronisation. **Un lot, pas un
                            workout** : revenir après dix jours d'absence avec trois séances à créditer est le cas
                            nominal.

                            Le client envoie le **type brut du fournisseur**, jamais une `discipline` : la
                            traduction est serveur, ce qui permet d'ouvrir un sport sans publier sur les stores.
                            Un type inconnu n'est pas une erreur — la séance est écartée et nommée dans la
                            réponse.

                            **La durée n'est pas un champ.** Elle se dérive de `startedAt` et `endedAt`, arbitrée
                            par le serveur : l'accepter en entrée donnerait au client une prise sur ce qu'il gagne.
                        required: [workouts]
                        properties:
                            workouts:
                                type: array
                                minItems: 1
                                maxItems: 200
                                items: { $ref: '#/components/schemas/ImportedWorkout' }

                    ImportedWorkout:
                        type: object
                        description: "Une séance candidate. Les mesures sont toutes facultatives, et c'est structurel : aucun appareil ne fournit tout. `null` veut dire « non mesuré », jamais zéro."
                        required: [externalId, source, activityType, startedAt, endedAt]
                        properties:
                            externalId:
                                type: string
                                maxLength: 128
                                description: "`HKWorkout.uuid` côté Apple, `metadata.id` côté Health Connect. Il porte toute la protection contre le double crédit — le renvoyer à l'identique est ce qui rend une resynchronisation inoffensive."
                            source: { type: string, enum: [APPLE_HEALTH, HEALTH_CONNECT] }
                            activityType:
                                type: string
                                maxLength: 64
                                description: "Le nom de case `HKWorkoutActivityType` côté Apple, la constante `EXERCISE_TYPE_*` côté Health Connect. Envoyé tel quel, sans interprétation."
                                example: traditionalStrengthTraining
                            startedAt: { type: string, format: date-time }
                            endedAt: { type: string, format: date-time }
                            distanceMeters: { type: integer, minimum: 0, nullable: true }
                            calories: { type: integer, minimum: 0, nullable: true }
                            elevationGainMeters: { type: integer, minimum: 0, nullable: true }
                            averageHeartRate: { type: integer, minimum: 1, maximum: 300, nullable: true }

                    SyncSummary:
                        type: object
                        description: |
                            **Le contrat le plus coûteux à casser du produit**, dans sa forme multi-workouts. Ce que
                            le joueur reçoit quand sa montre a fini de parler.

                            **L'ordre des champs est l'ordre de l'animation**, à deux niveaux : d'abord entre les
                            workouts — `imported` est chronologique, celui du crédit — puis à l'intérieur de chacun.

                            **Rien n'est tronqué.** Au-delà d'une vingtaine de workouts, tout jouer prend plusieurs
                            minutes : c'est une décision de mise en scène, et elle appartient au client. Le serveur
                            envoie tout, le client décide de ce qu'il joue.
                        required: [syncedAt, imported, skipped, totals, rulesetVersion]
                        properties:
                            syncedAt:
                                type: string
                                format: date-time
                                description: "L'horloge du serveur, et le seul instant de ce payload qui ne vienne pas d'un fournisseur. Sert de repère de dernière synchronisation réussie."
                            imported:
                                type: array
                                description: |
                                    Un `RewardSummary` par workout crédité, dans l'ordre chronologique. **C'est
                                    exactement l'objet que le client sait déjà jouer**, palier de départ compris : la
                                    barre part du bon endroit pour *chacun*, et l'enchaînement est continu sans un seul
                                    recalcul côté client.
                                items: { $ref: '#/components/schemas/RewardSummary' }
                            skipped:
                                type: array
                                description: |
                                    Les séances qui n'ont **rien rapporté**, chacune **nommée** et non comptée : le client
                                    doit pouvoir dire « le curling n'est pas encore un sport chez nous » plutôt que « 1
                                    séance ignorée ».

                                    Écarté ne veut pas toujours dire absent. `OUT_OF_WINDOW` écarte le *crédit*, pas la
                                    séance : elle est bien en base et apparaîtra dans l'historique.
                                items:
                                    type: object
                                    required: [externalId, activityType, reason]
                                    properties:
                                        externalId: { type: string }
                                        activityType: { type: string }
                                        reason:
                                            type: string
                                            enum: [ALREADY_IMPORTED, UNSUPPORTED_ACTIVITY, OUT_OF_WINDOW, OVERLAPS, TOO_SHORT]
                                            description: |
                                                `ALREADY_IMPORTED` : déjà en base sous le même couple (source, identifiant). Banal
                                                et attendu — c'est ce que rend un client qui a perdu son curseur.

                                                `UNSUPPORTED_ACTIVITY` : aucune discipline ne correspond. Rien n'est écrit, donc
                                                rien n'est définitif — le jour où le sport entre dans la table serveur, la même
                                                séance renvoyée est créditée.

                                                `OUT_OF_WINDOW` : trop ancienne pour rapporter de l'XP, mais **conservée**. Le
                                                joueur retrouve son passé sans le monnayer, et le premier import devient un moment
                                                de produit au lieu d'un mur.

                                                `OVERLAPS` : une autre séance couvre déjà ce créneau. Ce ne sont pas deux
                                                entraînements, c'est le même vu par deux applications — beaucoup de gens ont Apple
                                                Exercice *et* Strava sans le savoir. C'est l'enregistrement le plus complet qui
                                                gagne, sauf si l'autre est déjà en base.

                                                `TOO_SHORT` : sous le plancher de durée. Un faux départ sur la montre n'est pas une
                                                séance, et rien n'est écrit.
                            totals:
                                nullable: true
                                description: |
                                    Le raccourci de l'écran de résumé — « +847 XP · niveau 10 → 15 » — et ce que voit le
                                    joueur qui saute l'animation.

                                    **C'est un raccourci, jamais une source** : il est entièrement dérivé d'`imported`,
                                    qui dit déjà tout. Deux vérités finissent toujours par diverger.

                                    `null` quand rien n'a été crédité : il n'y a pas d'état d'arrivée quand rien n'est
                                    arrivé, et « niveau 0 → 0 » mentirait à un joueur de niveau 12.
                                allOf: [{ $ref: '#/components/schemas/SyncTotals' }]
                            rulesetVersion:
                                type: string
                                description: "L'équilibrage sous lequel la synchronisation a été calculée. Affiché dans un rapport de bug : c'est ce qui rend une capture d'écran exploitable."

                    SyncTotals:
                        type: object
                        required: [levelBefore, levelAfter, xpBefore, xpAfter, xpAwarded, workoutCount]
                        properties:
                            levelBefore: { type: integer, example: 10 }
                            levelAfter: { type: integer, example: 15 }
                            xpBefore: { type: integer }
                            xpAfter: { type: integer }
                            xpAwarded: { type: integer, description: "La somme des montants accordés, écarts non compris — un workout écarté n'a rien rapporté." }
                            workoutCount: { type: integer, description: "Le nombre de workouts **crédités**, donc la longueur d'`imported`." }

                    # ————— Progression —————————————————————————————————————————————————
                    XpLine:
                        type: object
                        description: |
                            Une contribution au total, entier signé. Un multiplicateur se résout en points
                            **avant** d'arriver ici : ce qui est écrit est ce que le joueur a reçu, pas la
                            formule. Les deux dernières sources sont des garde-fous, négatives au crédit.

                            **Une ligne à zéro n'existe pas.** Une métrique non mesurée, un bonus trop petit
                            pour peser, un garde-fou qui n'a rien repris : rien de tout ça n'occupe une ligne
                            d'animation. Le client peut donc jouer chaque ligne sans la tester.
                        required: [source, amount]
                        properties:
                            source:
                                type: string
                                enum: [BASE, DISTANCE, ELEVATION, STREAK, ITEM, SKILL, LEAGUE, DIMINISHING, DAILY_CAP]
                                description: |
                                    `BASE` est le temps — une minute vaut un point. `DISTANCE` et `ELEVATION`
                                    sont ce que le terrain ajoute, et n'apparaissent que sur les disciplines où
                                    une montre les mesure de façon fiable. Les quatre suivantes sont les
                                    contributeurs de modificateurs ; les deux dernières, les garde-fous.
                            amount: { type: integer, example: -55 }

                    RewardSummary:
                        type: object
                        description: |
                            Ce que le joueur reçoit pour **un** workout crédité. Un `SyncSummary` en contient
                            autant qu'il y a eu de séances, dans l'ordre chronologique.

                            **L'ordre des champs est l'ordre de l'animation** : le client le joue de haut en
                            bas — la séance se referme, la barre d'XP se remplit ligne à ligne, le niveau
                            bascule, le titre tombe, puis le loot et la série. Un champ déplacé change la mise
                            en scène.

                            **Un seul aller-retour.** Rien ici ne demande de recharger quoi que ce soit avant de
                            jouer l'animation — d'où le palier donné avant *et* après, et les titres déjà
                            traduits.

                            `loot`, `streak` et `unlockableNodes` sont **présents et vides** jusqu'aux Lots 6, 5
                            et 7. Une clé qui apparaîtrait plus tard obligerait un client déjà déployé à la
                            rendre optionnelle pour toujours.
                        required: [session, xp, level, titlesUnlocked, loot, streak, unlockableNodes, rulesetVersion]
                        properties:
                            session: { $ref: '#/components/schemas/Workout' }
                            xp:
                                type: object
                                required: [awarded, breakdown]
                                properties:
                                    awarded: { type: integer, description: "La somme du `breakdown`, jamais autre chose.", example: 145 }
                                    breakdown:
                                        type: array
                                        description: "Dans l'ordre d'affichage. Le client ne le trie pas, il le joue."
                                        items: { $ref: '#/components/schemas/XpLine' }
                            level:
                                type: object
                                required: [before, xpIntoLevelBefore, xpToNextLevelBefore, after, reached, totalXp, xpIntoLevel, xpToNextLevel, skillPointsGranted]
                                properties:
                                    before: { type: integer, example: 1 }
                                    xpIntoLevelBefore:
                                        type: integer
                                        example: 30
                                        description: "Où en était la barre avant la séance. Le client l'y place, **puis** la remplit."
                                    xpToNextLevelBefore:
                                        type: integer
                                        nullable: true
                                        example: 70
                                        description: "Avec le précédent, la largeur du palier de départ. Elle ne se redéduit pas du reste dès que plusieurs niveaux sont franchis, et sans elle la barre repart de zéro pour un joueur qui n'y était pas. `null` au niveau maximum."
                                    after: { type: integer, example: 2 }
                                    reached:
                                        type: array
                                        description: "Les niveaux franchis, dans l'ordre. En gagner plusieurs d'un coup est un cas normal — le client les anime tous. Vide quand rien ne bouge."
                                        items: { type: integer }
                                    totalXp: { type: integer }
                                    xpIntoLevel: { type: integer }
                                    xpToNextLevel:
                                        type: integer
                                        nullable: true
                                        description: Ce qu'il **reste** à gagner. `null` signifie le niveau maximum ; zéro voudrait dire « atteint ».
                                    skillPointsGranted: { type: integer }
                            titlesUnlocked:
                                type: array
                                description: "Vide le plus souvent — un titre est un événement rare, c'est ce qui en fait un."
                                items: { $ref: '#/components/schemas/PlayerTitle' }
                            loot: { type: array, description: 'Lot 6 : toujours vide aujourd''hui.', items: { type: object } }
                            streak: { type: object, nullable: true, description: 'Lot 5 : toujours `null` aujourd''hui.' }
                            unlockableNodes: { type: array, description: 'Lot 7 : toujours vide aujourd''hui.', items: { type: object } }
                            rulesetVersion:
                                type: string
                                description: "L'équilibrage sous lequel ces montants ont été accordés. Le client n'en fait rien ; un rapport de bug, si."

                    Progression:
                        type: object
                        description: "L'état du joueur — l'écran d'accueil de l'app en une requête, servi du seul snapshot."
                        required: [level, totalXp, xpIntoLevel, xpToNextLevel, skillPoints, activeTitle, unlockedTitles, rulesetVersion, lastProgressionAt]
                        properties:
                            level: { type: integer }
                            totalXp: { type: integer }
                            xpIntoLevel: { type: integer }
                            xpToNextLevel: { type: integer, nullable: true, description: '`null` au niveau maximum.' }
                            skillPoints:
                                type: object
                                description: |
                                    Deux nombres, alors qu'ils valent la même chose aujourd'hui. `earned` est un
                                    cumul de carrière qui ne redescend pas, `available` un solde que les arbres
                                    feront baisser. Les fondre obligerait à renommer — donc à casser le client —
                                    au premier point dépensé.
                                required: [earned, available]
                                properties:
                                    earned: { type: integer }
                                    available: { type: integer }
                            activeTitle:
                                nullable: true
                                allOf: [{ $ref: '#/components/schemas/PlayerTitle' }]
                            unlockedTitles:
                                type: array
                                items: { $ref: '#/components/schemas/PlayerTitle' }
                            rulesetVersion: { type: string }
                            lastProgressionAt: { type: string, format: date-time, nullable: true, description: '`null` pour un joueur qui n''a encore rien fait.' }

                    TitleBoard:
                        type: object
                        description: |
                            Le catalogue **entier**, traduit et situé. Pas seulement l'acquis : un mur qui ne
                            montrerait que l'atteint ne donnerait rien à viser.
                        required: [activeTitleId, titles]
                        properties:
                            activeTitleId:
                                type: string
                                nullable: true
                                description: "Redondant avec le tableau — il évite de le parcourir pour savoir quoi cocher, et dit `null` sans ambiguïté."
                            titles:
                                type: array
                                items: { $ref: '#/components/schemas/PlayerTitle' }

                    XpTransaction:
                        type: object
                        description: |
                            Une écriture au ledger. **Le ledger est la vérité** ; le niveau et le total en sont
                            des projections. Rien ne s'efface : une séance invalidée produit une écriture
                            négative, et les deux restent.
                        required: [id, sourceId, reason, discipline, amount, durationSeconds, breakdown, rulesetVersion, occurredAt]
                        properties:
                            id: { type: string, format: uuid }
                            sourceId: { type: string, format: uuid, description: "Ce qui a produit l'écriture — l'identifiant du workout." }
                            reason: { type: string, enum: [SESSION_COMPLETED, SESSION_INVALIDATED] }
                            discipline: { type: string, enum: [RUNNING, WALKING, CYCLING, SWIMMING, STRENGTH, HIIT, HIKING, MOBILITY, CLIMBING] }
                            amount: { type: integer, description: "Signé. La somme du `breakdown`, jamais autre chose." }
                            durationSeconds: { type: integer, description: "Signée elle aussi — négative sur une annulation." }
                            breakdown:
                                type: array
                                items: { $ref: '#/components/schemas/XpLine' }
                            rulesetVersion: { type: string, description: "Celui du calcul, pas celui d'aujourd'hui. C'est ce qui permet de rééquilibrer sans corrompre l'historique." }
                            occurredAt:
                                type: string
                                format: date-time
                                description: |
                                    **L'instant du sport, pas celui de l'écriture.** Un workout de mardi importé
                                    vendredi est daté de mardi : c'est ce qui range l'écriture dans la bonne journée,
                                    pour le plafond quotidien comme pour l'affichage. L'instant de l'écriture, lui,
                                    est encodé dans l'`id` — c'est un UUID v7.

                    XpHistoryPage:
                        type: object
                        description: "Même pagination qu'à `GET /api/workouts`, curseur opaque compris : deux paginations qui divergeraient coûteraient deux implémentations côté client. L'ordre est celui du sport — `occurredAt` décroissant, puis l'identifiant pour départager."
                        required: [transactions, nextCursor]
                        properties:
                            transactions:
                                type: array
                                items: { $ref: '#/components/schemas/XpTransaction' }
                            nextCursor: { type: string, nullable: true }

            # Par défaut tout est authentifié : c'est l'état d'`^/api`, et l'oubli
            # dangereux est dans l'autre sens. Les routes publiques le disent une par une.
            security:
                - bearerAuth: []
