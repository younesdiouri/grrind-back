doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        server_version: '17'
        profiling_collect_backtrace: '%kernel.debug%'

        # Un type par value object persistable. Le nom du type est celui qu'on
        # écrit dans les #[Column] : il fait partie du schéma, il ne bouge plus.
        types:
            timezone: App\Shared\Infrastructure\Doctrine\Type\TimezoneType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        # Un mapping par module, déclaré au lot correspondant. Pas d'auto_mapping :
        # on veut que l'ajout d'un module soit un acte explicite.
        mappings:
            Shared:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/Domain'
                prefix: 'App\Shared\Domain'
                alias: Shared

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
