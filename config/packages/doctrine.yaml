doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        server_version: '17'
        profiling_collect_backtrace: '%kernel.debug%'

        # Le nom du type est celui qu'on écrit dans les #[Column] : il fait partie du
        # schéma, il ne bouge plus.
        types:
            timezone: App\Shared\Infrastructure\Doctrine\Type\TimezoneType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        # Un mapping par module, déclaré au lot correspondant : ajouter un module est un
        # acte explicite, et un module oublié se voit tout de suite.
        auto_mapping: false
        mappings:
            Shared:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/Domain'
                prefix: 'App\Shared\Domain'
                alias: Shared
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Domain'
                prefix: 'App\Identity\Domain'
                alias: Identity
            Training:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Training/Domain'
                prefix: 'App\Training\Domain'
                alias: Training
            Progression:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Progression/Domain'
                prefix: 'App\Progression\Domain'
                alias: Progression
            Community:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Community/Domain'
                prefix: 'App\Community\Domain'
                alias: Community
            # `Enemy` et `EnemyCatalog` restent des objets de domaine purs, résolus depuis
            # le snapshot publié administrable. Déclaré explicitement pour que `Battle`
            # n'ait pas de mapping transverse à câbler.
            Combat:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Combat/Domain'
                prefix: 'App\Combat\Domain'
                alias: Combat
            # `Item`, `ItemCatalog` et les tables de tirage sont des objets de domaine purs,
            # résolus depuis le snapshot publié ; les entités administrables vivent dans
            # `Admin`, sans fuite de mapping dans `Rewards`.
            Rewards:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Rewards/Domain'
                prefix: 'App\Rewards\Domain'
                alias: Rewards
            Admin:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Admin/Domain'
                prefix: 'App\Admin\Domain'
                alias: Admin

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
