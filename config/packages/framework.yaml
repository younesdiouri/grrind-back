framework:
    secret: '%env(APP_SECRET)%'
    # Fly relaie les requêtes depuis son réseau privé IPv6 ; on ne lit Forwarded que de
    # ces proxies explicitement déclarés, jamais d'un client qui pourrait usurper son IP.
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-port', 'x-forwarded-proto']

    # ————— Un refus métier n'est pas un incident (#247) —————————————————————————————————
    #
    # `ErrorListener::resolveLogLevel()` journalise en `CRITICAL` tout ce qui n'implémente pas
    # `HttpExceptionInterface`, quel que soit le statut rendu. Nos `DomainError` n'en
    # implémentent pas — délibérément, voir leur docblock : « la traduction en statut HTTP
    # appartient à la couche UI, jamais au domaine », et c'est `ProblemDetailsListener` qui la
    # fait. Sans cette entrée, un code d'autorisation expiré, une guilde pleine ou un profil
    # introuvable sortent donc au même niveau qu'une base de données disparue.
    #
    # Deux conséquences, et la seconde est la plus coûteuse : une alerte branchée sur `error`
    # sonnerait sur des utilisateurs qui se trompent, et surtout chaque 4xx déclencherait le
    # vidage du tampon de `fingers_crossed` (`monolog.yaml`, `action_level: error`) — cinquante
    # enregistrements de contexte déversés en production à chaque refus banal.
    #
    # `resolveLogLevel()` teste `$throwable instanceof $class` : l'entrée sur la classe
    # abstraite couvre les six catégories d'un coup, sans énumérer les sous-classes.
    #
    # **`log_level` seul, jamais `status_code`.** `ErrorListener::logKernelException()` tourne à
    # la priorité 0, `ProblemDetailsListener` à -64 : Symfony passe donc en premier, et un
    # `status_code` dans ce mapping lui ferait *remplacer* le throwable par une `HttpException`
    # (`ErrorListener.php`, `$event->setThrowable()`). Notre listener ne verrait plus un
    # `DomainError`, tomberait dans la branche `HttpExceptionInterface`, et rendrait un problème
    # **sans le `type` en kebab-case** — le champ sur lequel le client branche ses messages, perdu
    # en silence pour toute l'API. `log_level` ne touche pas au throwable, et c'est tout ce qu'on
    # veut d'ici.
    exceptions:
        App\Shared\Domain\Exception\DomainError:
            log_level: warning

    # L'API reste stateless ; le back-office, lui, utilise le firewall Symfony stateful.
    # Une session n'est donc activée que parce que `/admin` en a réellement besoin.
    session:
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax

when@test:
    framework:
        test: true
        # Le client BrowserKit arrive depuis localhost : il simule le seul proxy autorisé afin
        # de vérifier X-Forwarded-For sans rendre les clients ordinaires dignes de confiance.
        trusted_proxies: ['127.0.0.1']

        # `collect: false` : le profiler est branché mais ne collecte rien tant qu'un test
        # ne le demande pas par `enableProfiler()`. Il ne sert qu'à une chose ici —
        # **compter les requêtes SQL d'une réponse** — et c'est ce qui protège les ports
        # batch du #117 : une guilde de dix membres doit coûter le même nombre de requêtes
        # qu'une de deux, et rien d'autre qu'un compteur ne peut le prouver. Sans ce
        # garde-fou, la première refonte qui transformerait une lecture en boucle passerait
        # la revue sans un mot, et le N+1 n'apparaîtrait qu'en production.
        profiler:
            collect: false
