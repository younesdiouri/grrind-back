framework:
    secret: '%env(APP_SECRET)%'

    # L'API est stateless de bout en bout : tous les firewalls le sont ou n'en ont pas,
    # et rien ne lit la session. En mode worker FrankenPHP, un composant à état qui ne
    # sert à personne est un risque pour rien.
    session: false

when@test:
    framework:
        test: true

        # `collect: false` : le profiler est branché mais ne collecte rien tant qu'un test
        # ne le demande pas par `enableProfiler()`. Il ne sert qu'à une chose ici —
        # **compter les requêtes SQL d'une réponse** — et c'est ce qui protège les ports
        # batch du #117 : une guilde de dix membres doit coûter le même nombre de requêtes
        # qu'une de deux, et rien d'autre qu'un compteur ne peut le prouver. Sans ce
        # garde-fou, la première refonte qui transformerait une lecture en boucle passerait
        # la revue sans un mot, et le N+1 n'apparaîtrait qu'en production.
        profiler:
            collect: false
