framework:
    rate_limiter:
        # ————— Rejoindre une guilde ————————————————————————————————————————————————————
        #
        # Un code d'invitation est court par nécessité : il se dicte à voix haute. Huit
        # caractères sur trente et un font ≈ 8,5 × 10¹¹ combinaisons, ce qui est hors de
        # portée d'un humain mais pas d'une boucle. Ce limiteur est ce qui transforme
        # « improbable » en « impossible » : à dix essais par quart d'heure, essayer un
        # millionième de l'espace demanderait plus de deux mille ans.
        #
        # La clé est **le joueur**, pas l'IP : l'IP change d'un réseau mobile à l'autre au
        # milieu d'un trajet, et deux colocataires la partagent. Seul un compte authentifié
        # peut consommer un code, donc l'identité est disponible et c'est la bonne unité.
        #
        # `sliding_window` et non `fixed_window` : une fenêtre fixe laisse passer vingt
        # essais à cheval sur sa frontière, ce qui double le débit réel au moment précis où
        # quelqu'un cherche à le saturer.
        #
        # Dix, parce qu'un joueur qui recopie un code à la main se trompe deux ou trois
        # fois — les caractères ambigus sont déjà écartés de l'alphabet — et jamais dix.
        guild_join:
            policy: 'sliding_window'
            limit: 10
            interval: '15 minutes'

        # ————— Notifier une guilde qu'une séance a été créditée (#133) ——————————————————
        #
        # `AnnounceGuildActivityHandler` a déjà réduit tout un lot de séances d'un même
        # auteur à une seule annonce (voir `AnnounceGuildActivity`) ; ce plafond protège
        # contre l'accumulation d'*auteurs* différents, pas contre un auteur bavard — une
        # guilde active où plusieurs membres s'entraînent la même heure ne doit pas
        # transformer le téléphone d'un destinataire en centre de notifications.
        #
        # La clé est le destinataire, pas l'auteur : c'est son téléphone qui reçoit, et
        # c'est donc lui que le plafond protège.
        #
        # Vingt par heure couvre une guilde pleine (trente membres, #114) sans jamais la
        # saturer en usage normal : même si chacun des vingt-neuf co-équipiers d'un joueur
        # terminait une séance dans la même heure, il resterait notifié pour l'essentiel
        # d'entre eux.
        guild_activity_push:
            policy: 'sliding_window'
            limit: 20
            interval: '60 minutes'
