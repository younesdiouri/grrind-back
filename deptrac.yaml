# Frontières entre modules. La règle : un module ne connaît que Shared.
# Toute communication inter-modules passe par un événement de domaine ou un port
# explicite — jamais par un import direct.
deptrac:
  paths:
    - ./src

  layers:
    - name: Shared
      collectors:
        - type: directory
          value: src/Shared/.*

    - name: Identity
      collectors:
        - type: directory
          value: src/Identity/.*

    - name: Training
      collectors:
        - type: directory
          value: src/Training/.*

    - name: Progression
      collectors:
        - type: directory
          value: src/Progression/.*

    - name: Rewards
      collectors:
        - type: directory
          value: src/Rewards/.*

    - name: Engagement
      collectors:
        - type: directory
          value: src/Engagement/.*

    - name: Community
      collectors:
        - type: directory
          value: src/Community/.*

    - name: Combat
      collectors:
        - type: directory
          value: src/Combat/.*

    # Le back-office est une couche d'adaptation volontairement au-dessus des modules :
    # EasyAdmin ne remonte jamais dans leurs domaines, l'inverse n'existe pas non plus.
    - name: Admin
      collectors:
        - type: directory
          value: src/Admin/.*

  ruleset:
    # Shared ne dépend d'aucun module métier : c'est ce qui le garde partageable.
    Shared: ~
    Identity:
      - Shared
    Training:
      - Shared
    Progression:
      - Shared
    Rewards:
      - Shared
    Engagement:
      - Shared
    # La guilde réunit des joueurs sans rien savoir d'eux : ni `Identity` ni `Progression`
    # n'apparaissent ici. Ce qu'elle affiche d'un membre arrive par les ports de `Shared`.
    Community:
      - Shared
    # Le combat PvE oppose un joueur à un ennemi du catalogue de config-as-code : aucun
    # module métier n'a encore à y contribuer.
    Combat:
      - Shared
    Admin:
      - Shared
      - Identity
      - Training
      - Progression
      - Rewards
      - Combat
