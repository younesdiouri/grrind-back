# fly.toml app configuration file generated for grrind-back on 2026-08-15T14:58:39Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'grrind-back'
primary_region = 'cdg'

[build]

[env]
  # Sans ça, Caddy active l'auto-HTTPS sur le nom "localhost" et ne sert plus rien en
  # clair sur :80 (juste une redirection vers :443, jamais joignable) — `compose.yaml`
  # le fixe déjà pour le dev, il manquait ici. fly-proxy termine le TLS lui-même et
  # attend du HTTP en clair sur `internal_port`.
  SERVER_NAME = ':80'
  # Les images sont provisoirement locales : le volume est mono-machine et non répliqué.
  # Ne pas scaler `app` horizontalement avant la migration vers un stockage objet.
  GAME_IMAGES_DIR = '/data/game-images'
  # Fly Proxy termine TLS puis joint l'application depuis son pair immédiat. REMOTE_ADDR
  # suit ce pair, comme le recommande Fly pour que Symfony lise X-Forwarded-Proto en sûreté.
  TRUSTED_PROXIES = '127.0.0.1,REMOTE_ADDR'

[[mounts]]
  source = 'game_images'
  destination = '/data/game-images'
  processes = ['app']

# `scheduler_risala` (#191) est consommé par le **même** worker que l'outbox, et pas par un
# groupe à part : le transport du composant Scheduler ne fait que produire un message à
# l'heure ronde, il n'a pas de charge propre. Un second groupe de machines coûterait une
# machine allumée en permanence pour une requête par heure.
#
# `app` : la commande par défaut de l'image (FrankenPHP en mode worker, cf.
# FRANKENPHP_CONFIG dans le Dockerfile — sans rapport avec le groupe `worker` ci-dessous)
# — chaîne vide pour ne pas la remplacer.
# `worker` : le consommateur de l'outbox Messenger (transport `outbox`, cf. messenger.yaml).
# Sans lui, `messenger_messages` s'accumule sans jamais être vidée — c'est le #153 : trente
# `WorkoutImported` en attente, aucune annonce de guilde jamais partie.
[processes]
  app = ""
  worker = "php bin/console messenger:consume outbox scheduler_risala --time-limit=3600 --memory-limit=128M"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Ne vaut que pour le groupe `app` (cf. `processes` juste en dessous) : `worker` n'a pas
  # de `[http_service]`, donc `auto_stop_machines` ne s'y applique jamais — il tourne en
  # permanence, voir `[[restart]]` plus bas. Ce n'est pas une incohérence à corriger : le
  # web reste élastique au-delà de la première machine, le worker ne l'est pas du tout.
  #
  # Décision du #188, et ce `1` ne se remet pas à `0` pour économiser. Mesure du 2026-08-31,
  # image en cours, `cdg`, trois `machine stop` suivis d'un `POST /api/auth/login` :
  # **21,9 / 21,0 / 21,3 s** jusqu'au premier octet, contre 52 à 208 ms machine déjà allumée.
  # Le réveil HealthKit du client abandonne à 10 s sans rejeu (`importTimeoutMsFor('background')`
  # dans `grrind-app`), parce que le chien de garde iOS borne toute la fenêtre du réveil à 25 s.
  # Un démarrage à froid ne dépasse donc pas ce budget de temps en temps : il le dépasse du
  # double, à chaque fois. La séance est bien importée, mais seulement à la prochaine ouverture
  # de l'app — c'est-à-dire jamais au moment où elle a lieu, ce qui est tout ce que le réveil
  # en arrière-plan sert à offrir. Une `shared-cpu-1x` de 512 Mo allumée en permanence est le
  # prix de cet instant ; le groupe `worker` en paie déjà une pour une raison du même ordre
  # (#153). `auto_stop_machines` reste à `stop` : il ne vise plus que d'éventuelles machines
  # au-delà de la première.
  min_machines_running = 1
  processes = ['app']

# `messenger:consume` sort avec le code 0 quand `--time-limit`/`--memory-limit` est atteint
# (cf. doc Symfony : c'est voulu, pour éviter les fuites mémoire d'un process PHP éternel) —
# la politique par défaut de Fly, `on-failure`, ne relance donc jamais un `worker` qui vient
# de sortir proprement. Sans cette section, le worker s'arrêterait au bout d'une heure et on
# reconstruirait la panne du #153 en plus discret. `app` garde le défaut `on-failure` : un
# `http_service` qui meurt sans trafic n'a pas besoin d'être relancé à tout prix.
[[restart]]
  policy = 'always'
  processes = ['worker']

# Décision du #153 : le worker `messenger:consume` tourne en continu (pas de consommation
# périodique par cron). `stale_window_minutes: 15` et `announcement_delay_seconds: 60`
# (cf. AnnounceGuildActivity) sont calibrés pour un consommateur vivant — une consommation
# une fois par heure transformerait le mode dégradé (fenêtre dépassée reprise par une plus
# récente) en mode nominal, et le délai d'annonce perdrait son sens. Le surcoût d'une
# machine allumée 24h/24 pour ce groupe est accepté en connaissance de cause.
[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
